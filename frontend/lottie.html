<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Lottie WhatsApp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b141a;
      font-family: Arial, sans-serif;
      color: #e9edef;
    }

    .card {
      width: min(440px, 92vw);
      padding: 28px;
      border-radius: 28px;
      background: #111b21;
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
      border: 1px solid rgba(255,255,255,.06);
      text-align: center;
    }

    #lottie {
      width: 280px;
      height: 280px;
      margin: 0 auto 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    p {
      margin: 10px 0 0;
      color: #aebac1;
      font-size: 14px;
      line-height: 1.45;
    }

    .tag {
      display: inline-block;
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      color: #25d366;
      background: rgba(37,211,102,.12);
    }
  </style>
</head>

<body>
  <div class="card">
    <div id="lottie"></div>

    <h1>Prévia — estilo WhatsApp</h1>
    <p>Versão refeita para ficar mais parecida com o visual do WhatsApp.</p>

    <div class="tag">loop automático</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

  <script>
    lottie.loadAnimation({
      container: document.getElementById('lottie'),
      renderer: 'svg',
      loop: true,
      autoplay: true,
      path: './lottie_whatsapp_like_v2.json'
    });
  </script>
</body>
</html>
