<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Atendimento – ZapChats</title>

  <!-- Tema antes do CSS (evita flash) -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('zc:theme');
        const prefersDark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          saved || (prefersDark ? 'dark' : 'light')
        );
      } catch {}
    })();
  </script>

  <!-- Seu CSS global -->
  <link rel="stylesheet" href="/frontend/css/atendimentos.css">

  <!-- libs -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

  <!-- ====== CSS EXTRA EMBUTIDO: WALLPAPER SÓ NO #historico + SETA MOBILE ====== -->
  <style>
    main.whatsapp-auto-bg #historico,
    main.whatsapp-bg-dark #historico,
    main.whatsapp-bg-light #historico{
      background-repeat: repeat !important;
      background-position: 0 0 !important;
      background-size: 400px 400px !important;
    }

    html[data-theme="dark"] main.whatsapp-auto-bg #historico,
    html.dark              main.whatsapp-auto-bg #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    html[data-theme="light"] main.whatsapp-auto-bg #historico,
    html:not(.dark)        main.whatsapp-auto-bg #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    main.whatsapp-bg-dark #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    main.whatsapp-bg-light #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    /* ====== MOBILE: só controla a seta de voltar ====== */
    #chat-back-mobile {
      display: none; /* desktop esconde */
    }

    @media (max-width: 920px) {
      #chat-back-mobile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-right: .5rem;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        border: none;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }

      #chat-back-mobile i {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body style="display:none">
  <!-- Autologin básico -->
  <script>
    (function () {
      const EMPRESA_ID = Number(localStorage.getItem('empresa_id'));
      if (!EMPRESA_ID) location.href = '/login';
      else document.body.style.display = 'block';
    })();
  </script>

  <div class="wpp-root h-[100vh] w-full">

    <!-- LEFTBAR (barra lateral esquerda) -->
    <nav class="wpp-leftbar" aria-label="Menu do atendimento">
      <div class="wpp-leftbar-icons">
        <!-- preenchido via JS copiando de #appSidebarAtt nav (sidebar-atendimentos.html) -->
      </div>

      <div class="wpp-leftbar-bottom">
        <!-- Botão para abrir o flyout completo (perfil, tema, etc) -->
        <button
          id="btnSidebarFlyout"
          type="button"
          class="wpp-leftbar-icon"
          title="Menu"
          aria-label="Abrir menu lateral"
        >
          <i class="fa-regular fa-circle-user"></i>
          <span class="wpp-label">Menu</span>
        </button>
      </div>
    </nav>

    <!-- FLYOUT DO MENU (overlay que recebe .app-sidebar) -->
    <div id="zcSidebarHost" class="zc-flyout" aria-hidden="true">
      <!-- Painel lateral (o JS vai enfiar a .app-sidebar aqui dentro) -->
      <div role="dialog" aria-label="Menu lateral"></div>

      <!-- Backdrop: fecha ao clicar -->
      <button
        class="zc-flyout__backdrop"
        type="button"
        tabindex="-1"
        aria-hidden="true">
      </button>
    </div>

    <!-- COLUNA DE LISTA DE CHATS -->
    <aside class="flex flex-col">
      <div class="wpp-header-externo">
        <div class="wpp-header-titulo-row">
          <img class="wpp-header-logo logo-dark"
               src="/frontend/img/logo-white.png"
               alt="ZapChats (dark)">
          <img class="wpp-header-logo logo-light"
               src="/frontend/img/logo-s-fundo.png"
               alt="ZapChats (light)">

          <!-- Ícones do header (nova conversa + menu no header) -->
          <div class="wpp-header-icons">
            <button
              class="wpp-header-icon"
              id="btn-sidemodal-nova-conversa"
              title="Nova conversa"
              aria-label="Nova conversa"
            >
              <i class="fa fa-plus"></i>
            </button>

            <!-- Kebab NO HEADER (opcional, também abre o flyout) -->
            <button
              id="btnKebabHeader"
              type="button"
              class="wpp-header-icon"
              title="Menu"
              aria-label="Abrir menu"
            >
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
          </div>
        </div>

        <div class="wpp-header-search-row">
          <i class="fa fa-search"></i>
          <input
            type="text"
            class="wpp-header-search"
            id="wpp-header-search"
            placeholder="Pesquisar ou começar uma nova conversa">
        </div>

        <div id="search-results" class="search-results hidden"></div>

        <!-- seletor de instâncias -->
        <div id="inst-switch"></div>

        <div class="wpp-header-filtros-row">
          <button class="wpp-header-filtro ativo">Em atendimento</button>
          <button class="wpp-header-filtro">Aguardando</button>
          <button class="wpp-header-filtro">No bot</button>
          <button class="wpp-header-filtro">Grupos</button>
        </div>
        <select id="filtro-departamento" style="display:none"></select>
      </div>

      <ul id="lista-clientes"></ul>
    </aside>

    <!-- ÁREA DO CHAT -->
    <!-- Escolha UMA classe:
         - whatsapp-auto-bg  (alterna conforme tema)
         - whatsapp-bg-dark  (força imagem escura)
         - whatsapp-bg-light (força imagem clara)
    -->
    <main class="flex flex-col whatsapp-bg-dark">
      <header id="chat-header"
              class="h-16 flex items-center px-4 gap-3 shadow-sm"
              style="display:none;">
        <div class="flex items-center gap-2 relative">
          <!-- seta de voltar (só aparece no mobile via CSS) -->
          <button
            id="chat-back-mobile"
            type="button"
            class="hdr-icon-btn"
            aria-label="Voltar para lista"
            title="Voltar para lista"
          >
            <i class="fa fa-arrow-left"></i>
          </button>

          <span id="chat-avatar"></span>
          <h2 id="chat-title" class="font-medium truncate text-[1.09em]"></h2>

          <!-- Botão de notas: conteúdo é injetado por /atendimentos/ui/notes-drawer.js -->
          <button
            id="btn-sobre"
            class="hdr-icon-btn"
            title="Notas do cliente"
            aria-label="Notas do cliente">
          </button>
        </div>

        <span id="status-bateria" class="text-xs ml-auto"></span>
      </header>

      <!-- Tela de boas-vindas -->
      <section
        id="welcome-screen"
        class="absolute inset-0 flex flex-col items-center justify-center text-center z-10">
        <img src="/frontend/img/wpp.png"
             class="w-52 h-auto mb-6 opacity-100"
             alt="ZapChats Logo">
        <h2 class="text-lg font-semibold mt-2">Mantenha seu celular conectado</h2>
        <p class="max-w-md">
          O ZapChats conecta ao seu telefone para sincronizar suas mensagens.<br>
          Mantenha seu dispositivo conectado à internet para não perder conversas.
        </p>
      </section>

      <!-- Histórico -->
      <section id="historico" style="display:none;"></section>

      <!-- Loading overlay -->
      <div id="chat-loading"
           class="hidden absolute inset-0 z-[50] flex items-center justify-center">
        <div class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-full border-2 animate-spin"></span>
          <span class="text-sm">Carregando conversa…</span>
        </div>
      </div>

      <!-- Footer -->
      <footer id="chat-footer"
              class="flex items-center gap-3 px-4 py-3"
              style="display:none;">
        <button
          type="button"
          class="text-xl"
          id="btn-clipe"
          title="Enviar arquivo"
          aria-label="Enviar arquivo">
          <i class="fa fa-paperclip"></i>
        </button>

        <input id="input-arquivo" type="file" style="display:none" />

        <input
          id="mensagem"
          placeholder="Digite sua resposta…"
          class="flex-1 outline-none px-3 py-2 rounded"
          autocomplete="off"/>

        <button
          id="btn-enviar"
          class="send-btn"
          title="Enviar"
          aria-label="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
          </svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- FLYOUT JS -->
  <script src="/frontend/js/atendimentos/ui/flyout.js"></script>

  <!-- Boot principal -->
  <script type="module" src="/frontend/js/atendimentos/boot/main.js"></script>
  <script type="module" src="/frontend/js/atendimentos/ui/filtros.js"></script>
  <script type="module" src="/frontend/js/pages/atendimentos-autoopen.js"></script>

  <!-- Config do Evolution vinda do backend (.env injetado no template) -->
  <script>
    window.ENV = window.ENV || {};
    window.ENV.EVOLUTION = Object.assign({}, window.ENV.EVOLUTION, {
      apiUrl: "{{ EVOLUTION_URL }}",
      apiKey: "{{ EVOLUTION_APIKEY }}",
      defaultInstance: "{{ EVOLUTION_DEFAULT_INSTANCE }}"
    });
  </script>

  <!-- Agenda (injeta botão e drawer automaticamente) -->
  <script src="/frontend/js/atendimentos/ui/agenda.js"></script>

  <!-- Sincroniza a barra fininha (wpp-leftbar) com o sidebar-atendimentos.html -->
  <script>
    (function setupMiniSidebarFromPartial(){
      const host = document.getElementById('zcSidebarHost');
      const container = document.querySelector('.wpp-leftbar .wpp-leftbar-icons');
      if (!host || !container) return;

      function buildFromSidebar(sidebarNav) {
        container.innerHTML = '';

        const links = sidebarNav.querySelectorAll('a[href]');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (!href || href === '#') return; // pula links vazios

          const labelEl = link.querySelector('.label');
          const labelText = (labelEl && labelEl.textContent || link.textContent || '').trim();
          const miniLink = document.createElement('a');
          miniLink.href = href;
          miniLink.className = 'wpp-leftbar-icon';

          if (labelText) {
            miniLink.title = labelText;
            miniLink.setAttribute('aria-label', labelText);
          }

          // Clona o SVG do ícone
          const iconSource = link.querySelector('.nav-icon svg') || link.querySelector('svg');
          if (iconSource) {
            const iconClone = iconSource.cloneNode(true);
            iconClone.classList.remove('nav-icon-svg'); // opcional
            miniLink.appendChild(iconClone);
          }

          // Label opcional
          if (labelText) {
            const labelSpan = document.createElement('span');
            labelSpan.className = 'wpp-label';
            labelSpan.textContent = labelText;
            miniLink.appendChild(labelSpan);
          }

          container.appendChild(miniLink);
        });

        // Marca página atual
        const path = (location.pathname.replace(/\/+$/, '') || '/');
        Array.from(container.querySelectorAll('a[href]')).forEach(a => {
          let href = a.getAttribute('href') || '';
          href = href.replace(/\/+$/, '') || '/';
          if (href === path) {
            a.setAttribute('aria-current', 'page');
          }
        });
      }

      function tryInit() {
        const sidebarNav = host.querySelector('#appSidebarAtt nav');
        if (sidebarNav) {
          buildFromSidebar(sidebarNav);
          return true;
        }
        return false;
      }

      // Tenta imediatamente (caso o flyout já tenha carregado o partial)
      if (!tryInit()) {
        // Se ainda não, observa o host até o sidebar ser injetado
        const obs = new MutationObserver(() => {
          if (tryInit()) obs.disconnect();
        });
        obs.observe(host, { childList: true, subtree: true });
        window.addEventListener('beforeunload', () => obs.disconnect());
      }
    })();
  </script>

  <!-- Mobile: alternar lista/chat + seta de voltar -->
  <script>
    (function mobileChatToggle(){
      const listEl = document.getElementById('lista-clientes');
      const back   = document.getElementById('chat-back-mobile');

      function isMobile(){
        return window.innerWidth <= 920; // mesmo break do CSS
      }

      // clicar em qualquer conversa abre o chat no mobile
      if (listEl) {
        listEl.addEventListener('click', function(ev){
          const li = ev.target.closest('li.chat-item, li.cliente-item');
          if (!li) return;
          if (isMobile()) {
            document.body.classList.add('is-chat-open');
          }
        });
      }

      // botão de voltar fecha o chat e mostra a lista
      if (back) {
        back.addEventListener('click', function(){
          if (isMobile()) {
            document.body.classList.remove('is-chat-open');
          }
        });
      }

      // se virar desktop, garante layout normal (lista + chat)
      function handleResize(){
        if (!isMobile()) {
          document.body.classList.remove('is-chat-open');
        }
      }
      window.addEventListener('resize', handleResize);
      handleResize();
    })();
  </script>
</body>
</html>
