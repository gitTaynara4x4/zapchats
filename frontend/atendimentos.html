<html lang="pt-BR" data-theme="dark">
<head>

  <title>Painel de Atendimento – ZapChats</title>

  <script>
    (function () {
      try {
        const saved = localStorage.getItem('zc:theme');
        const prefersDark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          saved || (prefersDark ? 'dark' : 'light')
        );
      } catch {}
    })();
  </script>

        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    main.whatsapp-auto-bg #historico,
    main.whatsapp-bg-dark #historico,
    main.whatsapp-bg-light #historico{
      background-repeat: repeat !important;
      background-position: 0 0 !important;
      background-size: 400px 400px !important;
    }

    html[data-theme="dark"] main.whatsapp-auto-bg #historico,
    html.dark main.whatsapp-auto-bg #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    html[data-theme="light"] main.whatsapp-auto-bg #historico,
    html:not(.dark) main.whatsapp-auto-bg #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    main.whatsapp-bg-dark #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    main.whatsapp-bg-light #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    #chat-back-mobile{display:none}
    @media (max-width:920px){
      #chat-back-mobile{
        display:inline-flex;align-items:center;justify-content:center;
        margin-right:.5rem;width:32px;height:32px;
        border-radius:999px;border:none;background:transparent;
        color:inherit;cursor:pointer;
      }
      #chat-back-mobile i{font-size:1rem}
    }

    .wpp-leftbar .wpp-leftbar-icons a.wpp-leftbar-icon svg{
      width:22px;height:22px;display:block;
    }

    .wpp-leftbar .wpp-leftbar-icons a.wpp-leftbar-icon[aria-current="page"]{
      outline:none;
    }

    .zc-topbar{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .zc-topbar-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .zc-brand-wrap{
      min-width:0;
      display:flex;
      align-items:center;
    }

    .zc-brand-title{
      font-size:1.05rem;
      font-weight:700;
      letter-spacing:-.2px;
      color:var(--text);
      line-height:1;
    }

    #inst-switch{
      display:none !important;
    }

    .zc-inst-row{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .zc-inst-meta{
      display:inline-flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      min-width:0;
    }

    .zc-inst-meta .dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background:var(--accent);
      display:block;
      flex:0 0 auto;
    }

    .zc-inst-title{
      font-size:12px;
      font-weight:600;
      color:var(--text-2);
      white-space:nowrap;
    }

    #zc-inst-count{
      opacity:.85;
    }

    .zc-inst-dropdown{
      position:relative;
      display:inline-block;
      flex:0 0 auto;
      min-width:140px;
      max-width:200px;
    }

    .zc-inst-trigger{
      width:100%;
      min-height:34px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 12px;
      border:0;
      border-radius:999px;
      background:rgba(37,211,102,.12);
      color:var(--accent);
      box-shadow:inset 0 0 0 1px rgba(37,211,102,.30);
      font-size:12.5px;
      font-weight:600;
      cursor:pointer;
      transition:background .15s ease,color .15s ease,box-shadow .15s ease;
    }

    .zc-inst-trigger:hover{
      background:rgba(37,211,102,.16);
      box-shadow:inset 0 0 0 1px rgba(37,211,102,.38);
    }

    .zc-inst-trigger:focus-visible{
      outline:none;
      box-shadow:
        inset 0 0 0 1px rgba(37,211,102,.42),
        0 0 0 2px rgba(37,211,102,.14);
    }

    .zc-inst-trigger-text{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-align:left;
    }

    .zc-inst-trigger i{
      font-size:11px;
      flex:0 0 auto;
      opacity:.9;
      transition:transform .15s ease;
    }

    .zc-inst-dropdown.is-open .zc-inst-trigger i{
      transform:rotate(180deg);
    }

    .zc-inst-menu{
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      z-index:70;
      min-width:100%;
      max-width:280px;
      padding:6px;
      border-radius:14px;
      background:var(--panel-2);
      border:1px solid var(--border);
      box-shadow:0 14px 34px rgba(0,0,0,.28);
      display:none;
    }

    .zc-inst-dropdown.is-open .zc-inst-menu{
      display:block;
    }

    .zc-inst-option{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      padding:10px 12px;
      border:0;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      font-size:13px;
      line-height:1.2;
      text-align:left;
      cursor:pointer;
      transition:background .14s ease,color .14s ease;
    }

    .zc-inst-option:hover{
      background:color-mix(in oklab,var(--panel-3) 84%,transparent);
    }

    .zc-inst-option.is-active{
      background:rgba(37,211,102,.10);
      color:var(--accent);
    }

    .zc-inst-option-count{
      margin-left:auto;
      font-size:11px;
      color:var(--text-2);
      opacity:.82;
    }

    @media (max-width:920px){
      .zc-brand-title{font-size:1rem}
      .zc-inst-row{gap:8px}
      .zc-inst-title{font-size:11px}
      .zc-inst-dropdown{min-width:120px;max-width:170px}
      .zc-inst-trigger{min-height:32px;padding:0 11px;font-size:12px}
      .zc-inst-option{padding:9px 10px;font-size:12.5px}
    }
  </style>

  <script src="/frontend/js/atendimentos/ui/agenda.js"></script>

  <script>
    (async function () {
      const slot = document.getElementById('sidebar-atendimentos-slot');
      if (!slot) return;

      function pick() {
        for (let i = 0; i < arguments.length; i++) {
          const key = arguments[i];
          try {
            let value = localStorage.getItem(key);
            if (!value) continue;

            if (
              (value.startsWith('{') && value.endsWith('}')) ||
              (value.startsWith('[') && value.endsWith(']'))
            ) {
              try { return JSON.parse(value); } catch {}
            }

            return value;
          } catch {}
        }
        return '';
      }

      function jwtInfo() {
        try {
          const tok = pick('access_token', 'token');
          if (!tok || String(tok).split('.').length !== 3) return {};
          return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) || {};
        } catch {
          return {};
        }
      }

      function getInitials(name) {
        const safe = String(name || '').trim();
        if (!safe) return 'U';
        const parts = safe.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
        return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
      }

      function normalizeUrlMaybeRelative(value) {
        const s = String(value || '').trim();
        if (!s) return '';
        if (s.startsWith('data:')) return s;
        if (/^https?:\/\//i.test(s)) return s;
        if (s.charAt(0) === '/') return s;
        return '/' + s.replace(/^\/+/, '');
      }

      function base64ToDataUrl(base64, mime) {
        const raw = String(base64 || '').trim();
        if (!raw) return '';
        if (raw.startsWith('data:')) return raw;
        return 'data:' + (mime || 'image/png') + ';base64,' + raw;
      }

      function getUserInfo() {
        let nome = pick('nome', 'name', 'displayName', 'usuario_nome', 'user_name');
        if (nome && typeof nome === 'object') nome = nome.nome || nome.name || nome.displayName || '';

        let dept = pick('departamento', 'setor', 'department', 'dept', 'usuario_departamento', 'user_department');
        if (dept && typeof dept === 'object') dept = dept.departamento || dept.setor || dept.department || dept.dept || '';

        let email = pick('email', 'userEmail', 'loginEmail', 'usuario_email', 'user_email');

        const obj = pick('usuario', 'user', 'me', 'auth_user', 'profile', 'auth');
        if (obj && typeof obj === 'object') {
          email = email || obj.email || (obj.user && obj.user.email) || '';
          nome  = nome  || obj.nome || obj.name || (obj.user && (obj.user.nome || obj.user.name)) || '';
          dept  = dept  || obj.departamento || obj.setor || (obj.user && (obj.user.departamento || obj.user.setor)) || '';
        }

        const jwt = jwtInfo();
        email = email || jwt.email || jwt.preferred_username || jwt.sub || '';
        nome  = nome  || jwt.name || jwt.given_name || jwt.nickname || '';

        return {
          nome: String(nome || '').trim(),
          dept: String(dept || '').trim(),
          email: String(email || '').trim()
        };
      }

      function getAvatar() {
        try {
          let avatar =
            localStorage.getItem('usuario_avatar') ||
            localStorage.getItem('avatar_url') ||
            '';

          if (!avatar) {
            const jwt = jwtInfo();
            avatar = (jwt && jwt.picture) || '';
          }

          return avatar || '';
        } catch {
          return '';
        }
      }

      async function hydrateUserFromApi() {
        try {
          const res = await fetch('/api/perfil', {
            method: 'GET',
            credentials: 'include',
            headers: { 'Accept': 'application/json' }
          });

          if (!res.ok) return;

          const data = await res.json();
          if (!data || typeof data !== 'object') return;

          const nome = data.nome || data.name || data.usuario_nome || '';
          const email = data.email || data.usuario_email || '';
          const dept = data.departamento || data.setor || data.department || data.dept || data.cargo || '';

          let avatar =
            data.avatar_url ||
            data.foto_url ||
            data.avatar ||
            data.foto ||
            data.picture ||
            '';

          const avatarBase64 =
            data.avatar_base64 ||
            data.foto_base64 ||
            data.avatar_data ||
            '';

          const avatarMime =
            data.avatar_mime ||
            data.foto_mime ||
            'image/png';

          if (!avatar && avatarBase64) {
            avatar = base64ToDataUrl(avatarBase64, avatarMime);
          }

          if (!avatar) avatar = '/api/perfil/avatar';
          avatar = normalizeUrlMaybeRelative(avatar);

          try {
            if (nome) localStorage.setItem('usuario_nome', String(nome));
            if (email) localStorage.setItem('usuario_email', String(email));
            if (dept) localStorage.setItem('usuario_departamento', String(dept));
            if (avatar) {
              localStorage.setItem('usuario_avatar', avatar);
              localStorage.setItem('avatar_url', avatar);
              localStorage.setItem('usuario_avatar_v', String(Date.now()));
            }
          } catch {}
        } catch {}
      }

      function isDarkTheme() {
        return document.documentElement.classList.contains('dark') ||
               document.documentElement.getAttribute('data-theme') === 'dark';
      }

      function setTheme(mode) {
        const dark = String(mode) === 'dark';
        const root = document.documentElement;

        try {
          if (window.AppTheme && typeof window.AppTheme.set === 'function') {
            window.AppTheme.set(dark ? 'dark' : 'light');
          }
        } catch {}

        root.classList.toggle('dark', dark);
        root.setAttribute('data-theme', dark ? 'dark' : 'light');

        try {
          localStorage.setItem('theme', dark ? 'dark' : 'light');
          localStorage.setItem('valora_theme', dark ? 'dark' : 'light');
          localStorage.setItem('zc:theme', dark ? 'dark' : 'light');
        } catch {}
      }

      function goToUrl(url) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.location.href = url;
          } else {
            window.location.href = url;
          }
        } catch {
          window.location.href = url;
        }
      }

      async function doLogout() {
        try {
          await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
        } catch {}

        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch {}

        window.location.replace('/');
      }

      function initMiniSidebar() {
        const userBtn = document.getElementById('wppUserMenuBtn');
        const userMenu = document.getElementById('wppUserMenu');

        const openProfileBtn = document.getElementById('wppOpenProfileBtn');
        const myPlanBtn = document.getElementById('wppMyPlanBtn');
        const configBtn = document.getElementById('wppConfigBtn');
        const themeBtn = document.getElementById('wppThemeBtn');
        const logoutBtn = document.getElementById('wppLogoutBtn');

        const userNameEl = document.getElementById('wppUserName');
        const userEmailEl = document.getElementById('wppUserEmail');
        const userInitialsEl = document.getElementById('wppUserInitials');
        const userAvatarImg = document.getElementById('wppUserAvatarImg');

        function renderUser() {
          const user = getUserInfo();
          const avatar = getAvatar();

          if (userNameEl) userNameEl.textContent = user.nome || 'Usuário';
          if (userEmailEl) userEmailEl.textContent = user.email || user.dept || 'Sem e-mail';

          if (userInitialsEl) {
            userInitialsEl.textContent = getInitials(user.nome || user.email || 'Usuário');
            userInitialsEl.style.display = '';
          }

          if (userAvatarImg) {
            if (avatar) {
              let v = '';
              try { v = localStorage.getItem('usuario_avatar_v') || ''; } catch {}

              let src = avatar;
              if (!String(avatar).startsWith('data:')) {
                src = avatar + (String(avatar).includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v || Date.now());
              }

              userAvatarImg.onerror = function () {
                userAvatarImg.removeAttribute('src');
                userAvatarImg.style.display = 'none';
                if (userInitialsEl) userInitialsEl.style.display = '';
              };

              userAvatarImg.src = src;
              userAvatarImg.style.display = 'block';
              if (userInitialsEl) userInitialsEl.style.display = 'none';
            } else {
              userAvatarImg.removeAttribute('src');
              userAvatarImg.style.display = 'none';
              if (userInitialsEl) userInitialsEl.style.display = '';
            }
          }
        }

        function closeUserMenu() {
          if (userMenu) userMenu.classList.remove('show');
          if (userBtn) {
            userBtn.classList.remove('active');
            userBtn.setAttribute('aria-expanded', 'false');
          }
        }

        function toggleUserMenu() {
          if (!userMenu || !userBtn) return;
          const willOpen = !userMenu.classList.contains('show');
          userMenu.classList.toggle('show', willOpen);
          userBtn.classList.toggle('active', willOpen);
          userBtn.setAttribute('aria-expanded', String(willOpen));
        }

        if (userBtn && !userBtn.dataset.bound) {
          userBtn.dataset.bound = '1';
          userBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleUserMenu();
          });
        }

        if (openProfileBtn && !openProfileBtn.dataset.bound) {
          openProfileBtn.dataset.bound = '1';
          openProfileBtn.addEventListener('click', function () {
            closeUserMenu();
            goToUrl('/perfil.html');
          });
        }

        if (myPlanBtn && !myPlanBtn.dataset.bound) {
          myPlanBtn.dataset.bound = '1';
          myPlanBtn.addEventListener('click', function () {
            closeUserMenu();
            goToUrl('/meu-plano');
          });
        }

        if (configBtn && !configBtn.dataset.bound) {
          configBtn.dataset.bound = '1';
          configBtn.addEventListener('click', function () {
            closeUserMenu();
            goToUrl('/configuracoes.html');
          });
        }

        if (themeBtn && !themeBtn.dataset.bound) {
          themeBtn.dataset.bound = '1';
          themeBtn.addEventListener('click', function () {
            setTheme(isDarkTheme() ? 'light' : 'dark');
            closeUserMenu();
          });
        }

        if (logoutBtn && !logoutBtn.dataset.bound) {
          logoutBtn.dataset.bound = '1';
          logoutBtn.addEventListener('click', function () {
            closeUserMenu();
            doLogout();
          });
        }

        document.addEventListener('click', function (e) {
          if (!userMenu || !userBtn) return;
          if (!userMenu.contains(e.target) && !userBtn.contains(e.target)) {
            closeUserMenu();
          }
        });

        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') closeUserMenu();
        });

        renderUser();

        window.addEventListener('storage', function (e) {
          if ([
            'usuario_nome', 'nome', 'name', 'displayName',
            'usuario_departamento', 'departamento', 'setor', 'department', 'dept',
            'usuario_email', 'email', 'userEmail', 'loginEmail',
            'usuario_avatar', 'avatar_url', 'usuario_avatar_v',
            'usuario', 'user', 'me', 'auth_user', 'profile', 'auth',
            'access_token', 'token', 'theme', 'valora_theme', 'zc:theme'
          ].indexOf(e.key) >= 0) {
            renderUser();
          }
        });
      }

      try {
        const res = await fetch('/frontend/partials/sidebar-atendimentos.html', {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        slot.innerHTML = await res.text();

        const path = (location.pathname.replace(/\/+$/, '') || '/');
        document.querySelectorAll('.wpp-leftbar .wpp-leftbar-icons a[href]').forEach(a => {
          try {
            const href = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '') || '/';
            if (href === path) a.setAttribute('aria-current', 'page');
          } catch {}
        });

        await hydrateUserFromApi();
        initMiniSidebar();
      } catch (err) {
        console.error('Erro ao carregar sidebar-atendimentos.html:', err);
      }
    })();
  </script>

  <script>
    (function mobileChatToggle(){
      const listEl = document.getElementById('lista-clientes');
      const back   = document.getElementById('chat-back-mobile');

      function isMobile(){ return window.innerWidth <= 920; }

      if (listEl) {
        listEl.addEventListener('click', function(ev){
          const li = ev.target.closest('li.chat-item, li.cliente-item');
          if (!li) return;
          if (isMobile()) document.body.classList.add('is-chat-open');
        });
      }

      if (back) {
        back.addEventListener('click', function(){
          if (isMobile()) document.body.classList.remove('is-chat-open');
        });
      }

      function handleResize(){
        if (!isMobile()) document.body.classList.remove('is-chat-open');
      }

      window.addEventListener('resize', handleResize);
      handleResize();
    })();
  </script>

  <script>
    (function () {
      const source = document.getElementById('inst-switch');
      const dropdown = document.getElementById('zc-inst-dropdown');
      const trigger = document.getElementById('zc-inst-trigger');
      const menu = document.getElementById('zc-inst-menu');
      const currentLabel = document.getElementById('zc-inst-current-label');
      const countEl = document.getElementById('zc-inst-count');

      if (!source || !dropdown || !trigger || !menu || !currentLabel) return;

      function normalizeText(text) {
        return String(text || '').replace(/\s+/g, ' ').trim();
      }

      function getSourceButtons() {
        return Array.from(
          source.querySelectorAll('button, [role="button"], .inst-pill, .wpp-header-filtro, [data-instancia]')
        ).filter(el => normalizeText(el.textContent));
      }

      function getCurrentSourceButton(buttons) {
        return (
          buttons.find(btn =>
            btn.classList.contains('is-active') ||
            btn.classList.contains('ativo') ||
            btn.classList.contains('active') ||
            btn.getAttribute('aria-current') === 'true' ||
            btn.getAttribute('aria-selected') === 'true'
          ) || buttons[0] || null
        );
      }

      function closeMenu() {
        dropdown.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      }

      function openMenu() {
        dropdown.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }

      function syncDropdown() {
        const buttons = getSourceButtons();
        menu.innerHTML = '';

        if (countEl) countEl.textContent = `(${buttons.length})`;

        if (!buttons.length) {
          currentLabel.textContent = 'Todos';
          return;
        }

        const activeBtn = getCurrentSourceButton(buttons);
        currentLabel.textContent = normalizeText(activeBtn?.textContent) || 'Todos';

        buttons.forEach((btn, index) => {
          const txt = normalizeText(btn.textContent);
          if (!txt) return;

          const opt = document.createElement('button');
          opt.type = 'button';
          opt.className = 'zc-inst-option';
          opt.setAttribute('role', 'option');
          opt.dataset.index = String(index);
          opt.dataset.label = txt;

          const label = document.createElement('span');
          label.className = 'zc-inst-option-label';
          label.textContent = txt;
          opt.appendChild(label);

          const isActive =
            btn === activeBtn ||
            btn.classList.contains('is-active') ||
            btn.classList.contains('ativo') ||
            btn.classList.contains('active') ||
            btn.getAttribute('aria-current') === 'true' ||
            btn.getAttribute('aria-selected') === 'true';

          if (isActive) {
            opt.classList.add('is-active');
            opt.setAttribute('aria-selected', 'true');
          } else {
            opt.setAttribute('aria-selected', 'false');
          }

          opt.addEventListener('click', function () {
            try { btn.click(); } catch {}
            currentLabel.textContent = txt;

            menu.querySelectorAll('.zc-inst-option').forEach(item => {
              item.classList.remove('is-active');
              item.setAttribute('aria-selected', 'false');
            });

            opt.classList.add('is-active');
            opt.setAttribute('aria-selected', 'true');

            setTimeout(syncDropdown, 60);
            closeMenu();
          });

          menu.appendChild(opt);
        });
      }

      trigger.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (dropdown.classList.contains('is-open')) closeMenu();
        else openMenu();
      });

      document.addEventListener('click', function (ev) {
        if (!dropdown.contains(ev.target)) closeMenu();
      });

      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') closeMenu();
      });

      const observer = new MutationObserver(function () {
        syncDropdown();
      });

      observer.observe(source, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true
      });

      setTimeout(syncDropdown, 50);
      setTimeout(syncDropdown, 250);
      setTimeout(syncDropdown, 700);
      window.addEventListener('load', syncDropdown);
    })();
  </script>
</body>
