<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Atendimento – ZapChats</title>

  <script>
    (function () {
      try {
        const saved = localStorage.getItem('zc:theme');
        const prefersDark = matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute(
          'data-theme',
          saved || (prefersDark ? 'dark' : 'light')
        );
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/frontend/css/atendimentos.css">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

  <style>
    main.whatsapp-auto-bg #historico,
    main.whatsapp-bg-dark #historico,
    main.whatsapp-bg-light #historico{
      background-repeat: repeat !important;
      background-position: 0 0 !important;
      background-size: 400px 400px !important;
    }

    html[data-theme="dark"] main.whatsapp-auto-bg #historico,
    html.dark main.whatsapp-auto-bg #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    html[data-theme="light"] main.whatsapp-auto-bg #historico,
    html:not(.dark) main.whatsapp-auto-bg #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    main.whatsapp-bg-dark #historico{
      background-color:#0b141a !important;
      background-image: url("/frontend/img/whatsapp-bg-dark.png") !important;
    }

    main.whatsapp-bg-light #historico{
      background-color:#efeae2 !important;
      background-image: url("/frontend/img/whatsapp-bg-light.png") !important;
    }

    #chat-back-mobile{display:none}
    @media (max-width:920px){
      #chat-back-mobile{
        display:inline-flex;align-items:center;justify-content:center;
        margin-right:.5rem;width:32px;height:32px;
        border-radius:999px;border:none;background:transparent;
        color:inherit;cursor:pointer;
      }
      #chat-back-mobile i{font-size:1rem}
    }

    .wpp-leftbar .wpp-leftbar-icons a.wpp-leftbar-icon svg{
      width:22px;height:22px;display:block;
    }

    .wpp-leftbar .wpp-leftbar-icons a.wpp-leftbar-icon[aria-current="page"]{
      outline:none;
    }

    .zc-topbar{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .zc-topbar-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .zc-brand-wrap{
      min-width:0;
      display:flex;
      align-items:center;
    }

    .zc-brand-title{
      font-size:1.05rem;
      font-weight:700;
      letter-spacing:-.2px;
      color:var(--text);
      line-height:1;
    }

    /* fonte real das instâncias */
    #inst-switch{
      display:none !important;
    }

    /* linha whatsapp + dropdown ao lado */
    .zc-inst-row{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .zc-inst-meta{
      display:inline-flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      min-width:0;
    }

    .zc-inst-meta .dot{
      width:6px;
      height:6px;
      border-radius:999px;
      background:var(--accent);
      display:block;
      flex:0 0 auto;
    }

    .zc-inst-title{
      font-size:12px;
      font-weight:600;
      color:var(--text-2);
      white-space:nowrap;
    }

    #zc-inst-count{
      opacity:.85;
    }

    .zc-inst-dropdown{
      position:relative;
      display:inline-block;
      flex:0 0 auto;
      min-width:140px;
      max-width:200px;
    }

    .zc-inst-trigger{
      width:100%;
      min-height:34px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:0 12px;
      border:0;
      border-radius:999px;
      background:rgba(37,211,102,.12);
      color:var(--accent);
      box-shadow:inset 0 0 0 1px rgba(37,211,102,.30);
      font-size:12.5px;
      font-weight:600;
      cursor:pointer;
      transition:background .15s ease,color .15s ease,box-shadow .15s ease;
    }

    .zc-inst-trigger:hover{
      background:rgba(37,211,102,.16);
      box-shadow:inset 0 0 0 1px rgba(37,211,102,.38);
    }

    .zc-inst-trigger:focus-visible{
      outline:none;
      box-shadow:
        inset 0 0 0 1px rgba(37,211,102,.42),
        0 0 0 2px rgba(37,211,102,.14);
    }

    .zc-inst-trigger-text{
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      text-align:left;
    }

    .zc-inst-trigger i{
      font-size:11px;
      flex:0 0 auto;
      opacity:.9;
      transition:transform .15s ease;
    }

    .zc-inst-dropdown.is-open .zc-inst-trigger i{
      transform:rotate(180deg);
    }

    .zc-inst-menu{
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      z-index:70;
      min-width:100%;
      max-width:280px;
      padding:6px;
      border-radius:14px;
      background:var(--panel-2);
      border:1px solid var(--border);
      box-shadow:0 14px 34px rgba(0,0,0,.28);
      display:none;
    }

    .zc-inst-dropdown.is-open .zc-inst-menu{
      display:block;
    }

    .zc-inst-option{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      padding:10px 12px;
      border:0;
      border-radius:10px;
      background:transparent;
      color:var(--text);
      font-size:13px;
      line-height:1.2;
      text-align:left;
      cursor:pointer;
      transition:background .14s ease,color .14s ease;
    }

    .zc-inst-option:hover{
      background:color-mix(in oklab,var(--panel-3) 84%,transparent);
    }

    .zc-inst-option.is-active{
      background:rgba(37,211,102,.10);
      color:var(--accent);
    }

    .zc-inst-option-count{
      margin-left:auto;
      font-size:11px;
      color:var(--text-2);
      opacity:.82;
    }

    @media (max-width:920px){
      .zc-brand-title{font-size:1rem}
      .zc-inst-row{gap:8px}
      .zc-inst-title{font-size:11px}
      .zc-inst-dropdown{min-width:120px;max-width:170px}
      .zc-inst-trigger{min-height:32px;padding:0 11px;font-size:12px}
      .zc-inst-option{padding:9px 10px;font-size:12.5px}
    }
  </style>
</head>

<body style="display:none">
  <script>
    (function () {
      const EMPRESA_ID = Number(localStorage.getItem('empresa_id'));
      if (!EMPRESA_ID) location.href = '/login';
      else document.body.style.display = 'block';
    })();
  </script>

  <div class="wpp-root h-[100vh] w-full">

    <div id="sidebar-atendimentos-slot"></div>

    <aside class="flex flex-col">
      <div class="wpp-header-externo">
        <div class="zc-topbar">
          <div class="zc-topbar-head">
            <div class="zc-brand-wrap">
              <span class="zc-brand-title">ZapChat</span>
            </div>

            <div class="wpp-header-icons">
              <button
                class="wpp-header-icon"
                id="btn-sidemodal-nova-conversa"
                title="Nova conversa"
                aria-label="Nova conversa"
              >
                <i class="fa fa-plus"></i>
              </button>
            </div>
          </div>

          <div class="zc-inst-row">
            <div class="zc-inst-meta">
              <span class="dot"></span>
              <span class="zc-inst-title">WhatsApps <span id="zc-inst-count">(0)</span></span>
            </div>

            <div id="inst-switch"></div>

            <div class="zc-inst-dropdown" id="zc-inst-dropdown">
              <button
                type="button"
                class="zc-inst-trigger"
                id="zc-inst-trigger"
                aria-haspopup="listbox"
                aria-expanded="false"
              >
                <span class="zc-inst-trigger-text" id="zc-inst-current-label">Todos</span>
                <i class="fa fa-chevron-down" aria-hidden="true"></i>
              </button>

              <div
                class="zc-inst-menu"
                id="zc-inst-menu"
                role="listbox"
                aria-label="Selecionar instância"
              ></div>
            </div>
          </div>
        </div>

        <div class="wpp-header-search-row">
          <i class="fa fa-search"></i>
          <input
            type="text"
            class="wpp-header-search"
            id="wpp-header-search"
            placeholder="Pesquisar ou começar uma nova conversa">
        </div>

        <div id="search-results" class="search-results hidden"></div>

        <div class="wpp-header-filtros-row">
          <button class="wpp-header-filtro ativo">Em atendimento</button>
          <button class="wpp-header-filtro">Aguardando</button>
          <button class="wpp-header-filtro">No bot</button>
          <button class="wpp-header-filtro">Grupos</button>
        </div>

        <select id="filtro-departamento" style="display:none"></select>
      </div>

      <ul id="lista-clientes"></ul>
    </aside>

    <main class="flex flex-col whatsapp-bg-dark">
      <header id="chat-header"
              class="h-16 flex items-center px-4 gap-3 shadow-sm"
              style="display:none;">
        <div class="flex items-center gap-2 relative">
          <button
            id="chat-back-mobile"
            type="button"
            class="hdr-icon-btn"
            aria-label="Voltar para lista"
            title="Voltar para lista"
          >
            <i class="fa fa-arrow-left"></i>
          </button>

          <span id="chat-avatar"></span>
          <h2 id="chat-title" class="font-medium truncate text-[1.09em]"></h2>

          <button
            id="btn-sobre"
            class="hdr-icon-btn"
            title="Notas do cliente"
            aria-label="Notas do cliente">
          </button>
        </div>

        <span id="status-bateria" class="text-xs ml-auto"></span>
      </header>

      <section
        id="welcome-screen"
        class="absolute inset-0 flex flex-col items-center justify-center text-center z-10">
        <img src="/frontend/img/wpp.png"
             class="w-52 h-auto mb-6 opacity-100"
             alt="ZapChats Logo">
        <h2 class="text-lg font-semibold mt-2">Mantenha seu celular conectado</h2>
        <p class="max-w-md">
          O ZapChats conecta ao seu telefone para sincronizar suas mensagens.<br>
          Mantenha seu dispositivo conectado à internet para não perder conversas.
        </p>
      </section>

      <section id="historico" style="display:none;"></section>

      <div id="chat-loading"
           class="hidden absolute inset-0 z-[50] flex items-center justify-content-center">
        <div class="flex items-center gap-3">
          <span class="w-5 h-5 rounded-full border-2 animate-spin"></span>
          <span class="text-sm">Carregando conversa…</span>
        </div>
      </div>

      <footer id="chat-footer"
              class="flex items-center gap-3 px-4 py-3"
              style="display:none;">
        <button
          type="button"
          class="text-xl"
          id="btn-clipe"
          title="Enviar arquivo"
          aria-label="Enviar arquivo">
          <i class="fa fa-paperclip"></i>
        </button>

        <input id="input-arquivo" type="file" style="display:none" />

        <input
          id="mensagem"
          placeholder="Digite sua resposta…"
          class="flex-1 outline-none px-3 py-2 rounded"
          autocomplete="off"/>

        <button
          id="btn-enviar"
          class="send-btn"
          title="Enviar"
          aria-label="Enviar">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
          </svg>
        </button>
      </footer>
    </main>
  </div>

  <script type="module" src="/frontend/js/atendimentos/boot/main.js"></script>
  <script type="module" src="/frontend/js/atendimentos/ui/filtros.js"></script>
  <script type="module" src="/frontend/js/pages/atendimentos-autoopen.js"></script>

  <script>
    window.ENV = window.ENV || {};
    window.ENV.EVOLUTION = Object.assign({}, window.ENV.EVOLUTION, {
      apiUrl: "{{ EVOLUTION_URL }}",
      apiKey: "{{ EVOLUTION_APIKEY }}",
      defaultInstance: "{{ EVOLUTION_DEFAULT_INSTANCE }}"
    });
  </script>

  <script src="/frontend/js/atendimentos/ui/agenda.js"></script>

  <script>
    (async function () {
      const slot = document.getElementById('sidebar-atendimentos-slot');
      if (!slot) return;

      try {
        const res = await fetch('/frontend/partials/sidebar-atendimentos.html', {
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        slot.innerHTML = await res.text();

        const path = (location.pathname.replace(/\/+$/, '') || '/');
        document.querySelectorAll('.wpp-leftbar .wpp-leftbar-icons a[href]').forEach(a => {
          try{
            const href = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/, '') || '/';
            if (href === path) a.setAttribute('aria-current','page');
          }catch{}
        });

        const out = document.getElementById('miniLogout');
        if(out && !out.dataset.bound){
          out.dataset.bound = '1';
          out.addEventListener('click', async function(ev){
            ev.preventDefault();
            try{ await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); }catch{}
            try{ localStorage.clear(); sessionStorage.clear(); }catch{}
            window.location.replace('/');
          });
        }
      } catch (err) {
        console.error('Erro ao carregar sidebar-atendimentos.html:', err);
      }
    })();
  </script>

  <script>
    (function mobileChatToggle(){
      const listEl = document.getElementById('lista-clientes');
      const back   = document.getElementById('chat-back-mobile');

      function isMobile(){ return window.innerWidth <= 920; }

      if (listEl) {
        listEl.addEventListener('click', function(ev){
          const li = ev.target.closest('li.chat-item, li.cliente-item');
          if (!li) return;
          if (isMobile()) document.body.classList.add('is-chat-open');
        });
      }

      if (back) {
        back.addEventListener('click', function(){
          if (isMobile()) document.body.classList.remove('is-chat-open');
        });
      }

      function handleResize(){
        if (!isMobile()) document.body.classList.remove('is-chat-open');
      }

      window.addEventListener('resize', handleResize);
      handleResize();
    })();
  </script>

  <script>
    (function () {
      const source = document.getElementById('inst-switch');
      const dropdown = document.getElementById('zc-inst-dropdown');
      const trigger = document.getElementById('zc-inst-trigger');
      const menu = document.getElementById('zc-inst-menu');
      const currentLabel = document.getElementById('zc-inst-current-label');
      const countEl = document.getElementById('zc-inst-count');

      if (!source || !dropdown || !trigger || !menu || !currentLabel) return;

      function normalizeText(text) {
        return String(text || '').replace(/\s+/g, ' ').trim();
      }

      function getSourceButtons() {
        return Array.from(
          source.querySelectorAll('button, [role="button"], .inst-pill, .wpp-header-filtro, [data-instancia]')
        ).filter(el => normalizeText(el.textContent));
      }

      function getCurrentSourceButton(buttons) {
        return (
          buttons.find(btn =>
            btn.classList.contains('is-active') ||
            btn.classList.contains('ativo') ||
            btn.classList.contains('active') ||
            btn.getAttribute('aria-current') === 'true' ||
            btn.getAttribute('aria-selected') === 'true'
          ) || buttons[0] || null
        );
      }

      function closeMenu() {
        dropdown.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      }

      function openMenu() {
        dropdown.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }

      function syncDropdown() {
        const buttons = getSourceButtons();
        menu.innerHTML = '';

        if (countEl) countEl.textContent = `(${buttons.length})`;

        if (!buttons.length) {
          currentLabel.textContent = 'Todos';
          return;
        }

        const activeBtn = getCurrentSourceButton(buttons);
        currentLabel.textContent = normalizeText(activeBtn?.textContent) || 'Todos';

        buttons.forEach((btn, index) => {
          const txt = normalizeText(btn.textContent);
          if (!txt) return;

          const opt = document.createElement('button');
          opt.type = 'button';
          opt.className = 'zc-inst-option';
          opt.setAttribute('role', 'option');
          opt.dataset.index = String(index);
          opt.dataset.label = txt;

          const label = document.createElement('span');
          label.className = 'zc-inst-option-label';
          label.textContent = txt;
          opt.appendChild(label);

          const isActive =
            btn === activeBtn ||
            btn.classList.contains('is-active') ||
            btn.classList.contains('ativo') ||
            btn.classList.contains('active') ||
            btn.getAttribute('aria-current') === 'true' ||
            btn.getAttribute('aria-selected') === 'true';

          if (isActive) {
            opt.classList.add('is-active');
            opt.setAttribute('aria-selected', 'true');
          } else {
            opt.setAttribute('aria-selected', 'false');
          }

          opt.addEventListener('click', function () {
            try { btn.click(); } catch {}
            currentLabel.textContent = txt;

            menu.querySelectorAll('.zc-inst-option').forEach(item => {
              item.classList.remove('is-active');
              item.setAttribute('aria-selected', 'false');
            });

            opt.classList.add('is-active');
            opt.setAttribute('aria-selected', 'true');

            setTimeout(syncDropdown, 60);
            closeMenu();
          });

          menu.appendChild(opt);
        });
      }

      trigger.addEventListener('click', function (ev) {
        ev.stopPropagation();
        if (dropdown.classList.contains('is-open')) closeMenu();
        else openMenu();
      });

      document.addEventListener('click', function (ev) {
        if (!dropdown.contains(ev.target)) closeMenu();
      });

      document.addEventListener('keydown', function (ev) {
        if (ev.key === 'Escape') closeMenu();
      });

      const observer = new MutationObserver(function () {
        syncDropdown();
      });

      observer.observe(source, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true
      });

      setTimeout(syncDropdown, 50);
      setTimeout(syncDropdown, 250);
      setTimeout(syncDropdown, 700);
      window.addEventListener('load', syncDropdown);
    })();
  </script>
</body>
</html>
