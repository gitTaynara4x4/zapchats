<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin • Planos por CNPJ</title>
<link rel="stylesheet" href="/frontend/css/tw.css">
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;background:#0f1012;color:#e5e7eb}
  .card{background:#161617;border:1px solid #27272a;border-radius:14px;padding:16px;max-width:920px;margin:24px auto}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row > *{flex:0 0 auto}
  input,select,button{border:1px solid #27272a;background:#0f1012;color:#e5e7eb;border-radius:10px;padding:10px 12px}
  input{min-width:280px}
  button{cursor:pointer}
  button.primary{background:#2563eb;border-color:#1e40af}
  button.warn{background:#9333ea;border-color:#7e22ce}
  button.danger{background:#dc2626;border-color:#991b1b}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .badge{display:inline-block;border:1px solid #374151;border-radius:999px;padding:2px 10px;font-size:12px;background:#111827}
  .mono{font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;}
  .muted{color:#9ca3af}
  .ok{color:#22c55e}
  .err{color:#ef4444}
  .table{width:100%;border-collapse:collapse}
  .table th,.table td{padding:6px 8px;border-bottom:1px solid #27272a}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>

<div class="card">
  <h1 style="font-size:18px;font-weight:700;margin-bottom:10px">Admin • Consulta e Aplicação de Planos</h1>

  <div class="row" style="margin-bottom:12px">
    <label for="cnpj" class="muted">CNPJ</label>
    <input id="cnpj" placeholder="00.000.000/0000-00 ou só dígitos">
    <button id="btBuscar" class="primary">Buscar</button>
    <span id="msg" class="muted"></span>
  </div>

  <div id="boxEmpresa" class="grid" style="display:none;margin-top:8px">
    <div>
      <h3 style="font-weight:600;margin-bottom:6px">Empresa</h3>
      <div>Nome: <span id="eNome" class="mono"></span></div>
      <div>CNPJ: <span id="eCnpj" class="mono"></span></div>
      <div>Telefone: <span id="eTel" class="mono"></span></div>
    </div>
    <div>
      <h3 style="font-weight:600;margin-bottom:6px">Status</h3>
      <div>Plano pago (assinatura): <span id="eAssinatura" class="badge"></span></div>
      <div>Trial: <span id="eTrial" class="badge"></span></div>
      <div>Expira em: <span id="eTrialExp" class="mono"></span></div>
      <div>Tier efetivo: <span id="eEffective" class="badge"></span></div>
      <div>Limite instâncias: <span id="eLimite" class="mono"></span></div>
      <div>Instâncias conectadas: <span id="eCon" class="mono"></span></div>
      <div>Dias restantes trial: <span id="eDays" class="mono"></span></div>
    </div>
  </div>

  <div id="boxAcoes" style="display:none;margin-top:14px">
    <h3 style="font-weight:600;margin-bottom:6px">Ações</h3>
    <div class="actions">
      <select id="selPlano">
        <option value="PRATA">Aplicar PRATA (1)</option>
        <option value="OURO">Aplicar OURO (2)</option>
        <option value="PLATINA">Aplicar PLATINA (3)</option>
        <option value="DIAMANTE">Aplicar DIAMANTE (4)</option>
        <option value="ASCENDENTE">Aplicar ASCENDENTE (5)</option>
        <option value="IMORTAL">Aplicar IMORTAL (6)</option>
        <option value="RADIANTE">Aplicar RADIANTE (7)</option>
        <option value="FREE">Aplicar FREE (0)</option>
      </select>
      <button id="btAplicar" class="primary">Aplicar plano pago (limpa trial)</button>

      <button id="btCancelarTrial" class="danger">Cancelar trial</button>
      <button id="btReiniciarTrial" class="warn" title="Recomeça trial PRATA">Reiniciar trial PRATA (7d)</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = sel => document.querySelector(sel);

  const els = {
    cnpj: $('#cnpj'),
    msg: $('#msg'),
    boxEmpresa: $('#boxEmpresa'),
    boxAcoes: $('#boxAcoes'),

    eNome: $('#eNome'),
    eCnpj: $('#eCnpj'),
    eTel:  $('#eTel'),
    eAss:  $('#eAssinatura'),
    eTrial:$('#eTrial'),
    eTrialExp:$('#eTrialExp'),
    eEffective:$('#eEffective'),
    eLimite:$('#eLimite'),
    eCon:$('#eCon'),
    eDays:$('#eDays'),

    selPlano: $('#selPlano'),
    btBuscar: $('#btBuscar'),
    btAplicar: $('#btAplicar'),
    btCancelarTrial: $('#btCancelarTrial'),
    btReiniciarTrial: $('#btReiniciarTrial'),
  };

  const token = localStorage.getItem('token') || localStorage.getItem('auth_token') || '';
  const headers = {'Content-Type':'application/json', ...(token ? {Authorization:`Bearer ${token}`} : {})};

  let current = null; // { empresa, status }

  function onlyDigits(s){ return String(s||'').replace(/\D/g,''); }

  function setMsg(t, ok){
    els.msg.textContent = t||'';
    els.msg.className = ok ? 'ok' : (t ? 'err' : 'muted');
  }

  function render(){
    if (!current){ els.boxEmpresa.style.display='none'; els.boxAcoes.style.display='none'; return; }
    const emp = current.empresa || {};
    const st  = current.status || {};

    els.boxEmpresa.style.display='grid';
    els.boxAcoes.style.display='block';

    els.eNome.textContent = emp.nome || '—';
    els.eCnpj.textContent = emp.cnpj_cpf || '—';
    els.eTel.textContent  = emp.telefone || '—';

    els.eAss.textContent  = emp.assinatura || 'FREE';
    const triAct = (st.trial && st.trial.active) ? 'ATIVO' : (emp.trial_tier ? 'INATIVO' : 'NENHUM');
    const triTier = (st.trial && st.trial.tier) || emp.trial_tier || '—';
    els.eTrial.textContent = `${triTier} • ${triAct}`;
    els.eTrialExp.textContent = (emp.trial_expires_at || st.trial?.expires_at || '—');

    els.eEffective.textContent = st.effective_tier || emp.effective_tier || emp.assinatura || 'FREE';
    els.eLimite.textContent = st.limite_instancias ?? '—';
    els.eCon.textContent = st.quantidade_instancias ?? emp.quantidade_instancias ?? '0';
    els.eDays.textContent = (st.trial && (st.trial.days_left ?? 0)) || 0;
  }

  async function buscar(){
    setMsg('Consultando...', true);
    current = null; render();
    const cnpj = els.cnpj.value.trim();
    if (!cnpj){ setMsg('Informe o CNPJ.', false); return; }

    // aceitamos cnpj com ou sem máscara; backend espera exato. ajuste se necessário.
    const url = `/api/admin/empresas/by-cnpj?cnpj=${encodeURIComponent(cnpj)}`;
    try{
      const r = await fetch(url, {headers});
      const js = await r.json().catch(()=> ({}));
      if (!r.ok || js?.ok === false) throw new Error(js?.detail || `HTTP ${r.status}`);
      current = js;
      setMsg('OK', true);
      render();
    }catch(e){
      setMsg(String(e.message||e), false);
      current = null; render();
    }
  }

  async function aplicarPlano(){
    if (!current?.empresa?.id){ setMsg('Busque a empresa primeiro.', false); return; }
    const id = current.empresa.id;
    const assinatura = String(els.selPlano.value||'').toUpperCase();
    setMsg('Aplicando plano...', true);
    try{
      const r = await fetch(`/api/admin/empresas/${id}/apply-plan`, {
        method:'POST',
        headers,
        body: JSON.stringify({assinatura})
      });
      const js = await r.json().catch(()=> ({}));
      if (!r.ok || js?.ok === false) throw new Error(js?.detail || `HTTP ${r.status}`);
      // reconsulta
      await buscar();
      setMsg('Plano aplicado e trial limpo.', true);
    }catch(e){
      setMsg(String(e.message||e), false);
    }
  }

  async function cancelarTrial(){
    if (!current?.empresa?.id){ setMsg('Busque a empresa primeiro.', false); return; }
    const id = current.empresa.id;
    setMsg('Cancelando trial...', true);
    try{
      const r = await fetch(`/api/admin/empresas/${id}/cancel-trial`, {
        method:'POST', headers
      });
      const js = await r.json().catch(()=> ({}));
      if (!r.ok || js?.ok === false) throw new Error(js?.detail || `HTTP ${r.status}`);
      await buscar();
      setMsg('Trial cancelado.', true);
    }catch(e){
      setMsg(String(e.message||e), false);
    }
  }

  async function reiniciarTrial(){
    if (!current?.empresa?.id){ setMsg('Busque a empresa primeiro.', false); return; }
    const id = current.empresa.id;
    setMsg('Reiniciando trial PRATA (7d)...', true);
    try{
      const r = await fetch(`/api/admin/empresas/${id}/start-trial`, {
        method:'POST', headers, body: JSON.stringify({days:7})
      });
      const js = await r.json().catch(()=> ({}));
      if (!r.ok || js?.ok === false) throw new Error(js?.detail || `HTTP ${r.status}`);
      await buscar();
      setMsg('Trial reiniciado (PRATA, 7 dias).', true);
    }catch(e){
      setMsg(String(e.message||e), false);
    }
  }

  els.btBuscar.addEventListener('click', buscar);
  els.btAplicar.addEventListener('click', aplicarPlano);
  els.btCancelarTrial.addEventListener('click', cancelarTrial);
  els.btReiniciarTrial.addEventListener('click', reiniciarTrial);

  // enter = buscar
  els.cnpj.addEventListener('keydown', (ev)=>{ if (ev.key === 'Enter') buscar(); });
})();
</script>
</body>
</html>
