<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipe - ZapChats</title>
  <link rel="stylesheet" href="/frontend/css/tw.css">
</head>
<body class="min-h-screen bg-gray-100">

  <div class="max-w-4xl mx-auto py-10">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-3xl font-bold text-gray-700">Equipe</h1>
      <button id="btnAdd" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 font-semibold transition">
        + Adicionar Usuário
      </button>
    </div>

    <!-- Tabela Usuários -->
    <div class="bg-white shadow rounded-xl overflow-x-auto">
      <table class="min-w-full text-sm text-gray-700">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-3 text-left">Nome</th>
            <th class="px-4 py-3 text-left">E-mail</th>
            <th class="px-4 py-3 text-left">Departamento</th>
            <th class="px-4 py-3 text-left">Cargo</th>
          </tr>
        </thead>
        <tbody id="tbody-usuarios"></tbody>
      </table>
    </div>
  </div>

  <!-- Modal Cadastro -->
  <div id="modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl w-full max-w-md p-8 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">Novo Usuário</h2>
        <button id="btnCloseModal" class="text-gray-400 hover:text-gray-700 text-2xl">&times;</button>
      </div>
      <form id="form-novo-usuario" class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">Nome</label>
          <input type="text" name="nome" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="Nome completo" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">E-mail</label>
          <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="usuario@email.com" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Senha</label>
          <input type="password" name="senha" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" placeholder="Senha" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Departamento</label>
          <select name="departamento_id" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500" id="select-departamento">
            <option value="">Selecione...</option>
          </select>
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Cargo</label>
          <select name="cargo" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500">
            <option value="">Selecione...</option>
            <option value="consultor">Consultor</option>
            <option value="colaborador">Colaborador</option>
            <option value="administrador">Administrador</option>
          </select>
        </div>
        <button type="submit" class="w-full py-2 rounded-lg bg-green-600 text-white font-semibold hover:bg-green-700">Cadastrar</button>
      </form>
    </div>
  </div>

  <script src="equipe.js"></script>
</body>
</html>
