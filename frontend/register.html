<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro – Seu Chat</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-green-50 flex items-center justify-center">
  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row">
    
    <!-- 1/2: Ilustração -->
    <div class="hidden md:flex md:w-1/2 bg-green-100 items-center justify-center p-8">
      <img
        src="img/register-illustration.png"
        alt="Ilustração de cadastro"
        class="object-contain h-100"
      />
    </div>

    <!-- 1/2: Formulário de Cadastro -->
    <div class="w-full md:w-1/2 p-8">
      <div class="mb-6 text-center">
        <img src="img/Logo.png" alt="Logo" class="mx-auto h-14 mb-4"/>
        <h2 class="text-3xl font-bold text-gray-800">Cadastro da Empresa</h2>
        <p class="text-gray-500">Crie sua conta para começar</p>
      </div>

      <form id="form-register" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Nome da Empresa</label>
          <input
            type="text" name="nome" required
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
            placeholder="Minha Empresa Ltda."
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Telefone da Empresa</label>
          <input
            type="tel"
            name="telefone"
            required
            pattern="\(\d{2}\)\s?\d{4,5}-\d{4}"
            title="Digite um telefone no formato (11) 91234-5678"
            placeholder="(11) 91234-5678"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
            oninput="this.value = formatTelefone(this.value)"
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">E-mail Administrativo</label>
          <input
            type="email"
            name="email_admin"
            required
            pattern=".+@.+\..+"
            title="Digite um e-mail válido (ex.: nome@dominio.com)"
            placeholder="admin@empresa.com"
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
          />
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Senha de Acesso</label>
          <input
            type="password" name="senha_admin" required
            class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400"
            placeholder="••••••••"
          />
        </div>
        <button
          type="submit"
          class="w-full py-2 rounded-lg bg-green-500 text-white font-semibold hover:bg-green-600 transition"
        >
          Cadastrar Empresa
        </button>
      </form>

      <p class="mt-8 text-center text-gray-600">
        Já tem conta?
        <a
          href="#"
          onclick="
            localStorage.removeItem('token');
            localStorage.removeItem('empresa_id');
            localStorage.removeItem('role');
            localStorage.removeItem('instance_name');
            window.location.href = '/login.html';
            return false;
          "
          class="text-green-500 hover:underline font-medium"
        >
          Voltar ao login
        </a>
      </p>
    </div>

  </div>

  <script>
    // Função para aplicar máscara de telefone BR em tempo real
    function formatTelefone(value) {
      const digits = value.replace(/\D/g, '');
      let result = '';
      if (digits.length > 0) {
        result += '(' + digits.substring(0, 2);
        if (digits.length >= 2) result += ') ';
        if (digits.length <= 6) {
          result += digits.substring(2);
        } else if (digits.length <= 10) {
          result += digits.substring(2, digits.length - 4) + '-' + digits.substring(digits.length - 4);
        } else {
          result += digits.substring(2, 7) + '-' + digits.substring(7, 11);
        }
      }
      return result;
    }

    document.getElementById('form-register').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const payload = {
        nome:        f.nome.value.trim(),
        telefone:    f.telefone.value.trim(),
        email_admin: f.email_admin.value.trim(),
        senha_admin: f.senha_admin.value.trim()
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          return alert('Erro no cadastro: ' + JSON.stringify(err.detail));
        }

        const data = await res.json();
        localStorage.setItem('token',       data.access_token);
        localStorage.setItem('empresa_id',  data.empresa_id);
        localStorage.setItem('role',        data.is_admin ? 'admin' : 'atendente');
        localStorage.removeItem('instance_name');

        window.location.href = '/dashboard.html';
      } catch (error) {
        alert('Erro de rede ou servidor. Tente novamente.');
      }
    });
  </script>
</body>
</html>
