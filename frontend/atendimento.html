<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel de Atendimento – ZapChats</title>

  <!-- Estilo global -->
  <link rel="stylesheet" href="/frontend/style.css" />
  <!-- Tailwind (apenas prototipagem) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans select-none">
  <div class="flex h-[100dvh]">
    <!-- COLUNA ESQUERDA – lista de chats -->
    <aside class="w-1/4 bg-white border-r flex flex-col">
      <div class="px-4 py-2 flex items-center justify-between border-b">
        <h2 class="text-lg font-semibold">Chats</h2>
        <select id="filtro-departamento" class="border rounded px-2 py-1 text-sm">
          <option value="">Todos</option>
          <option value="Financeiro">Financeiro</option>
          <option value="Suporte">Suporte</option>
          <option value="Comercial">Comercial</option>
        </select>
      </div>
      <ul id="lista-clientes" class="flex-1 overflow-y-auto"></ul>
    </aside>

    <!-- COLUNA DIREITA – conversa -->
    <main class="flex-1 flex flex-col bg-gray-50">
      <!-- Header da conversa -->
      <header class="h-14 flex items-center px-4 border-b bg-gray-100 gap-3">
        <div id="chat-avatar" class="w-9 h-9"></div>
        <div class="flex-1 overflow-hidden">
          <h2 id="chat-title" class="font-medium truncate"></h2>
          <span id="chat-presenca" class="text-xs text-gray-500"></span>
        </div>
        <span id="status-bateria" class="text-xs text-gray-500"></span>
      </header>

      <!-- Histórico -->
      <section id="historico"
               class="flex-1 overflow-y-auto px-4 py-3 space-y-2
                      bg-[url('https://i.imgur.com/4Y0aEhm.png')] bg-repeat"></section>

      <!-- Input -->
      <footer class="p-3 border-t bg-gray-100 flex gap-2">
        <input id="mensagem" placeholder="Digite sua resposta…"
               class="flex-1 border rounded-lg px-4 py-2 focus:outline-none
                      focus:ring-1 focus:ring-emerald-600 disabled:opacity-60" />
        <button id="btn-enviar"
                class="bg-emerald-600 text-white px-5 rounded-lg disabled:opacity-50">
          Enviar
        </button>
      </footer>
    </main>
  </div>

<script>
/* ───── Configuração / autenticação ───── */
const EMPRESA_ID = Number(localStorage.getItem('empresa_id'));
if (!EMPRESA_ID) location.href = '/login.html';

/* ───── Elementos de UI ───── */
const $      = sel => document.querySelector(sel);
const lista  = $('#lista-clientes');
const hist   = $('#historico');
const inpMsg = $('#mensagem');
const btnMsg = $('#btn-enviar');
const title  = $('#chat-title');
const avatar = $('#chat-avatar');
const presEl = $('#chat-presenca');
const batEl  = $('#status-bateria');
const filtro = $('#filtro-departamento');

let clienteSel = null;
let ultimaData = '';

/* ───── Funções auxiliares de UI ───── */
const avatarHtml = c =>
  c.avatar_url
    ? `<img src="${c.avatar_url}" class="avatar"/>`
    : `<div class="avatar">${c.telefone.slice(-2)}</div>`;

function addDateChip(label) {
  hist.insertAdjacentHTML('beforeend', `<div class="date-chip">${label}</div>`);
}
const hora = d => d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

function addBubble(txt, tipo, d) {
  const dia = d.toLocaleDateString();
  if (dia !== ultimaData) {
    ultimaData = dia;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const diff = Math.round((d - hoje) / 86400000);
    addDateChip(diff === 0 ? 'Hoje' : diff === -1 ? 'Ontem' : dia);
  }
  hist.insertAdjacentHTML('beforeend', `
    <div class="msg-row ${tipo === 'entrada' ? 'left' : 'right'}">
      <span class="${tipo === 'entrada' ? 'msg-in' : 'msg-out'} bubble">
        ${txt}<span class="time">${hora(d)}</span>
      </span>
    </div>`);
  hist.scrollTop = hist.scrollHeight;
}
const badge = q => q ? `<span class="badge">${q}</span>` : '';

/* ───── Requisições REST ───── */
async function carregarClientes() {
  let url = `/api/atendimento/clientes?empresa_id=${EMPRESA_ID}`;
  if (filtro.value) url += `&departamento=${encodeURIComponent(filtro.value)}`;
  const data = await fetch(url).then(r => r.json());
  lista.innerHTML = '';
  data.forEach(c => {
    lista.insertAdjacentHTML('beforeend', `
      <li class="chat-item ${clienteSel && c.id === clienteSel.id ? 'chat-active' : ''}"
          onclick="selecionarClienteObj(${c.id})">
        ${avatarHtml(c)}
        <div class="chat-text">
          <div class="chat-name">${c.nome === 'Cliente' ? c.telefone : c.nome}</div>
          <div class="chat-last">${c.ultima_mensagem || ''}</div>
        </div>
        <div class="flex flex-col items-end">
          <span class="chat-time">${c.hora || ''}</span>
          ${badge(c.novas ? 1 : 0)}
        </div>
      </li>`);
  });
  window.clientesCache = data;
}

async function selecionarClienteObj(id) {
  const c = window.clientesCache.find(x => x.id === id);
  if (!c) return;
  clienteSel = c; ultimaData = '';
  title.textContent = c.nome === 'Cliente' ? c.telefone : c.nome;
  avatar.innerHTML  = avatarHtml(c);
  presEl.textContent = '';
  await carregarHistorico(id);
  await carregarClientes();
  inpMsg.disabled = false;
  inpMsg.focus();
}

async function carregarHistorico(id) {
  hist.innerHTML = ''; ultimaData = '';
  const msgs = await fetch(`/api/atendimento/historico/${id}?empresa_id=${EMPRESA_ID}`)
                    .then(r => r.json());
  msgs.forEach(m => addBubble(m.conteudo, m.tipo, new Date(m.timestamp || Date.now())));
}

/* ───── Enviar mensagem ───── */
btnMsg.onclick = async () => {
  const txt = inpMsg.value.trim();
  if (!txt || !clienteSel) return;
  inpMsg.value = '';
  addBubble(txt, 'saida', new Date());
  await fetch('/api/atendimento/enviar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      cliente_id: clienteSel.id,
      empresa_id: EMPRESA_ID,
      conteudo:   txt
    })
  });
};

filtro.onchange = carregarClientes;

/* ───── WebSocket ───── */
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const sock  = new WebSocket(`${proto}://${location.host}/ws/empresas/${EMPRESA_ID}/mensagens`);

setInterval(() => { if (sock.readyState === 1) sock.send('ping'); }, 30000);

sock.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.empresa_id !== EMPRESA_ID) return;

  if (d.presence) {
    if (clienteSel && clienteSel.id === d.cliente_id) {
      presEl.textContent = d.presence === 'composing' ? 'digitando…' : d.presence;
    }
    return;
  }
  if (d.battery !== undefined) {
    batEl.textContent = `🔋 ${d.battery}% ${d.plugged ? '⚡' : ''}`;
    return;
  }
  if (d.phone_state) {
    batEl.textContent = d.phone_state;
    return;
  }
  if (d.mensagem) {
    if (!clienteSel || clienteSel.id !== d.cliente_id) {
      carregarClientes();
      return;
    }
    addBubble(d.mensagem, d.tipo, new Date((d.timestamp ?? Date.now()) * 1000));
  }
};

/* ───── Init ───── */
carregarClientes();
</script>
</body>
</html>
