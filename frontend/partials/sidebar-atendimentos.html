<script>
  (function () {
    try {
      var root = document.documentElement;
      var saved =
        (window.AppTheme && typeof window.AppTheme.current === 'function'
          ? window.AppTheme.current()
          : (
              localStorage.getItem('zc:theme') ||
              localStorage.getItem('theme') ||
              localStorage.getItem('valora_theme') ||
              'dark'
            )
        ) || 'dark';

      var isDark = String(saved).toLowerCase() === 'dark';
      root.classList.toggle('dark', isDark);
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>

<script>
(function () {
  if (window.__WPP_SIDEBAR_ATEND_READY_20260428_FIX__) return;
  window.__WPP_SIDEBAR_ATEND_READY_20260428_FIX__ = true;

  var sidebar = document.getElementById('wppAtendSidebar');
  var mobileToggle = document.getElementById('wppMobileToggle');
  var mobileClose = document.getElementById('wppMobileClose');
  var mobileOverlay = document.getElementById('wppMobileOverlay');

  var userBtn = document.getElementById('wppUserMenuBtn');
  var userMenu = document.getElementById('wppUserMenu');
  var avatarImg = document.getElementById('wppUserAvatarImg');
  var initialsEl = document.getElementById('wppUserInitials');
  var userNameEl = document.getElementById('wppUserName');
  var userEmailEl = document.getElementById('wppUserEmail');

  var openProfileBtn = document.getElementById('wppOpenProfileBtn');
  var myPlanBtn = document.getElementById('wppMyPlanBtn');
  var configBtn = document.getElementById('wppConfigBtn');
  var themeBtn = document.getElementById('wppThemeBtn');
  var logoutBtn = document.getElementById('wppLogoutBtn');

  function isMobile() {
    try {
      return window.matchMedia('(max-width: 920px)').matches;
    } catch (e) {
      return window.innerWidth <= 920;
    }
  }

  function norm(path) {
    path = String(path || '').toLowerCase().trim();
    path = path.split('?')[0].split('#')[0];
    path = path.replace(/\/+$/, '');
    return path || '/';
  }

  function currentMenu() {
    var p = norm(location.pathname);

    if (p === '/' || p === '/dashboard' || p === '/dashboard.html' || p === '/inicio') return 'dashboard';
    if (p.indexOf('/atendimentos') === 0 || p === '/atendimentos.html') return 'atendimentos';
    if (p.indexOf('/midias') === 0 || p === '/midias.html') return 'midias';
    if (p.indexOf('/chat-interno') === 0 || p === '/chat-interno.html') return 'chat-interno';
    if (p.indexOf('/clientes') === 0 || p === '/clientes.html') return 'clientes';
    if (p.indexOf('/colaboradores') === 0 || p === '/colaboradores.html') return 'colaboradores';
    if (p.indexOf('/departamentos') === 0 || p === '/departamentos.html') return 'departamentos';
    if (p.indexOf('/chatbot') === 0 || p === '/chatbot.html') return 'chatbot';
    if (p.indexOf('/disparos') === 0 || p === '/disparos.html') return 'disparos';
    if (p.indexOf('/conectar') === 0 || p === '/conectar.html') return 'conectar';
    if (p.indexOf('/filas') === 0 || p === '/filas.html') return 'filas';

    return '';
  }

  function markActive() {
    var cur = currentMenu();

    document.querySelectorAll('.wpp-leftbar-icon[data-menu]').forEach(function (el) {
      var on = el.getAttribute('data-menu') === cur;
      el.classList.toggle('is-active', on);

      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  }

  function openSidebar() {
    if (!sidebar) return;

    sidebar.classList.add('show');

    if (mobileOverlay) {
      mobileOverlay.classList.add('show');
    }

    if (mobileToggle) {
      mobileToggle.setAttribute('aria-expanded', 'true');
    }

    if (isMobile()) {
      try {
        document.documentElement.style.overflow = 'hidden';
        document.body.style.overflow = 'hidden';
      } catch (e) {}
    }
  }

  function closeSidebar() {
    if (sidebar) {
      sidebar.classList.remove('show');
    }

    if (mobileOverlay) {
      mobileOverlay.classList.remove('show');
    }

    if (mobileToggle) {
      mobileToggle.setAttribute('aria-expanded', 'false');
    }

    try {
      document.documentElement.style.overflow = '';
      document.body.style.overflow = '';
    } catch (e) {}
  }

  function cleanText(v) {
    return String(v || '').replace(/\s+/g, ' ').trim();
  }

  function isBrandText(v) {
    var t = cleanText(v).toLowerCase();
    return t === 'zapchat' || t === 'zapschat';
  }

  function hasBrandText(v) {
    var t = cleanText(v).toLowerCase();
    return t.indexOf('zapchat') >= 0 || t.indexOf('zapschat') >= 0;
  }

  function isVisible(el) {
    if (!el || !el.getBoundingClientRect) return false;

    try {
      var r = el.getBoundingClientRect();
      var st = window.getComputedStyle(el);

      return (
        r.width > 0 &&
        r.height > 0 &&
        st.display !== 'none' &&
        st.visibility !== 'hidden' &&
        st.opacity !== '0'
      );
    } catch (e) {
      return false;
    }
  }

  function isBadBrandCandidate(el) {
    if (!el) return true;
    if (el === document.body || el === document.documentElement) return true;
    if (el.closest && el.closest('#wppAtendSidebar')) return true;
    if (el === mobileToggle || el.contains(mobileToggle)) return true;
    if (el.closest && el.closest('.wpp-mobile-overlay')) return true;

    var tag = String(el.tagName || '').toLowerCase();
    return tag === 'script' || tag === 'style' || tag === 'svg' || tag === 'path';
  }

  function findBrandElement() {
    var existing = document.querySelector('[data-zc-mobile-brand-title="1"]');

    if (existing && isVisible(existing)) {
      return existing;
    }

    var selectors = [
      '[data-brand]',
      '[data-zc-brand]',
      '.zc-brand',
      '.zapschat-brand',
      '.zapchat-brand',
      '.brand-title',
      '.topbar-brand',
      '.wpp-brand-title',
      '.wpp-header-brand',
      'h1',
      'h2',
      'h3',
      'strong',
      'b',
      'span',
      'div'
    ];

    var candidates = [];

    selectors.forEach(function (sel) {
      try {
        document.querySelectorAll(sel).forEach(function (el) {
          if (candidates.indexOf(el) === -1) candidates.push(el);
        });
      } catch (e) {}
    });

    for (var i = 0; i < candidates.length; i++) {
      var el = candidates[i];

      if (isBadBrandCandidate(el) || !isVisible(el)) continue;

      if (isBrandText(el.textContent)) {
        el.setAttribute('data-zc-mobile-brand-title', '1');
        return el;
      }
    }

    try {
      var walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            var text = cleanText(node.nodeValue);
            var parent = node.parentElement;

            if (!parent) return NodeFilter.FILTER_REJECT;
            if (isBadBrandCandidate(parent)) return NodeFilter.FILTER_REJECT;
            if (!hasBrandText(text)) return NodeFilter.FILTER_REJECT;
            if (!isVisible(parent)) return NodeFilter.FILTER_REJECT;

            return NodeFilter.FILTER_ACCEPT;
          }
        }
      );

      var node;

      while ((node = walker.nextNode())) {
        var raw = String(node.nodeValue || '');
        var match = raw.match(/ZapsChat|ZapChat|zapschat|zapchat/i);

        if (!match) continue;

        var parent = node.parentNode;
        var before = raw.slice(0, match.index);
        var brand = raw.slice(match.index, match.index + match[0].length);
        var after = raw.slice(match.index + match[0].length);

        var span = document.createElement('span');
        span.textContent = brand;
        span.setAttribute('data-zc-mobile-brand-title', '1');

        if (before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(span, node);
        if (after) parent.insertBefore(document.createTextNode(after), node);

        parent.removeChild(node);

        return span;
      }
    } catch (e) {}

    for (var j = 0; j < candidates.length; j++) {
      var el2 = candidates[j];

      if (isBadBrandCandidate(el2) || !isVisible(el2)) continue;
      if (!hasBrandText(el2.textContent)) continue;

      try {
        var r = el2.getBoundingClientRect();

        if (r.width > 0 && r.height > 0 && r.width < 360 && r.height < 80) {
          el2.setAttribute('data-zc-mobile-brand-title', '1');
          return el2;
        }
      } catch (e) {}
    }

    return null;
  }

  function clearBrandHosts() {
    document.querySelectorAll('.zc-mobile-brand-force-host').forEach(function (el) {
      el.classList.remove('zc-mobile-brand-force-host');
    });
  }

  function attachMobileToggleToBrand() {
    if (!mobileToggle) return;

    if (!isMobile()) {
      mobileToggle.classList.remove('zc-mobile-attached');
      clearBrandHosts();

      if (mobileToggle.parentElement !== document.body) {
        document.body.insertBefore(mobileToggle, document.body.firstChild);
      }

      closeSidebar();
      return;
    }

    var brand = findBrandElement();

    if (!brand || !brand.parentElement) {
      mobileToggle.classList.remove('zc-mobile-attached');
      return;
    }

    var host = brand.parentElement;

    if (host.closest && host.closest('#wppAtendSidebar')) {
      mobileToggle.classList.remove('zc-mobile-attached');
      return;
    }

    clearBrandHosts();

    host.classList.add('zc-mobile-brand-force-host');
    mobileToggle.classList.add('zc-mobile-attached');

    if (mobileToggle.parentElement !== host) {
      host.insertBefore(mobileToggle, host.firstChild);
    }
  }

  function getInitials(name) {
    var s = String(name || '').trim();
    if (!s) return 'U';

    var parts = s.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();

    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function decodeJwtPayload(token) {
    try {
      if (!token || token.split('.').length !== 3) return {};

      var base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var json = decodeURIComponent(
        atob(base64)
          .split('')
          .map(function (c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
          })
          .join('')
      );

      return JSON.parse(json) || {};
    } catch (e) {
      return {};
    }
  }

  function pickStorage(keys) {
    for (var i = 0; i < keys.length; i++) {
      try {
        var v = localStorage.getItem(keys[i]);
        if (v) return v;
      } catch (e) {}
    }

    return '';
  }

  function normalizeUrl(value) {
    var s = String(value || '').trim();

    if (!s) return '';
    if (s.indexOf('data:') === 0) return s;
    if (/^https?:\/\//i.test(s)) return s;
    if (s.charAt(0) === '/') return s;

    return '/' + s.replace(/^\/+/, '');
  }

  function renderUserFromStorage() {
    var token = pickStorage(['access_token', 'token']);
    var jwt = decodeJwtPayload(token);

    var nome =
      pickStorage(['usuario_nome', 'nome', 'name', 'displayName', 'user_name']) ||
      jwt.name ||
      jwt.given_name ||
      '';

    var email =
      pickStorage(['usuario_email', 'email', 'userEmail', 'loginEmail', 'user_email']) ||
      jwt.email ||
      jwt.preferred_username ||
      jwt.sub ||
      '';

    var avatar = pickStorage(['usuario_avatar', 'avatar_url']);

    if (userNameEl) userNameEl.textContent = nome || 'Usuário';
    if (userEmailEl) userEmailEl.textContent = email || 'Sem e-mail';
    if (initialsEl) initialsEl.textContent = getInitials(nome || email || 'Usuário');

    if (avatarImg) {
      if (avatar) {
        var src = normalizeUrl(avatar);

        try {
          var v = localStorage.getItem('usuario_avatar_v') || '';
          if (src && src.indexOf('data:') !== 0) {
            src += (src.indexOf('?') >= 0 ? '&' : '?') + 'v=' + encodeURIComponent(v || Date.now());
          }
        } catch (e) {}

        avatarImg.onerror = function () {
          avatarImg.removeAttribute('src');
          avatarImg.style.display = 'none';

          if (initialsEl) initialsEl.style.display = '';
        };

        avatarImg.src = src;
        avatarImg.style.display = 'block';

        if (initialsEl) initialsEl.style.display = 'none';
      } else {
        avatarImg.removeAttribute('src');
        avatarImg.style.display = 'none';

        if (initialsEl) initialsEl.style.display = '';
      }
    }
  }

  function base64ToDataUrl(base64, mime) {
    var raw = String(base64 || '').trim();

    if (!raw) return '';
    if (raw.indexOf('data:') === 0) return raw;

    return 'data:' + (mime || 'image/png') + ';base64,' + raw;
  }

  async function hydrateUserFromApi() {
    try {
      var res = await fetch('/api/perfil', {
        method: 'GET',
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });

      if (!res.ok) return;

      var data = await res.json();

      if (!data || typeof data !== 'object') return;

      var nome = data.nome || data.name || data.usuario_nome || '';
      var email = data.email || data.usuario_email || '';
      var dept = data.departamento || data.setor || data.department || data.dept || data.cargo || '';

      var avatar =
        data.avatar_url ||
        data.foto_url ||
        data.avatar ||
        data.foto ||
        data.picture ||
        '';

      var avatarBase64 =
        data.avatar_base64 ||
        data.foto_base64 ||
        data.avatar_data ||
        '';

      var avatarMime =
        data.avatar_mime ||
        data.foto_mime ||
        'image/png';

      if (!avatar && avatarBase64) avatar = base64ToDataUrl(avatarBase64, avatarMime);
      if (!avatar) avatar = '/api/perfil/avatar';

      avatar = normalizeUrl(avatar);

      try {
        if (nome) localStorage.setItem('usuario_nome', String(nome));
        if (email) localStorage.setItem('usuario_email', String(email));
        if (dept) localStorage.setItem('usuario_departamento', String(dept));

        if (avatar) {
          localStorage.setItem('usuario_avatar', avatar);
          localStorage.setItem('avatar_url', avatar);
          localStorage.setItem('usuario_avatar_v', String(Date.now()));
        }
      } catch (e) {}

      renderUserFromStorage();
    } catch (e) {}
  }

  function closeMenu() {
    if (userMenu) userMenu.classList.remove('show');

    if (userBtn) {
      userBtn.classList.remove('active');
      userBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function toggleMenu() {
    if (!userMenu || !userBtn) return;

    var open = !userMenu.classList.contains('show');

    userMenu.classList.toggle('show', open);
    userBtn.classList.toggle('active', open);
    userBtn.setAttribute('aria-expanded', String(open));
  }

  function go(url) {
    window.location.href = url;
  }

  function isDark() {
    return document.documentElement.classList.contains('dark') ||
      document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function setTheme(mode) {
    var dark = String(mode) === 'dark';
    var root = document.documentElement;

    try {
      if (window.AppTheme && typeof window.AppTheme.set === 'function') {
        window.AppTheme.set(dark ? 'dark' : 'light');
      }
    } catch (e) {}

    root.classList.toggle('dark', dark);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');

    try {
      localStorage.setItem('zc:theme', dark ? 'dark' : 'light');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      localStorage.setItem('valora_theme', dark ? 'dark' : 'light');
    } catch (e) {}
  }

  async function doLogout() {
    try {
      await fetch('/api/auth/logout', {
        method: 'POST',
        credentials: 'include'
      });
    } catch (e) {}

    try {
      await fetch('/logout', {
        method: 'POST',
        credentials: 'include'
      });
    } catch (e) {}

    try {
      var past = 'Thu, 01 Jan 1970 00:00:00 GMT';
      var names = (document.cookie || '').split(/;\s*/).filter(Boolean).map(function (c) {
        return c.split('=')[0];
      });

      names.forEach(function (name) {
        document.cookie = name + '=; Expires=' + past + '; Path=/';
      });
    } catch (e) {}

    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}

    if ('caches' in window) {
      try {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) {
          return caches.delete(k);
        }));
      } catch (e) {}
    }

    window.location.replace('/');
  }

  if (mobileToggle) {
    mobileToggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      openSidebar();
    });
  }

  if (mobileClose) {
    mobileClose.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      closeSidebar();
    });
  }

  if (mobileOverlay) {
    mobileOverlay.addEventListener('click', function () {
      closeSidebar();
      closeMenu();
    });
  }

  document.querySelectorAll('.wpp-leftbar-icon[href]').forEach(function (link) {
    link.addEventListener('click', function () {
      if (isMobile()) {
        closeSidebar();
        closeMenu();
      }
    });
  });

  if (userBtn) {
    userBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu();
    });
  }

  document.addEventListener('click', function (e) {
    if (userMenu && userBtn && !userMenu.contains(e.target) && !userBtn.contains(e.target)) {
      closeMenu();
    }
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeMenu();
      closeSidebar();
    }
  });

  window.addEventListener('resize', function () {
    attachMobileToggleToBrand();

    if (!isMobile()) {
      closeSidebar();
    }

    markActive();
  });

  window.addEventListener('orientationchange', function () {
    setTimeout(attachMobileToggleToBrand, 120);
  });

  if (openProfileBtn) {
    openProfileBtn.addEventListener('click', function () {
      closeMenu();
      closeSidebar();
      go('/perfil.html');
    });
  }

  if (myPlanBtn) {
    myPlanBtn.addEventListener('click', function () {
      closeMenu();
      closeSidebar();
      go('/meu-plano');
    });
  }

  if (configBtn) {
    configBtn.addEventListener('click', function () {
      closeMenu();
      closeSidebar();
      go('/configuracoes.html');
    });
  }

  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      setTheme(isDark() ? 'light' : 'dark');
      closeMenu();
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      closeMenu();
      closeSidebar();
      doLogout();
    });
  }

  markActive();
  renderUserFromStorage();
  hydrateUserFromApi();

  attachMobileToggleToBrand();
  setTimeout(attachMobileToggleToBrand, 50);
  setTimeout(attachMobileToggleToBrand, 180);
  setTimeout(attachMobileToggleToBrand, 400);
  setTimeout(attachMobileToggleToBrand, 900);
  setTimeout(attachMobileToggleToBrand, 1600);
  setTimeout(attachMobileToggleToBrand, 4500);

  try {
    var obs = new MutationObserver(function () {
      attachMobileToggleToBrand();
    });

    obs.observe(document.body, {
      childList:true,
      subtree:true,
      characterData:true
    });

    setTimeout(function () {
      try { obs.disconnect(); } catch (e) {}
    }, 6000);
  } catch (e) {}
})();
