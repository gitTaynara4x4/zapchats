<!-- /frontend/partials/sidebar-atendimentos.html
     Sidebar do ATENDIMENTOS com o MESMO comportamento do sidebar.html:
     - fininho por padrão
     - expande NO HOVER (desktop)
     - mostra label com animação (hover)
     - ícones iguais (copiados do sidebar.html)
     - SEM faixa verde
-->
<style>
  :root{
    --topbar-h:44px;
    --sbw:16.5rem;   /* expandido */
    --sbw-c:3.2rem;  /* colapsado */

    --icon:#9ca3af;
    --icon-active-light:#000000;
    --icon-active-dark:#ffffff;

    --card:#161617; --border:#27272a; --fg:#e5e7eb; --muted:#9ca3af; --hover:rgba(255,255,255,.04);
    --ring:#4f83ff;
  }
  html:not(.dark),
  html[data-theme="light"]{
    --card:#fff; --border:#e5e7eb; --fg:#1f2937; --muted:#6b7280; --hover:rgba(0,0,0,.06);
  }

  /* ===== Sidebar (igual sidebar.html, sem faixa) ===== */
  .app-sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    width:var(--sbw-c);
    padding:1rem 0;
    padding-top:calc(var(--topbar-h) + 1rem);

    background:transparent;
    border-right:0;
    display:flex;
    flex-direction:column;
    z-index:70;

    transition:width .22s ease;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    letter-spacing:-.01em;

    /* importante pra colapsar certinho */
    overflow:hidden;
  }

  /* expande no hover (DESKTOP) */
  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover{
      width:var(--sbw);
      overflow:auto;
      padding-left:.45rem;
      padding-right:.45rem;
    }
  }

  /* fundo/placa igual sidebar.html (sem faixa) */
  .app-sidebar::before{
    content:"";
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,0)), var(--card);
    pointer-events:none;
    z-index:0;
    transition:width .22s ease;
  }

  /* ===== Logo (mesmo fade) ===== */
  .app-sidebar .logo{
    height:56px; margin:0 0 1rem;
    display:grid; place-items:center;
    position:relative; z-index:1;
  }

  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover .logo{
      justify-items:start;
      padding:0 .7rem 0 .6rem;
    }
  }

  .logo .logo-fav,
  .logo .logo-full{
    grid-area:1/1;
    max-height:50px;
    will-change:opacity, transform;
    backface-visibility:hidden;
    transform:translateZ(0);
    contain:paint;
  }
  .logo .logo-fav{ opacity:1; transition:opacity .16s ease-in; }
  .logo .logo-full{ opacity:0; pointer-events:none; }

  @keyframes logoFadeInAtt {
    from { opacity:0; transform:translateY(2px) scale(.985); filter:blur(.6px); }
    to   { opacity:1; transform:none; filter:none; }
  }

  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover .logo .logo-fav{
      opacity:0; pointer-events:none; transition:opacity .12s ease-out;
    }
    .app-sidebar:hover .logo .logo-full{
      opacity:1; pointer-events:auto;
      animation:logoFadeInAtt .42s cubic-bezier(.2,.7,.2,1) both;
      animation-delay:.06s;
    }
  }

  html.dark .app-sidebar .logo .logo-full.logo-dark{ opacity:0; }
  html.dark .app-sidebar .logo .logo-full.logo-light{ opacity:0; }
  html:not(.dark) .app-sidebar .logo .logo-full.logo-light{ opacity:0; }
  html:not(.dark) .app-sidebar .logo .logo-full.logo-dark{ opacity:0; }

  @media (hover:hover) and (pointer:fine){
    html.dark .app-sidebar:hover .logo .logo-full.logo-dark{ opacity:1; }
    html.dark .app-sidebar:hover .logo .logo-full.logo-light{ opacity:0; }

    html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-light{ opacity:1; }
    html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-dark{ opacity:0; }
  }

  /* ===== Nav ===== */
  .app-sidebar nav{
    display:flex;
    flex-direction:column;
    gap:.5rem;
    position:relative;
    z-index:1;
    flex:1 1 auto;
    overflow-y:auto;
    padding-right:2px;
  }

  .app-sidebar nav a{
    display:flex;
    align-items:center;
    gap:.75rem;

    justify-content:center;
    padding:.5rem 0;

    border-radius:.75rem;
    color:var(--muted);
    background:transparent !important;
    border:0 !important;
    box-shadow:none !important;
    outline:0 !important;
    text-decoration:none;
    font-weight:600;

    transition:background .15s,color .15s, padding .2s ease, justify-content .2s ease, gap .2s ease;
  }

  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover nav a{
      justify-content:flex-start;
      padding:.5rem .7rem .5rem .6rem;
    }
  }

  .nav-icon{
    width:26px; height:26px;
    flex:0 0 26px;
    display:inline-grid;
    place-items:center;
    color:var(--icon);
  }
  .nav-icon-svg{ width:22px; height:22px; display:block; }

  /* label escondida no colapsado */
  .label{
    white-space:nowrap;
    overflow:hidden;
    opacity:0;
    max-width:0;
    transform:translateX(-6px);
    transition:opacity .18s ease, max-width .22s ease, transform .22s ease;
  }

  /* label aparece no hover (desktop) */
  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover .label{
      opacity:1;
      max-width:14rem;
      transform:translateX(0);
    }
  }

  /* Hover/Active */
  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover nav a:hover,
    .app-sidebar:hover nav a:focus-visible{
      background:var(--hover) !important;
      color:var(--fg);
      outline:none;
    }
  }

  nav a.active,
  nav a[aria-current="page"]{
    background:var(--hover) !important;
    color:var(--fg);
  }

  html.dark nav a.active .nav-icon,
  html.dark nav a[aria-current="page"] .nav-icon{ color:var(--icon-active-dark); }

  html:not(.dark) nav a.active .nav-icon,
  html:not(.dark) nav a[aria-current="page"] .nav-icon{ color:var(--icon-active-light); }

  /* Focus */
  nav a:focus{ outline:none; }
  @media (hover:hover) and (pointer:fine){
    .app-sidebar:hover nav a:focus-visible{
      outline:2px solid var(--ring);
      outline-offset:2px;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .logo .logo-fav,
    .logo .logo-full,
    .label{
      transition:none !important;
      animation:none !important;
      filter:none !important;
      transform:none !important;
    }
  }
</style>

    aside.querySelectorAll('nav a[href]').forEach(function(a){
      try{
        var pFull=new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/,'') || '/';
        var pFile=pFull.split('/').pop();
        if(pFull===nowFull || pFile===nowFile){
          a.classList.add('active');
          a.setAttribute('aria-current','page');
        }
      }catch{}
    });
  }

  var out=document.getElementById('sidebarLogoutAtt');
  if(out && !out.dataset.bound){
    out.dataset.bound='1';
    out.addEventListener('click', async function(ev){
      ev.preventDefault();
      try{ await fetch('/api/auth/logout', { method:'POST', credentials:'include' }); }catch{}
      try{ localStorage.clear(); sessionStorage.clear(); }catch{}
      window.location.replace('/');
    });
  }
})();
</script>
