<style>
  :root{
    --topbar-h:44px;

    --card:#161617; --border:#27272a; --fg:#e5e7eb; --muted:#9ca3af; --hover:rgba(255,255,255,.06);
    --ring:#4f83ff; --danger:#ef4444; --overlay:rgba(0,0,0,.55);

    --icon:#9ca3af;
    --icon-active-light:#000000;
    --icon-active-dark:#ffffff;
  }
  html:not(.dark){
    --card:#fff; --border:#e5e7eb; --fg:#1f2937; --muted:#6b7280; --hover:rgba(0,0,0,.06); --overlay:rgba(0,0,0,.45);
  }

  /* Painel interno ocupa 100% da largura disponível do flyout */
  .app-sidebar{
    width:100%; min-height:100%;
    background:var(--card); border-right:0 !important;
    padding:1rem .75rem calc(1rem + env(safe-area-inset-bottom));
    padding-top:calc(var(--topbar-h) + .75rem);
    display:flex; flex-direction:column; overflow:auto; position:relative;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; letter-spacing:-.01em;
  }

  .app-sidebar nav{
    display:flex;
    flex-direction:column;
    gap:.5rem;
    position:relative; /* para o indicador animado */
  }

  /* Indicador “pílula” que desliza por trás do item ativo */
  .att-nav-indicator{
    position:absolute;
    left:.55rem;
    right:.55rem;
    border-radius:.8rem;
    background:var(--hover);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.06),
      0 8px 20px rgba(0,0,0,.45);
    opacity:0;
    pointer-events:none;
    transition:
      top .22s cubic-bezier(.28,1.2,.43,1),
      height .22s cubic-bezier(.28,1.2,.43,1),
      opacity .18s ease;
  }
  html:not(.dark) .att-nav-indicator{
    background:rgba(0,0,0,.04);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.9),
      0 8px 20px rgba(15,23,42,.12);
  }

  .app-sidebar nav a{
    position:relative;
    z-index:1; /* fica acima do indicador */
    display:flex;
    align-items:center;
    gap:.75rem;
    padding:.7rem .85rem;
    border-radius:.8rem;
    color:var(--muted);
    border:1px solid transparent;
    text-decoration:none;
    font-weight:500;
    font-size:15.5px;
    /* animação tipo sidebar principal */
    transition:
      background .18s ease,
      color .18s ease,
      border-color .18s ease,
      box-shadow .18s ease,
      transform .18s ease;
  }

  .app-sidebar nav a:hover{
    background:var(--hover);
    color:var(--fg);
    transform:translateX(1px);
    box-shadow:0 0 0 1px rgba(0,0,0,.12);
  }

  .app-sidebar nav a:active{
    transform:translateX(0) scale(.98);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
  }

  .app-sidebar nav a.active,
  .app-sidebar nav a[aria-current="page"]{
    color:var(--fg);
    border-color:var(--border);
    font-weight:600;
    /* quem destaca de verdade é o indicador animado */
    background:transparent;
    box-shadow:none;
  }

  /* ÍCONES – mesmo tamanho do sidebar principal */
  .att-nav-icon{
    width:26px;
    height:26px;
    flex:0 0 26px;
    display:inline-grid;
    place-items:center;
    color:var(--icon);
  }
  .att-nav-icon-svg{
    width:22px;
    height:22px;
    display:block;
  }

  html.dark .app-sidebar nav a.active .att-nav-icon,
  html.dark .app-sidebar nav a[aria-current="page"] .att-nav-icon{
    color:var(--icon-active-dark);
  }
  html:not(.dark) .app-sidebar nav a.active .att-nav-icon,
  html:not(.dark) .app-sidebar nav a[aria-current="page"] .att-nav-icon{
    color:var(--icon-active-light);
  }

  .label{
    display:inline-block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Efeito “abrir” texto só em dispositivos com hover (desktop) */
  @media (hover:hover){
    .app-sidebar nav a .label{
      max-width:0;
      opacity:0;
      transform:translateX(-4px);
      transition:
        max-width .22s cubic-bezier(.28,1.2,.43,1),
        opacity .16s ease,
        transform .18s ease;
    }

    .app-sidebar nav a:hover .label,
    .app-sidebar nav a.active .label,
    .app-sidebar nav a[aria-current="page"] .label{
      max-width:160px;
      opacity:1;
      transform:translateX(0);
    }

    /* dá um pouco mais de respiro para o texto expandir */
    .app-sidebar nav a{
      padding-right:1.2rem;
    }
  }

  .sb-sep{
    height:1px;
    background:var(--border);
    margin:.7rem 0 .5rem;
    opacity:.95;
  }
  .sb-footer{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:.6rem;
  }

  .logo{
    height:56px;
    margin:0 0 1rem;
    display:grid;
    place-items:center;
    position:relative;
    z-index:1;
  }
  .logo img{ max-height:50px; }

  .user-chip{
    display:flex;
    align-items:center;
    gap:.55rem;
    padding:.55rem .75rem;
    border:1px solid var(--border);
    border-radius:999px;
    background: var(--card);
    color:var(--muted);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    user-select:none;
  }
  .user-chip:focus-visible{
    outline:2px solid var(--ring);
    outline-offset:2px;
  }
  .user-chip .user-email{
    max-width:26ch;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:var(--fg);
  }
  .user-chip .avatar{
    width:22px;
    height:22px;
    border-radius:999px;
    object-fit:cover;
    display:none;
    box-shadow:0 0 0 1px var(--border);
  }
  html:not(.dark) .user-chip{ background:#fff; }

  .theme-toggle{
    --w:78px; --h:34px; --p:3px; --k:28px; --dx: calc(var(--w) - var(--k) - var(--p)*2);
    position:relative;
    width:var(--w);
    height:var(--h);
    padding:var(--p);
    border-radius:999px;
    border:1px solid;
    display:inline-block;
    background:#eceff3;
    border-color:#d5d9e0;
    cursor:pointer;
    user-select:none;
  }
  html.dark .theme-toggle{
    background:#2f323a;
    border-color:#3a3e46;
  }
  .theme-toggle input{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }
  .theme-toggle .slot{
    position:absolute;
    top:50%;
    width:28px;
    height:28px;
    margin-top:-14px;
    display:grid;
    place-items:center;
    pointer-events:none;
    opacity:.8;
  }
  .theme-toggle .slot svg{
    width:18px;
    height:18px;
  }
  .theme-toggle .slot.left{ left:8px; }
  .theme-toggle .slot.right{ right:8px; }
  .theme-toggle .slot svg *{
    stroke:#9aa3af;
  }
  html.dark .theme-toggle .slot svg *{
    stroke:#8a93a1;
  }
  .theme-toggle .thumb{
    position:absolute;
    top:var(--p);
    left:var(--p);
    width:var(--k);
    height:var(--k);
    border-radius:999px;
    transform:translateX(0);
    transition: transform .28s cubic-bezier(.28,1.2,.43,1);
    background:linear-gradient(180deg,#f8c266,#f59e0b);
    box-shadow:0 3px 6px rgba(0,0,0,.25),
               inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .theme-toggle.is-dark .thumb{
    transform: translateX(var(--dx));
    background:linear-gradient(180deg,#6ba6ff,#2563eb);
  }

  .logout{
    color:#ef4444 !important;
    font-weight:600;
  }
  .logout:hover{
    background:rgba(239,68,68,.12) !important;
    color:#fecaca !important;
  }

  /* ===== MINI LEFTBAR (whatsapp) COM MESMA ANIMAÇÃO DO SIDEBAR ===== */
  .wpp-leftbar{
    position:relative;
    width:3.2rem;                 /* mesma largura colapsada */
    flex:0 0 3.2rem;
    padding:.4rem 0;
    background:#111827;           /* pode ajustar pra usar var(--card) se quiser */
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:width .22s ease;
    overflow:visible;
  }

  .wpp-leftbar-icons{
    display:flex;
    flex-direction:column;
    gap:.35rem;
    width:100%;
    align-items:stretch;
  }

  .wpp-leftbar-icon{
    position:relative;
    display:flex;
    align-items:center;
    gap:.65rem;
    width:100%;
    padding:.5rem 0;
    border-radius:.75rem;
    color:var(--muted);
    text-decoration:none;
    justify-content:center;
    overflow:hidden;
    transition:
      background .15s ease,
      color .15s ease,
      padding .2s ease,
      gap .2s ease;
  }

  .wpp-leftbar-icon svg{
    width:22px;
    height:22px;
    flex:0 0 22px;
    display:block;
  }

  .wpp-leftbar-icon .wpp-label{
    white-space:nowrap;
    opacity:0;
    max-width:0;
    transform:translateX(-6px);
    transition:
      opacity .18s ease,
      max-width .22s cubic-bezier(.28,1.2,.43,1),
      transform .22s ease;
  }

  /* hover geral na barra: ela "abre" igual o sidebar */
  .wpp-leftbar:hover{
    width:16.5rem;  /* mesma largura expandida do sidebar */
  }

  .wpp-leftbar:hover .wpp-leftbar-icon{
    justify-content:flex-start;
    padding:.5rem .7rem .5rem .6rem;
  }

  .wpp-leftbar:hover .wpp-leftbar-icon svg{
    margin-right:.25rem;
  }

  .wpp-leftbar:hover .wpp-label{
    opacity:1;
    max-width:11rem;
    transform:translateX(0);
  }

  .wpp-leftbar-icon:hover{
    background:var(--hover);
    color:var(--fg);
  }

  .wpp-leftbar-icon[aria-current="page"]{
    background:var(--hover);
    color:var(--fg);
  }
</style>

<script>
(function(){
  // ===== THEME ENGINE: unifica .dark + data-theme + localStorage =====
  (function ThemeEngine(){
    const html = document.documentElement;
    const label = document.getElementById('themeSwitchAtt');
    const cb    = document.getElementById('themeCheckboxAtt');

    function updateSwitch(isDark){
      if (cb) cb.checked = isDark;
      if (label) label.classList.toggle('is-dark', isDark);
    }
    function applyTheme(mode){
      const isDark = mode === 'dark';
      html.classList.toggle('dark', isDark);
      html.setAttribute('data-theme', mode);
      try {
        localStorage.setItem('zc:theme', mode);
        localStorage.setItem('theme',   mode);
      } catch {}
      updateSwitch(isDark);
    }
    function currentPreference(){
      const saved = localStorage.getItem('zc:theme') || localStorage.getItem('theme');
      if (saved) return saved;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    applyTheme(currentPreference());
    if (cb) cb.addEventListener('change', ()=> applyTheme(cb.checked ? 'dark' : 'light'));
    window.addEventListener('storage', (e)=>{
      if (e.key === 'zc:theme' || e.key === 'theme') {
        applyTheme((e.newValue === 'dark') ? 'dark' : 'light');
      }
    });
    window.__ThemeApply = applyTheme;
  })();

  // ===== ATIVAR ITEM ATUAL + INDICADOR ANIMADO =====
  (function(){
    var aside = document.getElementById('appSidebarAtt');
    if (!aside) return;

    var nowFull = location.pathname.replace(/\/+$/,'');
    var nowFile = nowFull.split('/').pop();

    aside.querySelectorAll('nav a[href]').forEach(function(a){
      try{
        var pFull = new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/,'');
        var pFile = pFull.split('/').pop();
        if (pFull === nowFull || pFile === nowFile){
          a.classList.add('active');
          a.setAttribute('aria-current','page');
        }
      }catch(e){}
    });

    var nav = aside.querySelector('nav');
    var ind = nav && nav.querySelector('#attNavInd');

    if (!nav || !ind) return;

    function getCurrentLink(){
      return aside.querySelector('nav a.active') ||
             aside.querySelector('nav a[aria-current="page"]') ||
             aside.querySelector('nav a[href]');
    }

    function moveIndicator(link){
      if (!link){
        ind.style.opacity = 0;
        return;
      }
      var rect = link.getBoundingClientRect();
      var navRect = nav.getBoundingClientRect();
      var top = rect.top - navRect.top;

      ind.style.top = top + 'px';
      ind.style.height = rect.height + 'px';
      ind.style.opacity = 1;
    }

    // posição inicial
    moveIndicator(getCurrentLink());

    // ao clicar nos links, move para o novo alvo
    nav.addEventListener('click', function(e){
      var link = e.target.closest('a[href]');
      if (!link || !nav.contains(link)) return;
      setTimeout(function(){
        moveIndicator(getCurrentLink());
      }, 0);
    });

    // reajusta em resize
    window.addEventListener('resize', function(){
      moveIndicator(getCurrentLink());
    });
  })();

  // Render dados do usuário no chip
  (function(){
    function pick(){ for(var i=0;i<arguments.length;i++){ var k=arguments[i]; try{
      var v=localStorage.getItem(k); if(!v) continue;
      if((v.startsWith('{')&&v.endsWith('}'))||(v.startsWith('[')&&v.endsWith(']'))){ try{ return JSON.parse(v);}catch{} }
      return v;
    }catch{}} return ''; }
    function jwt(){ try{
      var tok=pick('access_token','token'); if(!tok||!tok.includes('.')) return {};
      return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))||{};
    }catch{ return {}; } }
    function info(){
      var nome=pick('nome','name','displayName','usuario_nome'); if(typeof nome==='object') nome=nome.nome||nome.name||nome.displayName||'';
      var dept=pick('departamento','usuario_departamento'); if(typeof dept==='object') dept=dept.departamento||'';
      var email=pick('email','userEmail','loginEmail');
      var obj=pick('usuario','user','me','auth_user','profile','auth');
      if(obj&&typeof obj==='object'){
        email=email||obj.email||(obj.user&&obj.user.email)||'';
        nome=nome||obj.nome||obj.name||(obj.user&&(obj.user.nome||obj.user.name))||'';
        dept=dept||obj.departamento||(obj.user&&obj.user.departamento)||'';
      }
      var j=jwt(); email=email||j.email||j.preferred_username||j.sub||''; nome=nome||j.name||j.given_name||j.nickname||'';
      return {nome:(nome||'').trim(), dept:(dept||'').trim(), email:(email||'').trim()};
    }
    function avatar(){ var a=localStorage.getItem('usuario_avatar')||localStorage.getItem('avatar_url')||''; if(!a){ var j=jwt(); a=(j&&j.picture)||''; } return a; }
    function render(){
      var label=document.getElementById('userEmailLabelAtt');
      var img=document.getElementById('userAvatarAtt');
      var icn=document.getElementById('userIconAtt');
      var chip=document.getElementById('userChipAtt');
      if(!label||!img||!icn||!chip) return;
      var u=info(); var txt=[u.nome,u.dept].filter(Boolean).join(' · ')||u.email||'Usuário';
      label.textContent=txt;
      chip.title=u.email||u.nome||'';
      var av=avatar();
      if(av){ img.src=av; img.style.display='block'; icn.style.display='none'; }
      else { img.removeAttribute('src'); img.style.display='none'; icn.style.display=''; }
    }
    render();
    window.addEventListener('auth:change', render);
    window.addEventListener('storage', function(ev){
      if (['usuario_nome','nome','name','displayName','usuario_departamento','departamento','email','userEmail','loginEmail','usuario_avatar','avatar_url','usuario','user','me','auth_user','profile','auth','access_token','token'].includes(ev.key)){ render(); }
    });
  })();

  // Pré-carrega avatar do servidor (se ainda não existir no localStorage)
  (async function(){
    if (localStorage.getItem('usuario_avatar')) return;
    var token=localStorage.getItem('access_token')||localStorage.getItem('token'); if(!token) return;
    try{
      var res=await fetch('/api/usuarios/me/avatar',{credentials:'include',headers:{Authorization:'Bearer '+token}});
      if(!res.ok) return;
      var blob=await res.blob(); var r=new FileReader();
      r.onloadend=function(){
        try{localStorage.setItem('usuario_avatar', r.result);}catch{}; 
        var img=document.getElementById('userAvatarAtt'); var icn=document.getElementById('userIconAtt');
        if(img){img.src=r.result; img.style.display='block';}
        if(icn) icn.style.display='none';
      };
      r.readAsDataURL(blob);
    }catch{}
  })();

  // ===== Modal Perfil =====
  (function(){
    var modal=document.getElementById('pfModalAtt');
    var fileInput=document.getElementById('pfFileAtt');
    var preview=document.getElementById('pfPreviewAtt');
    var nomeInput=document.getElementById('pfNomeAtt');
    var emailInput=document.getElementById('pfEmailAtt');
    var deptInput=document.getElementById('pfDeptAtt');
    var msg=document.getElementById('pfMsgAtt');

    // move modal para <body> (independente do host)
    if (modal && modal.parentElement !== document.body) {
      document.body.appendChild(modal);
    }

    function jwt(){ try{ var t=localStorage.getItem('access_token')||localStorage.getItem('token')||''; if(!t||!t.includes('.')) return {}; return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))||{}; }catch{ return {}; } }
    function me(){ var n=localStorage.getItem('nome')||''; var e=localStorage.getItem('email')||''; var d=localStorage.getItem('departamento')||localStorage.getItem('usuario_departamento')||''; var j=jwt(); if(!n) n=j.name||j.given_name||''; if(!e) e=j.email||j.preferred_username||''; return {nome:n,email:e,dept:d}; }

    function openPf(){
      var u=me();
      nomeInput.value=u.nome||''; emailInput.value=u.email||''; deptInput.value=u.dept||''; msg.textContent='';
      var av=localStorage.getItem('usuario_avatar')||''; if(av) preview.src=av; else preview.removeAttribute('src');
      modal.style.display='flex'; modal.setAttribute('aria-hidden','false');
      try{ nomeInput.focus(); }catch{}
    }
    function closePf(){
      modal.style.display='none'; modal.setAttribute('aria-hidden','true');
    }

    window.PfModal = { open: openPf, close: closePf };

    document.getElementById('pfCloseAtt')?.addEventListener('click', function(e){ e.preventDefault(); closePf(); });
    document.getElementById('pfCancelAtt')?.addEventListener('click', function(e){ e.preventDefault(); closePf(); });
    document.getElementById('pfSaveAtt')?.addEventListener('click', function(e){ e.preventDefault(); save(); });

    fileInput?.addEventListener('change', function(){
      var f=fileInput.files&&fileInput.files[0]; if(!f) return;
      var fr=new FileReader(); fr.onload=function(){ preview.src=fr.result; }; fr.readAsDataURL(f);
    });

    async function uploadAvatarIfNeeded(){
      var f=fileInput.files&&fileInput.files[0];
      if(!f) return true;
      msg.textContent='Enviando foto...';
      var token=localStorage.getItem('access_token')||localStorage.getItem('token')||'';
      var fd=new FormData(); fd.append('file', f, f.name);
      try{
        var res=await fetch('/api/usuarios/me/avatar',{method:'POST',credentials:'include',headers: token?{Authorization:'Bearer '+token}:{},body:fd});
        if(!res.ok){ msg.textContent='Não foi possível enviar a foto ('+res.status+').'; return false; }
        await new Promise(function(resolve){
          var r=new FileReader();
          r.onloadend=function(){
            try{localStorage.setItem('usuario_avatar', r.result);}catch{}; 
            var img=document.getElementById('userAvatarAtt'); var icn=document.getElementById('userIconAtt');
            if(img){img.src=r.result; img.style.display='block';} if(icn) icn.style.display='none';
            resolve();
          };
          r.readAsDataURL(f);
        });
        msg.textContent='Foto atualizada.'; return true;
      }catch{
        msg.textContent='Erro ao enviar foto.'; return false;
      }
    }

    async function save(){
      msg.textContent='Salvando...';
      try{
        var n=(nomeInput.value||'').trim();
        var d=(deptInput.value||'').trim();
        if(n) localStorage.setItem('nome', n);
        if(d) localStorage.setItem('departamento', d);
      }catch{}
      var token=localStorage.getItem('access_token')||localStorage.getItem('token')||'';
      if(token){
        try{
          var payload={nome:(nomeInput.value||'').trim(),departamento:(deptInput.value||'').trim()};
          await fetch('/api/usuarios/me',{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});
        }catch{}
      }
      var ok=await uploadAvatarIfNeeded(); if(!ok) return;
      var label=document.getElementById('userEmailLabelAtt');
      var n2=(nomeInput.value||'').trim(); var d2=(deptInput.value||'').trim(); var e2=(emailInput.value||'').trim();
      label.textContent=[n2||null,d2||null].filter(Boolean).join(' · ')||e2||'Usuário';
      msg.textContent='Informações salvas.'; setTimeout(closePf, 600);
    }

    // Abrir modal pelo chip
    document.addEventListener('click', function (e) {
      var chip = e.target.closest('#userChipAtt');
      if (chip) { e.preventDefault(); window.PfModal && PfModal.open(); }
    });
    document.addEventListener('click', function (e) {
      if (modal.style.display === 'none') return;
      if (e.target === modal) { e.preventDefault(); window.PfModal && PfModal.close(); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { window.PfModal && PfModal.close(); }
    });
  })();

  // Logout (idempotente)
  (function(){
    var out=document.getElementById('sidebarLogoutAtt');
    if (!out || out.dataset.bound) return;
    out.dataset.bound='1';
    out.addEventListener('click', function(ev){
      ev.preventDefault();
      try {
        ['token','access_token','refresh_token','email','role','empresa_id','user_id','nome','departamento','usuario','user','me','auth_user','profile','auth','usuario_avatar','avatar_url']
          .forEach(function(k){ localStorage.removeItem(k); });
        sessionStorage.clear();
      } catch {}
      location.href='/frontend/login';
    });
  })();
})();
</script>
