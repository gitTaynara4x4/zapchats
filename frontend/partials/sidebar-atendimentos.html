<style>
  .wpp-leftbar{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    width:64px !important;
    min-width:64px !important;
    max-width:64px !important;
    height:100vh;
    min-height:100vh;
    box-sizing:border-box;
    position:relative;
    z-index:80;
    overflow:visible !important;
    background:var(--leftbar-bg, var(--panel-2, #111827));
    transition:
      width .22s ease,
      min-width .22s ease,
      max-width .22s ease,
      box-shadow .22s ease;
  }

  .wpp-leftbar:hover{
    width:220px !important;
    min-width:220px !important;
    max-width:220px !important;
    box-shadow:10px 0 28px rgba(0,0,0,.22);
  }

  .wpp-leftbar-icons{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    flex:1 1 auto;
    min-height:0;
    width:100%;
  }

  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon{
    width:100% !important;
    min-width:0 !important;
    margin:0 !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    gap:0 !important;
    padding:12px 0 !important;
    border-radius:14px;
    background:transparent;
    color:inherit;
    text-decoration:none;
    transition:
      background .18s ease,
      padding .18s ease,
      justify-content .18s ease,
      gap .18s ease,
      color .18s ease;
  }

  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon:hover,
  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon[aria-current="page"],
  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon.is-active{
    background:rgba(255,255,255,.06);
    color:var(--accent, #25d366);
  }

  .wpp-leftbar:hover .wpp-leftbar-icons > .wpp-leftbar-icon{
    justify-content:flex-start !important;
    gap:12px !important;
    padding:12px !important;
  }

  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon svg{
    width:22px !important;
    height:22px !important;
    min-width:22px !important;
    display:block;
    flex:0 0 auto;
    fill:currentColor;
  }

  .wpp-leftbar .wpp-leftbar-icons > .wpp-leftbar-icon .wpp-label{
    opacity:0;
    max-width:0;
    overflow:hidden;
    white-space:nowrap;
    transform:translateX(-6px);
    transition:
      opacity .18s ease,
      max-width .22s ease,
      transform .22s ease;
    pointer-events:none;
  }

  .wpp-leftbar:hover .wpp-leftbar-icons > .wpp-leftbar-icon .wpp-label{
    opacity:1;
    max-width:180px;
    transform:translateX(0);
  }

  .wpp-leftbar-user-wrap{
    margin-top:auto;
    position:relative;
    padding-top:10px;
    border-top:1px solid rgba(148,163,184,.18);
    width:100%;
    display:flex;
    justify-content:center;
  }

  .wpp-leftbar-user-btn{
    width:100% !important;
    min-width:0 !important;
    margin:0 !important;
    box-sizing:border-box !important;
    display:flex !important;
    align-items:center !important;
    justify-content:center !important;
    gap:0 !important;
    border:0;
    background:transparent;
    color:inherit;
    padding:10px 0 !important;
    border-radius:14px;
    cursor:pointer;
    transition:
      background .18s ease,
      padding .18s ease,
      justify-content .18s ease,
      gap .18s ease;
  }

  .wpp-leftbar:hover .wpp-leftbar-user-btn{
    justify-content:flex-start !important;
    padding:12px !important;
    gap:12px !important;
  }

  .wpp-leftbar-user-btn:hover,
  .wpp-leftbar-user-btn.active{
    background:rgba(255,255,255,.06);
  }

  .wpp-leftbar-avatar{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:999px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(37,211,102,.14);
    color:#25d366;
    font-size:14px;
    font-weight:700;
    flex:0 0 auto;
  }

  .wpp-leftbar-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
  }

  .wpp-leftbar-user-info{
    min-width:0;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    opacity:0;
    max-width:0;
    transform:translateX(-6px);
    transition:
      opacity .18s ease,
      max-width .22s ease,
      transform .22s ease;
  }

  .wpp-leftbar:hover .wpp-leftbar-user-info{
    opacity:1;
    max-width:180px;
    transform:translateX(0);
  }

  .wpp-leftbar-user-info strong{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .wpp-leftbar-user-info span{
    font-size:11px;
    opacity:.75;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .wpp-leftbar-user-chevron{
    width:16px;
    height:16px;
    min-width:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    max-width:0;
    overflow:hidden;
    transform:translateX(-6px);
    transition:
      transform .2s ease,
      opacity .18s ease,
      max-width .22s ease;
  }

  .wpp-leftbar:hover .wpp-leftbar-user-chevron{
    opacity:.75;
    max-width:16px;
    transform:translateX(0);
  }

  .wpp-leftbar-user-chevron svg{
    width:16px;
    height:16px;
    display:block;
    fill:currentColor;
  }

  .wpp-leftbar-user-btn.active .wpp-leftbar-user-chevron{
    transform:rotate(180deg);
  }

  .wpp-leftbar-user-menu{
    position:absolute;
    left:4px;
    right:4px;
    bottom:calc(100% + 8px);
    background:var(--panel-2, #111827);
    border:1px solid var(--border, rgba(148,163,184,.18));
    border-radius:14px;
    padding:8px;
    box-shadow:0 18px 40px rgba(0,0,0,.28);
    opacity:0;
    visibility:hidden;
    transform:translateY(10px);
    transition:all .2s cubic-bezier(.16,1,.3,1);
    z-index:100;
  }

  .wpp-leftbar-user-menu.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }

  .wpp-leftbar-menu-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border:0;
    background:transparent;
    color:var(--text, #e5e7eb);
    border-radius:10px;
    cursor:pointer;
    text-decoration:none;
    font-size:13px;
    font-weight:500;
    text-align:left;
  }

  .wpp-leftbar-menu-item:hover{
    background:rgba(255,255,255,.06);
  }

  .wpp-leftbar-menu-item .icon{
    width:16px;
    height:16px;
    min-width:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:.78;
  }

  .wpp-leftbar-menu-item .icon svg{
    width:16px;
    height:16px;
    display:block;
    fill:currentColor;
  }

  .wpp-leftbar-menu-divider{
    height:1px;
    background:rgba(148,163,184,.18);
    margin:6px 0;
  }

  .wpp-leftbar-menu-item.danger{
    color:#f87171;
  }

  .wpp-leftbar-menu-item.danger:hover{
    background:rgba(239,68,68,.10);
  }

  @media (max-width:920px){
    .wpp-leftbar{
      display:none !important;
    }
  }
</style>

<script>
(function () {
  if (window.__WPP_SIDEBAR_ATEND_READY__) return;
  window.__WPP_SIDEBAR_ATEND_READY__ = true;

  var userBtn = document.getElementById('wppUserMenuBtn');
  var userMenu = document.getElementById('wppUserMenu');
  var avatarImg = document.getElementById('wppUserAvatarImg');
  var initialsEl = document.getElementById('wppUserInitials');
  var userNameEl = document.getElementById('wppUserName');
  var userEmailEl = document.getElementById('wppUserEmail');

  var openProfileBtn = document.getElementById('wppOpenProfileBtn');
  var myPlanBtn = document.getElementById('wppMyPlanBtn');
  var configBtn = document.getElementById('wppConfigBtn');
  var themeBtn = document.getElementById('wppThemeBtn');
  var logoutBtn = document.getElementById('wppLogoutBtn');

  function norm(path) {
    path = String(path || '').toLowerCase().trim();
    path = path.split('?')[0].split('#')[0];
    path = path.replace(/\/+$/, '');
    return path || '/';
  }

  function currentMenu() {
    var p = norm(location.pathname);
    if (p === '/' || p === '/dashboard' || p === '/dashboard.html' || p === '/inicio') return 'dashboard';
    if (p.indexOf('/atendimentos') === 0) return 'atendimentos';
    if (p.indexOf('/midias') === 0) return 'midias';
    if (p.indexOf('/chat-interno') === 0) return 'chat-interno';
    if (p.indexOf('/clientes') === 0) return 'clientes';
    if (p.indexOf('/colaboradores') === 0) return 'colaboradores';
    if (p.indexOf('/departamentos') === 0) return 'departamentos';
    if (p.indexOf('/chatbot') === 0) return 'chatbot';
    if (p.indexOf('/disparos') === 0) return 'disparos';
    if (p.indexOf('/conectar') === 0) return 'conectar';
    return '';
  }

  function markActive() {
    var cur = currentMenu();
    document.querySelectorAll('.wpp-leftbar-icon[data-menu]').forEach(function (el) {
      var on = el.getAttribute('data-menu') === cur;
      el.classList.toggle('is-active', on);
      if (on) el.setAttribute('aria-current', 'page');
      else el.removeAttribute('aria-current');
    });
  }

  function getInitials(name) {
    var s = String(name || '').trim();
    if (!s) return 'U';
    var parts = s.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function decodeJwtPayload(token) {
    try {
      if (!token || token.split('.').length !== 3) return {};
      return JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) || {};
    } catch (e) {
      return {};
    }
  }

  function pickStorage(keys) {
    for (var i = 0; i < keys.length; i++) {
      try {
        var v = localStorage.getItem(keys[i]);
        if (v) return v;
      } catch (e) {}
    }
    return '';
  }

  function renderUserFromStorage() {
    var token = pickStorage(['access_token', 'token']);
    var jwt = decodeJwtPayload(token);

    var nome = pickStorage(['usuario_nome', 'nome', 'name', 'displayName']) || jwt.name || jwt.given_name || '';
    var email = pickStorage(['usuario_email', 'email', 'userEmail', 'loginEmail']) || jwt.email || jwt.preferred_username || jwt.sub || '';
    var avatar = pickStorage(['usuario_avatar', 'avatar_url']);

    if (userNameEl) userNameEl.textContent = nome || 'Usuário';
    if (userEmailEl) userEmailEl.textContent = email || 'Sem e-mail';
    if (initialsEl) initialsEl.textContent = getInitials(nome || email || 'Usuário');

    if (avatarImg) {
      if (avatar) {
        avatarImg.onerror = function () {
          avatarImg.removeAttribute('src');
          avatarImg.style.display = 'none';
          if (initialsEl) initialsEl.style.display = '';
        };
        avatarImg.src = avatar;
        avatarImg.style.display = 'block';
        if (initialsEl) initialsEl.style.display = 'none';
      } else {
        avatarImg.removeAttribute('src');
        avatarImg.style.display = 'none';
        if (initialsEl) initialsEl.style.display = '';
      }
    }
  }

  async function hydrateUserFromApi() {
    try {
      var res = await fetch('/api/perfil', {
        method: 'GET',
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
      });
      if (!res.ok) return;

      var data = await res.json();
      if (!data || typeof data !== 'object') return;

      var nome = data.nome || data.name || '';
      var email = data.email || '';
      var avatar = data.avatar_url || data.avatar || '';

      try {
        if (nome) localStorage.setItem('usuario_nome', nome);
        if (email) localStorage.setItem('usuario_email', email);
        if (avatar) {
          localStorage.setItem('usuario_avatar', avatar);
          localStorage.setItem('avatar_url', avatar);
        }
      } catch (e) {}

      renderUserFromStorage();
    } catch (e) {}
  }

  function closeMenu() {
    if (userMenu) userMenu.classList.remove('show');
    if (userBtn) {
      userBtn.classList.remove('active');
      userBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function toggleMenu() {
    if (!userMenu || !userBtn) return;
    var open = !userMenu.classList.contains('show');
    userMenu.classList.toggle('show', open);
    userBtn.classList.toggle('active', open);
    userBtn.setAttribute('aria-expanded', String(open));
  }

  function go(url) {
    window.location.href = url;
  }

  function isDark() {
    return document.documentElement.classList.contains('dark') ||
      document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function setTheme(mode) {
    var dark = String(mode) === 'dark';
    var root = document.documentElement;

    try {
      if (window.AppTheme && typeof window.AppTheme.set === 'function') {
        window.AppTheme.set(dark ? 'dark' : 'light');
      }
    } catch (e) {}

    root.classList.toggle('dark', dark);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');

    try {
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      localStorage.setItem('valora_theme', dark ? 'dark' : 'light');
    } catch (e) {}
  }

  async function doLogout() {
    try {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    } catch (e) {}

    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}

    window.location.replace('/');
  }

  if (userBtn) {
    userBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleMenu();
    });
  }

  document.addEventListener('click', function (e) {
    if (!userMenu || !userBtn) return;
    if (!userMenu.contains(e.target) && !userBtn.contains(e.target)) {
      closeMenu();
    }
  });

  if (openProfileBtn) {
    openProfileBtn.addEventListener('click', function () {
      closeMenu();
      go('/perfil.html');
    });
  }

  if (myPlanBtn) {
    myPlanBtn.addEventListener('click', function () {
      closeMenu();
      go('/meu-plano');
    });
  }

  if (configBtn) {
    configBtn.addEventListener('click', function () {
      closeMenu();
      go('/configuracoes.html');
    });
  }

  if (themeBtn) {
    themeBtn.addEventListener('click', function () {
      setTheme(isDark() ? 'light' : 'dark');
      closeMenu();
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      closeMenu();
      doLogout();
    });
  }

  markActive();
  renderUserFromStorage();
  hydrateUserFromApi();
})();
</script>
