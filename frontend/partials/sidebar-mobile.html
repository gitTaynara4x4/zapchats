<!-- /frontend/partials/sidebar-mobile.html (MOBILE ONLY, espelha o desktop) -->
<style>
  :root{
    /* Tipografia unificada (mude --ui-size se quiser menor/maior) */
    --ui-font: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    --ui-size: 12px;

    --card:#161617; --border:#27272a; --fg:#e5e7eb; --muted:#9ca3af; --hover:rgba(255,255,255,.04);
    --ring:#4f83ff; --danger:#ef4444; --overlay:rgba(0,0,0,.5);
  }
  html, body { font-family: var(--ui-font); font-size: var(--ui-size); }
  html:not(.dark){ --card:#fff; --border:#e5e7eb; --fg:#1f2937; --muted:#6b7280; --hover:rgba(0,0,0,.06); --overlay:rgba(0,0,0,.45); }

  body{ padding-bottom: calc(68px + env(safe-area-inset-bottom)); }

  /* Dock inferior fixo */
  .mobile-dock{
    position:fixed; left:0; right:0; bottom:0;
    height:64px; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,0)), var(--card);
    border-top:1px solid var(--border); z-index:9999; display:flex; align-items:center;
    -webkit-transform:translateZ(0); transform:translateZ(0); backdrop-filter: blur(6px);
    font: inherit;
  }
  .mobile-dock .dock-scroll{
    display:flex; gap:8px; width:100%;
    overflow-x:auto; -webkit-overflow-scrolling:touch;
    scroll-snap-type:x proximity; padding:0 4px;
  }
  .mobile-dock .dock-scroll::-webkit-scrollbar{ display:none; }

  /* Itens */
  .mobile-dock a{
    flex:0 0 auto; width:68px; height:48px; border-radius:12px; border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--muted); text-decoration:none; background:transparent;
    scroll-snap-align:start; transition:background .15s,color .15s,border-color .15s; font-weight:600;
    font: inherit;
  }
  .mobile-dock a span{ font-size:inherit; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:54px; }
  .mobile-dock a.active{ color:var(--fg); background:var(--hover); border-color:var(--border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 0 0 1px rgba(0,0,0,.04); }
  html:not(.dark) .mobile-dock a.active{
    background:rgba(0,0,0,.06); box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 0 0 1px rgba(0,0,0,.04);
  }
  .mobile-dock a:active{ transform:translateY(1px); }

  /* Chip do usuário — mesmos IDs do desktop */
  .user-chip{
    display:flex; align-items:center; gap:.5rem;
    padding:.3rem .6rem; border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--muted); font-weight:700;
    cursor:pointer; user-select:none; flex:0 0 auto; height:48px; min-width:140px;
    font: inherit;
  }
  .user-chip .user-email{ max-width:18ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
  .user-chip .avatar{ width:22px; height:22px; border-radius:999px; object-fit:cover; display:none; box-shadow:0 0 0 1px var(--border); }
  .user-chip .avatar-fallback{ width:22px; height:22px; border-radius:9999px; display:none; align-items:center; justify-content:center;
    background:var(--hover); color:var(--fg); font-weight:800; box-shadow:0 0 0 1px var(--border); }
  html:not(.dark) .user-chip{ background:#fff; }

  .chip-plain{ display:flex; align-items:center; gap:.6rem; height:48px; padding:0; border:none; background:transparent; box-shadow:none; flex:0 0 auto; }

  /* ===== Toggle de tema (IDÊNTICO AO DESKTOP + FIX CENTRALIZAÇÃO) ===== */
  .theme-toggle{
    --w:78px; --h:34px; --p:3px; --k:28px; --dx: calc(var(--w) - var(--k) - var(--p)*2);
    position:relative; width:var(--w); height:var(--h); padding:var(--p);
    border-radius:999px; cursor:pointer; outline:none; border:1px solid;
    display:inline-block; isolation:isolate; background:#eceff3; border-color:#d5d9e0;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 2px rgba(0,0,0,.05);
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  html.dark .theme-toggle{ background:#2f323a; border-color:#3a3e46;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.03); }

  /* FIX: slots centralizados */
  .theme-toggle .slot{
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:grid; place-items:center; pointer-events:none; opacity:.75;
  }
  .theme-toggle .slot.left{ left:8px; } .theme-toggle .slot.right{ right:8px; }
  .theme-toggle .slot svg{ width:18px; height:18px; }
  .theme-toggle .slot svg *{ stroke:#9aa3af; } html.dark .theme-toggle .slot svg *{ stroke:#8a93a1; }

  /* FIX: thumb centralizado */
  .theme-toggle .thumb{
    position:absolute; top:50%; left:var(--p); width:var(--k); height:var(--k);
    border-radius:999px; transform: translate(0, -50%);
    transition: transform .38s cubic-bezier(.28,1.2,.43,1), box-shadow .2s ease, background .3s ease;
    display:grid; place-items:center; overflow:hidden;
    background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%), linear-gradient(180deg,#f8c266,#f59e0b);
    box-shadow: 0 4px 8px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .theme-toggle .thumb svg{ width:22px; height:22px; display:block; }
  .theme-toggle .thumb .thumb-sun{ display:block; }
  .theme-toggle .thumb .thumb-moon{ display:none; }

  html.dark .theme-toggle .thumb{
    transform: translate(var(--dx), -50%);
    background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%), linear-gradient(180deg,#6ba6ff,#2563eb);
    box-shadow: 0 6px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  html.dark .theme-toggle .thumb .thumb-sun{ display:none; }
  html.dark .theme-toggle .thumb .thumb-moon{ display:block; }

  /* manter centro no active */
  .theme-toggle:active .thumb{ transform: translate(0, -50%) scale(.96); }
  html.dark .theme-toggle:active .thumb{ transform: translate(calc(var(--dx)), -50%) scale(.96); }
  .theme-toggle:focus-visible{ box-shadow: 0 0 0 3px rgba(99,102,241,.35); }
  .theme-toggle.t-anim::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); animation: sweep .55s ease both;
  }
  @keyframes sweep{ 0%{ transform: translateX(-120%); opacity:0;} 30%{ opacity:.9;} 100%{ transform: translateX(120%); opacity:0;} }
  @media (prefers-reduced-motion: reduce){ .theme-toggle, .theme-toggle *{ transition:none !important; animation:none !important; } }

  /* ===== Modal Perfil (incluído no mobile) ===== */
  .pf-modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--overlay); z-index:10000; font: inherit; }
  .pf-modal.is-open{ display:flex; }
  .pf-dialog{ width:min(680px, 92vw); background:var(--card); border:1px solid var(--border); border-radius:1rem; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden; }
  .pf-hd{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); }
  .pf-hd h3{ margin:0; font: inherit; font-weight:600; }
  .pf-close{ background:transparent; border:none; cursor:pointer; color:var(--muted); font: inherit; }
  .pf-body{ padding:16px; display:grid; grid-template-columns:160px 1fr; gap:16px; }
  .pf-avatar-wrap{ display:flex; flex-direction:column; align-items:center; gap:.5rem; }
  .pf-avatar{ width:120px; height:120px; border-radius:999px; object-fit:cover; background:var(--hover); box-shadow:0 0 0 1px var(--border); }
  .pf-upload{ display:inline-block; padding:.45rem .7rem; border-radius:.6rem; border:1px solid var(--border); background:var(--card); cursor:pointer; font: inherit; }
  .pf-upload input{ display:none; }
  .pf-grid{ display:grid; gap:.75rem; }
  .pf-field label{ display:block; color:var(--muted); margin-bottom:.25rem; font: inherit; }
  .pf-field input{ width:100%; padding:.6rem .7rem; border-radius:.6rem; border:1px solid var(--border); background:var(--card); color:var(--fg); outline:none; font: inherit; }
  .pf-field input:focus{ box-shadow:0 0 0 3px var(--ring); border-color:transparent; }
  .pf-actions{ display:flex; gap:.5rem; justify-content:flex-end; padding:12px 16px; border-top:1px solid var(--border); }
  .pf-btn{ padding:.55rem .9rem; border-radius:.6rem; border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; font-weight:600; font: inherit; }
  .pf-btn.primary{ background:#10b981; border-color:#10b981; color:white; }
  .pf-btn.danger{ background:transparent; color:var(--danger); border-color:var(--danger); }
  .pf-msg{ padding:8px 16px; color:var(--muted); font: inherit; }

  @media (max-width:640px){
    .pf-body{ grid-template-columns:1fr; }
    .pf-avatar{ width:96px; height:96px; }
  }

  /* === PATCH: tamanhos dos SVGs no mobile (mesmo visual do desktop) === */
  .mobile-dock a .nav-icon{ display:grid; place-items:center; width:24px; height:24px; }
  .mobile-dock a .nav-icon-svg{ width:24px; height:24px; display:block; }
</style>

<div id="pfModal" class="pf-modal" aria-hidden="true" hidden>
  <div class="pf-dialog" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
    <div class="pf-hd">
      <h3 id="pfTitle">Meu perfil</h3>
      <button class="pf-close" id="pfClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="pf-body">
      <div class="pf-avatar-wrap">
        <img id="pfPreview" class="pf-avatar" alt="Avatar">
        <label class="pf-upload">
          <input id="pfFile" type="file" accept="image/*">
          <i class="fa fa-image" style="margin-right:.35rem"></i> Alterar foto
        </label>
      </div>
      <div class="pf-grid">
        <div class="pf-field">
          <label for="pfNome">Nome</label>
          <input id="pfNome" type="text" placeholder="Seu nome">
        </div>
        <div class="pf-field">
          <label for="pfEmail">E-mail</label>
          <input id="pfEmail" type="email" readonly>
        </div>
        <div class="pf-field">
          <label for="pfDept">Departamento (opcional)</label>
          <input id="pfDept" type="text" placeholder="Departamento">
        </div>
        <div id="pfMsg" class="pf-msg"></div>
      </div>
    </div>
    <div class="pf-actions">
      <button class="pf-btn" id="pfCancel">Cancelar</button>
      <button class="pf-btn primary" id="pfSave">Salvar alterações</button>
    </div>
  </div>
</div>

<script>
(function(){
  const DOCK_ID='mobileDock';

  /* garante <style> no <head> e move o dock pro <body> */
  (function ensureStyles(){
    if(!document.getElementById('mobile-dock-styles-to-head')){
      const host = document.currentScript?.parentNode;
      const s = host ? host.querySelectorAll('style') : [];
      if(s.length){
        const c=document.createElement('style'); c.id='mobile-dock-styles-to-head';
        c.textContent=[...s].map(x=>x.textContent).join('\n'); document.head.appendChild(c);
      }
    }
  })();
  (function hoist(){
    const n=document.getElementById(DOCK_ID);
    if(n && n.parentElement!==document.body) document.body.appendChild(n);
  })();

  /* marca ativo + prefetch */
  (function active(){
    const now=location.pathname.replace(/\/+$/,''); const file=now.split('/').pop();
    document.querySelectorAll('.mobile-dock a[href]').forEach(a=>{
      try{
        const p=new URL(a.getAttribute('href'),location.origin).pathname.replace(/\/+$/,'');
        const f=p.split('/').pop();
        if(p===now || f===file){ a.classList.add('active'); a.setAttribute('aria-current','page'); }
      }catch{}
      a.addEventListener('mouseenter',()=>{ try{
        const u=new URL(a.getAttribute('href'),location.origin);
        if(u.origin===location.origin){ const l=document.createElement('link'); l.rel='prefetch'; l.href=u.href; document.head.appendChild(l); }
      }catch{} },{once:true});
    });
  })();

  /* drag guard só para anchors (botão do chip não é afetado) */
  (function dragGuard(){
    const sc=document.getElementById('dockScroll'); if(!sc) return;
    let downX=0, moved=false;
    sc.addEventListener('pointerdown',e=>{ downX=e.clientX; moved=false; }, {passive:true});
    sc.addEventListener('pointermove',e=>{ if(Math.abs(e.clientX-downX)>8) moved=true; }, {passive:true});
    sc.querySelectorAll('a').forEach(a=>{
      a.addEventListener('click',e=>{ if(moved) e.preventDefault(); }, true);
    });
  })();

  /* === Tema (mesma lógica do desktop) === */
  (function theme(){
    const html=document.documentElement;
    const btn=document.getElementById('themeSwitchMobile'); if(!btn) return;

    function cur(){ try{
      if(window.AppTheme && typeof AppTheme.current==='function') return AppTheme.current();
      return localStorage.getItem('theme') || (html.classList.contains('dark')?'dark':'light');
    }catch{ return html.classList.contains('dark')?'dark':'light'; } }

    function set(t){
      try{
        if(window.AppTheme && typeof AppTheme.set==='function') AppTheme.set(t);
        else { html.classList.toggle('dark',t==='dark'); localStorage.setItem('theme',t); }
      }catch{}
      btn.setAttribute('aria-pressed', String(t==='dark'));
      btn.classList.remove('t-anim'); void btn.offsetWidth; btn.classList.add('t-anim');
      setTimeout(()=>btn.classList.remove('t-anim'), 580);
    }

    set(cur());
    btn.addEventListener('click', ()=> set(cur()==='dark'?'light':'dark'));
    window.addEventListener('storage', e=>{ if(e.key==='theme' && e.newValue) set(e.newValue); });
  })();

  /* === Helpers de usuário === */
  function pick(){ for(var i=0;i<arguments.length;i++){ var k=arguments[i]; try{
    var v = localStorage.getItem(k); if(!v) continue;
    if((v.startsWith('{')&&v.endsWith('}'))||(v.startsWith('[')&&v.endsWith(']'))){ try{ return JSON.parse(v); }catch{} }
    return v;
  }catch{}} return ''; }
  function jwtInfo(){
    try{
      var tok = pick('access_token','token');
      if(!tok || typeof tok!=='string' || !tok.includes('.')) return {};
      return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))) || {};
    }catch{ return {}; }
  }
  function userInfo(){
    var nome = pick('nome','name','displayName','usuario_nome','user_name');
    if(nome && typeof nome==='object') nome = nome.nome||nome.name||nome.displayName||'';
    var dept = pick('departamento','setor','department','dept','usuario_departamento','user_department');
    if(dept && typeof dept==='object') dept = dept.departamento||dept.setor||dept.department||dept.dept||'';
    var email = pick('email','userEmail','loginEmail','usuario_email','user_email');
    var obj = pick('usuario','user','me','auth_user','profile','auth');
    if(obj && typeof obj==='object'){
      email = email || obj.email || (obj.user&&obj.user.email) || '';
      nome  = nome  || obj.nome  || obj.name  || (obj.user&&(obj.user.nome||obj.user.name)) || '';
      dept  = dept  || obj.departamento || obj.setor || (obj.user&&(obj.user.departamento||obj.user.setor)) || '';
    }
    var jwt = jwtInfo();
    email = email || jwt.email || jwt.preferred_username || jwt.sub || '';
    nome  = nome  || jwt.name || jwt.given_name || jwt.nickname || '';
    return {nome:(nome||'').trim(), dept:(dept||'').trim(), email:(email||'').trim()};
  }
  function getAvatar(){
    var a = localStorage.getItem('usuario_avatar') || localStorage.getItem('avatar_url') || '';
    if(!a){ var jwt = jwtInfo(); a = (jwt && jwt.picture) || ''; }
    return a || '';
  }
  function initials(s){ s=String(s||'').trim(); if(!s) return 'US'; var p=s.split(/\s+/).slice(0,2); return p.map(x=>x[0]?.toUpperCase()||'').join('')||'US'; }
  function shortName(raw, fb){ const s=String(raw||fb||'Usuário').trim(); if(!s) return 'Usuário'; const p=s.split(/\s+/); let out=p[0]; if(p.length>1) out+=' '+p[p.length-1][0]+'.'; if(out.length>16) out=out.slice(0,15)+'…'; return out; }

  /* Hidrata chip + baixa avatar se precisar */
  (function hydrate(){
    const chip=document.getElementById('userChip');
    const label=document.getElementById('userEmailLabel');
    const img=document.getElementById('userAvatar');
    const icn=document.getElementById('userIcon');
    const fb=document.getElementById('userAvatarFallback');
    if(!chip||!label||!img||!icn||!fb) return;

    const u=userInfo();
    label.textContent = shortName(u.nome, u.email);
    chip.title = u.email || u.nome || '';

    const av=getAvatar();
    if (av){ img.src=av; img.style.display='block'; icn.style.display='none'; fb.style.display='none'; }
    else { img.removeAttribute('src'); img.style.display='none'; icn.style.display=''; fb.textContent=initials(u.nome||u.email); fb.style.display='flex'; }

    (async function(){
      if (localStorage.getItem('usuario_avatar')) return;
      const token = localStorage.getItem('access_token') || localStorage.getItem('token'); if(!token) return;
      try{
        const res = await fetch('/api/usuarios/me/avatar', {credentials:'include', headers:{Authorization:'Bearer '+token}});
        if(!res.ok) return;
        const blob = await res.blob(); const r = new FileReader();
        r.onloadend = function(){ try{ localStorage.setItem('usuario_avatar', r.result); }catch{}; img.src=r.result; img.style.display='block'; icn.style.display='none'; fb.style.display='none'; };
        r.readAsDataURL(blob);
      }catch{}
    })();
  })();

  /* ===== Modal Perfil ===== */
  (function ensureModalVisibleFlag(){
    const m = document.getElementById('pfModal');
    if (m) m.removeAttribute('hidden');
  })();

  function fillModal(modal){
    const u = userInfo();
    const nome = modal.querySelector('#pfNome');
    const email = modal.querySelector('#pfEmail');
    const dept = modal.querySelector('#pfDept');
    const preview = modal.querySelector('#pfPreview');
    if (nome) nome.value = u.nome || '';
    if (email) email.value = u.email || '';
    if (dept) dept.value = u.dept || '';
    const av = localStorage.getItem('usuario_avatar') || getAvatar();
    if (preview){ if(av) preview.src = av; else preview.removeAttribute('src'); }
  }

  function bindModalStaticEvents(modal){
    const closeBtn = modal.querySelector('#pfClose');
    const cancelBtn = modal.querySelector('#pfCancel');
    const saveBtn = modal.querySelector('#pfSave');
    const fileInput = modal.querySelector('#pfFile');
    const preview = modal.querySelector('#pfPreview');
    const msg = modal.querySelector('#pfMsg');
    const nomeInput = modal.querySelector('#pfNome');
    const deptInput = modal.querySelector('#pfDept');

    function close(){
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden','true');
      document.removeEventListener('keydown', onEsc);
      modal.removeEventListener('click', onBackdrop);
    }
    function onEsc(e){ if(e.key==='Escape') close(); }
    function onBackdrop(e){ if(e.target===modal) close(); }

    if (closeBtn) closeBtn.addEventListener('click', close);
    if (cancelBtn) cancelBtn.addEventListener('click', function(e){ e.preventDefault(); close(); });
    modal.addEventListener('click', onBackdrop);
    document.addEventListener('keydown', onEsc);

    if (fileInput && preview){
      fileInput.addEventListener('change', function(){
        const f = fileInput.files && fileInput.files[0];
        if (!f) return;
        const fr = new FileReader();
        fr.onload = function(){ preview.src = fr.result; };
        fr.readAsDataURL(f);
      });
    }

    if (saveBtn){
      saveBtn.addEventListener('click', async function(e){
        e.preventDefault();
        if (msg) msg.textContent = 'Salvando...';
        try{
          const nomeVal = (nomeInput?.value||'').trim();
          const deptVal = (deptInput?.value||'').trim();
          if (nomeVal) localStorage.setItem('nome', nomeVal);
          if (deptVal) localStorage.setItem('departamento', deptVal);
        }catch{}
        if (msg) msg.textContent = 'Informações salvas.';
        setTimeout(close, 500);
      });
    }
  }

  function openProfileModal(){
    const modal = document.getElementById('pfModal');
    if(!modal) return;
    fillModal(modal);
    modal.classList.add('is-open');
    modal.setAttribute('aria-hidden','false');

    if (!modal.dataset.bound){
      bindModalStaticEvents(modal);
      modal.dataset.bound = '1';
    }
  }

  // Clique do chip => abre modal
  const chipBtn = document.getElementById('userChip');
  if (chipBtn && !chipBtn.dataset.bound){
    chipBtn.dataset.bound = '1';
    chipBtn.addEventListener('click', function(e){ e.preventDefault(); openProfileModal(); });
    chipBtn.addEventListener('keydown', function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openProfileModal(); }});
  }
  // Delegado (fallback se o chip for recriado depois)
  document.addEventListener('click', function(e){
    const chip = e.target.closest('#userChip');
    if (!chip) return;
    e.preventDefault();
    openProfileModal();
  });

  /* Logout (igual ao desktop) */
  (function logout(){
    const out=document.getElementById('dockLogout'); if(!out) return;
    out.addEventListener('click', async function(ev){
      ev.preventDefault();

      // 1) avisa backend pra apagar cookies HttpOnly
      try{
        await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      }catch{}

      // 2) limpa cookies acessíveis via JS
      (function nukeCookies(){
        const past='Thu, 01 Jan 1970 00:00:00 GMT';
        const names=(document.cookie||'').split(/;\s*/).filter(Boolean).map(c=>c.split('=')[0]);
        for(const name of names){
          document.cookie = `${name}=; Expires=${past}; Path=/`;
        }
      })();

      // 3) limpa storages/caches
      try{ localStorage.clear(); sessionStorage.clear(); }catch{}
      if ('caches' in window) {
        try{
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }catch{}
      }

      // 4) redireciona pra raiz (login)
      window.location.replace('/');
    });
  })();

  /* dedupe */
  (function dedupe(){
    const docks=[...document.querySelectorAll('#'+DOCK_ID)];
    if(docks.length>1) docks.slice(1).forEach(el=>el.remove());
  })();
})();
</script>
