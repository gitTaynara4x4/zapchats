<script>
  (function () {
    try {
      var saved = localStorage.getItem("zapschat_theme");

      if (saved !== "dark" && saved !== "light") {
        saved = "light";
        localStorage.setItem("zapschat_theme", "light");
      }

      var isDark = saved === "dark";

      document.documentElement.classList.toggle("dark", isDark);
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    } catch (e) {
      document.documentElement.classList.remove("dark");
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>

  .zc-sidebar {

    font-family: var(--zc-font);

      box-shadow .22s ease,
      background .18s ease,
      border-color .18s ease;
  }

  .zc-sidebar.is-collapsed {
    width: var(--zc-sidebar-collapsed-width);
  }

  .zc-sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 2px;
    scrollbar-width: none;
  }

  .zc-sidebar-scroll::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .zc-brand {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--zc-text);
    padding: 0 4px 16px;
    margin-bottom: 8px;
  }

  .zc-brand-icon {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 0;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: none;
    overflow: visible;
  }

  .zc-brand-icon img {

    height: 32px;
    object-fit: contain;
    display: block;
  }

  .zc-brand-icon span {
    color: var(--zc-active);
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
    display: none;
  }

  .zc-brand-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--zc-title);
    white-space: nowrap;
    letter-spacing: -.01em;
    transition: opacity .18s ease, transform .18s ease, max-width .18s ease;
  }

  .zc-sidebar.is-collapsed .zc-brand {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
  }

  .zc-sidebar.is-collapsed .zc-brand-name {
    opacity: 0;
    max-width: 0;
    overflow: hidden;
    transform: translateX(-4px);
  }

  .zc-nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 2px;
  }

  .zc-nav-item {
    height: 42px;
    border-radius: 10px;
    color: var(--zc-muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 11px;
    box-sizing: border-box;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    transition: background .16s ease, color .16s ease, transform .16s ease;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .zc-nav-item:hover {
    background: var(--zc-hover);
    color: var(--zc-text);
  }

  .zc-nav-item.is-active,
  .zc-nav-item[aria-current="page"] {
    background: var(--zc-active-bg);
    color: var(--zc-active);
    font-weight: 600;
  }

  .zc-nav-icon {
    width: 19px;
    height: 19px;
    min-width: 19px;
    color: currentColor;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .zc-icon {
    width: 19px;
    height: 19px;
    display: block;
    stroke: currentColor;
  }

  .zc-nav-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity .18s ease, max-width .18s ease, transform .18s ease;
  }

  .zc-sidebar.is-collapsed .zc-nav-item {
    justify-content: center;
    padding-left: 0;
    padding-right: 0;
    gap: 0;
  }

  .zc-sidebar.is-collapsed .zc-nav-label {

  .zc-sidebar.is-collapsed .zc-user-button::after,
  .zc-sidebar.is-collapsed .zc-collapse-btn::after {

  }

  .zc-sidebar.is-collapsed .zc-nav-item:hover::after,
  .zc-sidebar.is-collapsed .zc-user-button:hover::after,
  .zc-sidebar.is-collapsed .zc-collapse-btn:hover::after {

  }

  }

  .zc-user-button {

    border: 0;
    background: transparent;
    border-radius: 12px;
    padding: 7px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: var(--zc-text);

  .zc-user-button:hover,

  .zc-user-avatar {

    font-weight: 700;

  .zc-user-avatar img {

  }

  .zc-user-info {
    min-width: 0;

  .zc-dropdown-item:hover {

  .zc-dropdown-item.danger {

  .zc-dropdown-label {

  .zc-collapse-btn {

    color: var(--zc-muted);

    height: 19px;

  .zc-sidebar.is-collapsed .zc-collapse-btn {

    padding-left: 0;
    padding-right: 0;

  .zc-svg-sprite {

    width: 0;
    height: 0;

  }

  @media (max-width: 920px) {
    body.zc-sidebar-ready,
    body.zc-sidebar-collapsed {

      padding-top: var(--zc-mobile-topbar-height);

    .zc-mobile-topbar {

      font-family: var(--zc-font);
    }

    .zc-mobile-toggle {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--zc-border);
      background: var(--zc-bg);
      color: var(--zc-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .zc-mobile-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .zc-mobile-title strong {
      font-size: 13px;
      color: var(--zc-title);
      font-weight: 700;
      line-height: 1.1;
    }

    .zc-mobile-title span {
      font-size: 11px;
      color: var(--zc-muted);
      font-weight: 500;
      line-height: 1.1;
    }

    .zc-sidebar,
    .zc-sidebar.is-collapsed {
      width: min(86vw, 320px);
      transform: translateX(-110%);
      box-shadow: 18px 0 45px rgba(15,23,42,.18);
    }

    html.dark .zc-sidebar,
    html[data-theme="dark"] .zc-sidebar,
    html.dark .zc-sidebar.is-collapsed,
    html[data-theme="dark"] .zc-sidebar.is-collapsed {
      box-shadow: 18px 0 45px rgba(0,0,0,.45);
    }

    .zc-sidebar.show {
      transform: translateX(0);
    }

    .zc-sidebar.is-collapsed .zc-brand-name,
    .zc-sidebar.is-collapsed .zc-nav-label,
    .zc-sidebar.is-collapsed .zc-user-info,
    .zc-sidebar.is-collapsed .zc-user-chevron,
    .zc-sidebar.is-collapsed .zc-collapse-text {
      opacity: 1;
      max-width: unset;
      overflow: visible;
      transform: none;
    }

    .zc-sidebar.is-collapsed .zc-nav-item,
    .zc-sidebar.is-collapsed .zc-user-button,
    .zc-sidebar.is-collapsed .zc-collapse-btn {
      justify-content: flex-start;
      padding-left: 11px;
      padding-right: 11px;
      gap: 12px;
    }

    .zc-sidebar.is-collapsed .zc-nav-item::after,
    .zc-sidebar.is-collapsed .zc-user-button::after,
    .zc-sidebar.is-collapsed .zc-collapse-btn::after {
      display: none;
    }

    .zc-collapse-btn {
      display: none;
    }

    .zc-mobile-close {
      position: absolute;
      top: 14px;
      right: 14px;
      display: inline-flex;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--zc-border);
      background: var(--zc-bg);
      color: var(--zc-text);
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .zc-user-dropdown,
    .zc-sidebar.is-collapsed .zc-user-dropdown {
      left: 0;
      right: 0;
      width: auto;
    }
  }
</style>

<script>
(function () {
  "use strict";

  if (window.__ZC_CLEAR_SIDEBAR_LOADED__) return;
  window.__ZC_CLEAR_SIDEBAR_LOADED__ = true;

  var body = document.body;
  var root = document.documentElement;

  var sidebar = document.getElementById("ZcSidebar");
  var overlay = document.getElementById("ZcSidebarOverlay");
  var mobileToggle = document.getElementById("ZcSidebarToggle");
  var mobileClose = document.getElementById("ZcMobileClose");
  var mobileSubtitle = document.getElementById("ZcMobileSubtitle");

  var collapseBtn = document.getElementById("ZcCollapseBtn");
  var collapseText = document.getElementById("ZcCollapseText");

  var userButton = document.getElementById("ZcUserButton");
  var userDropdown = document.getElementById("ZcUserDropdown");
  var userNameEl = document.getElementById("ZcUserName");
  var userEmailEl = document.getElementById("ZcUserEmail");
  var userInitialsEl = document.getElementById("ZcUserInitials");
  var userAvatarImg = document.getElementById("ZcUserAvatarImg");

  var openProfileBtn = document.getElementById("ZcOpenProfileBtn");
  var myPlanBtn = document.getElementById("ZcMyPlanBtn");
  var toggleThemeBtn = document.getElementById("ZcToggleThemeBtn");
  var themeActionText = document.getElementById("ZcThemeActionText");
  var themeIcon = document.getElementById("ZcThemeIcon");
  var logoutBtn = document.getElementById("ZcLogoutBtn");
  var notifBadge = document.getElementById("ZcNotifBadge");

  var brandImg = document.getElementById("ZcBrandImg");
  var brandFallback = document.getElementById("ZcBrandFallback");

  var MOBILE_BREAKPOINT = 920;
  var COLLAPSE_KEY = "zapschat_sidebar_collapsed";

  var MENU_LABELS = {
    "dashboard": "Dashboard",
    "atendimentos": "Atendimentos",
    "clientes": "Clientes",
    "midias": "Arquivos",
    "chat-interno": "Chat Interno",
    "colaboradores": "Colaboradores",
    "departamentos": "Departamentos",
    "chatbot": "Chatbot",
    "disparos": "Disparador",
    "conectar": "Conectar WhatsApp",
    "configuracoes": "Configurações",
    "notificacoes": "Notificações",
    "perfil": "Meu Perfil",
    "meu-plano": "Meu Plano"
  };

  if (body) body.classList.add("zc-sidebar-ready");

  if (brandImg) {
    brandImg.addEventListener("error", function () {
      brandImg.style.display = "none";
      if (brandFallback) brandFallback.style.display = "block";
    });
  }

  function isMobile() {
    return window.matchMedia("(max-width: " + MOBILE_BREAKPOINT + "px)").matches;
  }

  function normalizePath(path) {
    path = String(path || "").toLowerCase().trim();
    path = path.split("?")[0].split("#")[0].replace(/\/+$/, "");
    return path || "/";
  }

  function resolveCurrentMenu() {
    var path = normalizePath(location.pathname);

    if (path === "/" || path === "/dashboard" || path === "/home" || path === "/inicio" || path === "/dashboard.html") return "dashboard";
    if (path.indexOf("/atendimentos") === 0 || path === "/atendimentos.html") return "atendimentos";
    if (path.indexOf("/clientes") === 0 || path === "/clientes.html") return "clientes";
    if (path.indexOf("/midias") === 0 || path === "/midias.html") return "midias";
    if (path.indexOf("/chat-interno") === 0 || path === "/chat-interno.html") return "chat-interno";
    if (path.indexOf("/colaboradores") === 0 || path === "/colaboradores.html") return "colaboradores";
    if (path.indexOf("/departamentos") === 0 || path === "/departamentos.html") return "departamentos";
    if (path.indexOf("/chatbot") === 0 || path === "/chatbot.html") return "chatbot";
    if (path.indexOf("/disparos") === 0 || path === "/disparos.html") return "disparos";
    if (path.indexOf("/conectar") === 0 || path === "/conectar.html") return "conectar";
    if (path.indexOf("/configuracoes") === 0 || path === "/configuracoes.html" || path === "/config.html") return "configuracoes";
    if (path.indexOf("/notificacoes") === 0 || path === "/notificacoes.html") return "notificacoes";
    if (path.indexOf("/perfil") === 0 || path === "/perfil.html") return "perfil";
    if (path.indexOf("/meu-plano") === 0 || path === "/meu-plano.html") return "meu-plano";

    return "dashboard";
  }

  function syncActiveMenu() {
    var current = resolveCurrentMenu();

    document.querySelectorAll(".zc-nav-item[data-menu]").forEach(function (item) {
      var active = item.getAttribute("data-menu") === current;
      item.classList.toggle("is-active", active);

      if (active) {
        item.setAttribute("aria-current", "page");
      } else {
        item.removeAttribute("aria-current");
      }
    });

    if (mobileSubtitle) {
      mobileSubtitle.textContent = MENU_LABELS[current] || "Menu";
    }
  }

  function getSavedCollapsed() {
    try {
      return localStorage.getItem(COLLAPSE_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function setCollapsed(collapsed) {
    if (!sidebar || !body) return;

    collapsed = !!collapsed;

    sidebar.classList.toggle("is-collapsed", collapsed);
    body.classList.toggle("zc-sidebar-collapsed", collapsed);

    if (collapseText) {
      collapseText.textContent = collapsed ? "Expandir" : "Collapse";
    }

    if (collapseBtn) {
      collapseBtn.setAttribute("aria-label", collapsed ? "Expandir menu" : "Recolher menu");
      collapseBtn.setAttribute("data-tooltip", collapsed ? "Expandir" : "Collapse");
    }

    try {
      localStorage.setItem(COLLAPSE_KEY, collapsed ? "1" : "0");
    } catch (e) {}
  }

  function openSidebar() {
    if (!isMobile()) return;

    if (sidebar) sidebar.classList.add("show");
    if (overlay) overlay.classList.add("show");
    if (mobileToggle) mobileToggle.setAttribute("aria-expanded", "true");

    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    if (sidebar) sidebar.classList.remove("show");
    if (overlay) overlay.classList.remove("show");
    if (mobileToggle) mobileToggle.setAttribute("aria-expanded", "false");

    document.documentElement.style.overflow = "";
    document.body.style.overflow = "";
  }

  function closeUserDropdown() {
    if (userDropdown) userDropdown.classList.remove("show");

    if (userButton) {
      userButton.classList.remove("active");
      userButton.setAttribute("aria-expanded", "false");
    }
  }

  function toggleUserDropdown() {
    if (!userDropdown || !userButton) return;

    var willOpen = !userDropdown.classList.contains("show");

    userDropdown.classList.toggle("show", willOpen);
    userButton.classList.toggle("active", willOpen);
    userButton.setAttribute("aria-expanded", String(willOpen));
  }

  function goToUrl(url) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.location.href = url;
      } else {
        window.location.href = url;
      }
    } catch (e) {
      window.location.href = url;
    }
  }

  function pick() {
    for (var i = 0; i < arguments.length; i++) {
      var key = arguments[i];

      try {
        var value = localStorage.getItem(key);
        if (!value) continue;

        if (
          (value.startsWith("{") && value.endsWith("}")) ||
          (value.startsWith("[") && value.endsWith("]"))
        ) {
          try {
            return JSON.parse(value);
          } catch (e) {}
        }

        return value;
      } catch (e) {}
    }

    return "";
  }

  function jwtInfo() {
    try {
      var token = pick("access_token", "token");
      if (!token || String(token).split(".").length !== 3) return {};

      var payload = String(token).split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(atob(payload)) || {};
    } catch (e) {
      return {};
    }
  }

  function getUserInfo() {
    var nome = pick("usuario_nome", "nome", "name", "displayName", "user_name");
    var email = pick("usuario_email", "email", "userEmail", "loginEmail", "user_email");
    var dept = pick("usuario_departamento", "departamento", "setor", "department", "dept");

    if (nome && typeof nome === "object") nome = nome.nome || nome.name || nome.displayName || "";
    if (email && typeof email === "object") email = email.email || "";
    if (dept && typeof dept === "object") dept = dept.departamento || dept.setor || dept.department || "";

    var obj = pick("usuario", "user", "me", "auth_user", "profile", "auth");
    if (obj && typeof obj === "object") {
      nome = nome || obj.nome || obj.name || (obj.user && (obj.user.nome || obj.user.name)) || "";
      email = email || obj.email || (obj.user && obj.user.email) || "";
      dept = dept || obj.departamento || obj.setor || obj.department || (obj.user && (obj.user.departamento || obj.user.setor)) || "";
    }

    var jwt = jwtInfo();

    nome = nome || jwt.name || jwt.given_name || jwt.nickname || "";
    email = email || jwt.email || jwt.preferred_username || jwt.sub || "";

    return {
      nome: String(nome || "").trim(),
      email: String(email || "").trim(),
      dept: String(dept || "").trim()
    };
  }

  function getInitials(value) {
    var safe = String(value || "").trim();

    if (!safe) return "U";

    if (safe.indexOf("@") >= 0) {
      return safe.charAt(0).toUpperCase();
    }

    var parts = safe.split(/\s+/).filter(Boolean);

    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();

    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function normalizeUrl(value) {
    var s = String(value || "").trim();

    if (!s) return "";
    if (s.indexOf("data:") === 0) return s;
    if (/^https?:\/\//i.test(s)) return s;
    if (s.charAt(0) === "/") return s;

    return "/" + s.replace(/^\/+/, "");
  }

  function base64ToDataUrl(base64, mime) {
    var raw = String(base64 || "").trim();

    if (!raw) return "";
    if (raw.indexOf("data:") === 0) return raw;

    return "data:" + (mime || "image/png") + ";base64," + raw;
  }

  function getAvatar() {
    try {
      var avatar =
        localStorage.getItem("usuario_avatar") ||
        localStorage.getItem("avatar_url") ||
        "";

      if (!avatar) {
        var jwt = jwtInfo();
        avatar = jwt.picture || "";
      }

      return avatar || "";
    } catch (e) {
      return "";
    }
  }

  function renderUser() {
    var user = getUserInfo();
    var avatar = getAvatar();

    if (userNameEl) userNameEl.textContent = user.nome || "Usuário";
    if (userEmailEl) userEmailEl.textContent = user.email || user.dept || "Sem e-mail";

    if (userInitialsEl) {
      userInitialsEl.textContent = getInitials(user.nome || user.email || "Usuário");
      userInitialsEl.style.display = "";
    }

    if (!userAvatarImg) return;

    if (avatar) {
      var src = avatar;

      if (String(src).indexOf("data:") !== 0) {
        try {
          var version = localStorage.getItem("usuario_avatar_v") || "";
          src = src + (String(src).indexOf("?") >= 0 ? "&" : "?") + "v=" + encodeURIComponent(version || Date.now());
        } catch (e) {}
      }

      userAvatarImg.onerror = function () {
        userAvatarImg.removeAttribute("src");
        userAvatarImg.style.display = "none";

        if (userInitialsEl) userInitialsEl.style.display = "";
      };

      userAvatarImg.src = src;
      userAvatarImg.style.display = "block";

      if (userInitialsEl) userInitialsEl.style.display = "none";
    } else {
      userAvatarImg.removeAttribute("src");
      userAvatarImg.style.display = "none";

      if (userInitialsEl) userInitialsEl.style.display = "";
    }
  }

  async function hydrateUserFromApi() {
    try {
      var res = await fetch("/api/perfil", {
        method: "GET",
        credentials: "include",
        headers: {
          "Accept": "application/json"
        }
      });

      if (!res.ok) return;

      var data = await res.json();
      if (!data || typeof data !== "object") return;

      var nome = data.nome || data.name || data.usuario_nome || "";
      var email = data.email || data.usuario_email || "";
      var dept = data.departamento || data.setor || data.department || data.dept || data.cargo || "";

      var avatar =
        data.avatar_url ||
        data.foto_url ||
        data.avatar ||
        data.foto ||
        data.picture ||
        "";

      var avatarBase64 =
        data.avatar_base64 ||
        data.foto_base64 ||
        data.avatar_data ||
        "";

      var avatarMime =
        data.avatar_mime ||
        data.foto_mime ||
        "image/png";

      if (!avatar && avatarBase64) {
        avatar = base64ToDataUrl(avatarBase64, avatarMime);
      }

      if (!avatar) {
        avatar = "/api/perfil/avatar";
      }

      avatar = normalizeUrl(avatar);

      try {
        if (nome) localStorage.setItem("usuario_nome", String(nome));
        if (email) localStorage.setItem("usuario_email", String(email));
        if (dept) localStorage.setItem("usuario_departamento", String(dept));

        if (avatar) {
          localStorage.setItem("usuario_avatar", avatar);
          localStorage.setItem("avatar_url", avatar);
          localStorage.setItem("usuario_avatar_v", String(Date.now()));
        }
      } catch (e) {}
    } catch (e) {}
  }

  function isDarkTheme() {
    return root.classList.contains("dark") || root.getAttribute("data-theme") === "dark";
  }

  function setTheme(mode) {
    var dark = String(mode) === "dark";
    var theme = dark ? "dark" : "light";

    try {
      if (window.AppTheme && typeof window.AppTheme.set === "function") {
        window.AppTheme.set(theme);
      }
    } catch (e) {}

    root.classList.toggle("dark", dark);
    root.setAttribute("data-theme", theme);

    try {
      localStorage.setItem("zapschat_theme", theme);
      localStorage.setItem("theme", theme);
    } catch (e) {}

    syncThemeLabel();

    try {
      window.dispatchEvent(new CustomEvent("zapschat-theme-changed", {
        detail: {
          theme: theme
        }
      }));
    } catch (e) {}
  }

  function toggleTheme() {
    setTheme(isDarkTheme() ? "light" : "dark");
  }

  function syncThemeLabel() {
    var dark = isDarkTheme();

    if (themeActionText) {
      themeActionText.textContent = dark ? "Usar tema claro" : "Usar tema escuro";
    }

    if (themeIcon) {
      themeIcon.innerHTML = dark ? '<use href="#zc-i-sun"></use>' : '<use href="#zc-i-moon"></use>';
    }
  }

  function getNotifUnread() {
    try {
      if (window.PlanNotifications && typeof window.PlanNotifications.getUnreadCount === "function") {
        return Number(window.PlanNotifications.getUnreadCount() || 0);
      }
    } catch (e) {}

    try {
      var empresaId = (document.cookie.match(/(?:^|;\s*)(?:empresa_id|EMPRESA_ID)=([^;]+)/) || [])[1] || "0";
      var raw = localStorage.getItem("plan_notif:" + decodeURIComponent(empresaId) + ":unread");
      return Math.max(0, Number(JSON.parse(raw || "0") || 0));
    } catch (e) {
      return 0;
    }
  }

  function syncNotifBadge() {
    if (!notifBadge) return;

    var unread = getNotifUnread();

    if (unread > 0) {
      notifBadge.style.display = "inline-flex";
      notifBadge.textContent = unread > 99 ? "99+" : String(unread);
    } else {
      notifBadge.style.display = "none";
      notifBadge.textContent = "0";
    }
  }

  async function doLogout() {
    try {
      await fetch("/api/auth/logout", {
        method: "POST",
        credentials: "include"
      });
    } catch (e) {}

    try {
      var past = "Thu, 01 Jan 1970 00:00:00 GMT";
      var names = (document.cookie || "")
        .split(/;\s*/)
        .filter(Boolean)
        .map(function (cookie) {
          return cookie.split("=")[0];
        });

      names.forEach(function (name) {
        document.cookie = name + "=; Expires=" + past + "; Path=/";
      });
    } catch (e) {}

    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}

    if ("caches" in window) {
      try {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (key) {
          return caches.delete(key);
        }));
      } catch (e) {}
    }

    window.location.replace("/");
  }

  if (mobileToggle) mobileToggle.addEventListener("click", openSidebar);
  if (mobileClose) mobileClose.addEventListener("click", closeSidebar);
  if (overlay) overlay.addEventListener("click", closeSidebar);

  if (collapseBtn) {
    collapseBtn.addEventListener("click", function () {
      setCollapsed(!sidebar.classList.contains("is-collapsed"));
      closeUserDropdown();
    });
  }

  document.querySelectorAll(".zc-nav-item[href]").forEach(function (link) {
    link.addEventListener("click", function () {
      closeUserDropdown();

      if (isMobile()) closeSidebar();
    });
  });

  if (userButton) {
    userButton.addEventListener("click", function (event) {
      event.stopPropagation();
      toggleUserDropdown();
    });

    userButton.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        toggleUserDropdown();
      }
    });
  }

  if (openProfileBtn) {
    openProfileBtn.addEventListener("click", function () {
      closeUserDropdown();
      goToUrl("/perfil.html");
    });
  }

  if (myPlanBtn) {
    myPlanBtn.addEventListener("click", function () {
      closeUserDropdown();
      goToUrl("/meu-plano");
    });
  }

  if (toggleThemeBtn) {
    toggleThemeBtn.addEventListener("click", function () {
      toggleTheme();
      closeUserDropdown();
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener("click", function () {
      closeUserDropdown();
      doLogout();
    });
  }

  document.addEventListener("click", function (event) {
    if (!userDropdown || !userButton) return;

    if (!userDropdown.contains(event.target) && !userButton.contains(event.target)) {
      closeUserDropdown();
    }
  });

  document.addEventListener("plan-notifications:updated", syncNotifBadge);

  window.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeUserDropdown();
      closeSidebar();
    }
  });

  window.addEventListener("resize", function () {
    if (!isMobile()) closeSidebar();
    syncActiveMenu();
  });

  window.addEventListener("storage", function (event) {
    var key = String(event.key || "");

    if ([
      "usuario_nome",
      "nome",
      "name",
      "displayName",
      "usuario_departamento",
      "departamento",
      "setor",
      "department",
      "dept",
      "usuario_email",
      "email",
      "userEmail",
      "loginEmail",
      "usuario_avatar",
      "avatar_url",
      "usuario_avatar_v",
      "usuario",
      "user",
      "me",
      "auth_user",
      "profile",
      "auth",
      "access_token",
      "token",
      "theme",
      "zapschat_theme"
    ].indexOf(key) >= 0) {
      renderUser();
      syncThemeLabel();
      syncActiveMenu();
    }

    if (key.indexOf("plan_notif:") === 0) {
      syncNotifBadge();
    }
  });

  setCollapsed(getSavedCollapsed());
  syncActiveMenu();
  syncThemeLabel();
  syncNotifBadge();
  renderUser();

  hydrateUserFromApi().then(function () {
    renderUser();
  });

  setTimeout(syncNotifBadge, 400);
  setTimeout(syncNotifBadge, 1200);
})();
</script>
