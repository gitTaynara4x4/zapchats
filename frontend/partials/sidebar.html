<link rel="preload" as="image" href="/img/logo-s-fundo.png">
<link rel="preload" as="image" href="/img/logo-white.png">
<link rel="preload" as="image" href="/img/fav-icon.png">

<style>
  :root{
    --topbar-h:44px;
    --sbw:220px;
    --sbw-c:64px;

    --icon:#9ca3af;
    --icon-active-light:#000000;
    --icon-active-dark:#ffffff;

    --card:#161617;
    --border:#27272a;
    --fg:#e5e7eb;
    --muted:#9ca3af;
    --hover:rgba(255,255,255,.04);
    --ring:#4f83ff;
    --danger:#ef4444;
    --ok:#16a34a;
    --overlay:rgba(0,0,0,.5);

    --leftbar-bg:#1b1c1d;
    --leftbar-border:#36393f;
    --leftbar-divider-w:2px;
    --text-2:#9ca3af;
    --accent:#25d366;

    --mobile-sheet-w:min(86vw,300px);
    --mobile-bottom-h:64px;
  }

  html:not(.dark){
    --card:#fff;
    --border:#e5e7eb;
    --fg:#1f2937;
    --muted:#6b7280;
    --hover:rgba(0,0,0,.06);
    --overlay:rgba(0,0,0,.45);
    --leftbar-bg:#f8fafc;
    --leftbar-border:#e5e7eb;
    --text-2:#6b7280;
    --accent:#16a34a;
  }

  html,body{margin:0;padding:0;border:0}
  img{border:0;outline:0;box-shadow:none}

  html{
    background:
      linear-gradient(90deg,#22c55e 0%,#16a34a 50%,#10b981 100%) 0 0 / 100% 6px no-repeat,
      var(--card);
    background-attachment:fixed;
  }
  html:not(.dark){
    background:
      linear-gradient(90deg,#22c55e 0%,#16a34a 50%,#10b981 100%) 0 0 / 100% 6px no-repeat,
      #fff;
  }

  body{padding-top:var(--topbar-h)}
  @media (min-width:1024px){ body{padding-left:var(--sbw-c)} }

  .topline-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
    display:flex; align-items:center; justify-content:flex-end; gap:.75rem;
    padding:6px 14px 0; background:transparent; z-index:80; border:0; box-shadow:none;
  }
  .theme-toggle,.theme-toggle *{position:relative;z-index:0}

  .mobile-page-logo{
    display:none;
    align-items:center;
    justify-content:center;
    width:100%;
    pointer-events:none;
  }
  .mobile-page-logo img{
    max-height:28px;
    width:auto;
    display:block;
  }
  html.dark .mobile-page-logo .logo-light{display:none}
  html:not(.dark) .mobile-page-logo .logo-dark{display:none}

  .app-sidebar{
    position:fixed; left:0; top:0; bottom:0;
    width:var(--sbw-c); min-width:var(--sbw-c); max-width:var(--sbw-c); height:100vh;
    background:var(--leftbar-bg)!important; z-index:70; border-right:none!important;
    display:flex; flex-direction:column; align-items:center;
    padding:12px 6px; padding-top:calc(var(--topbar-h) + 12px);
    overflow:hidden;
    transition:width .22s ease,padding .22s ease,min-width .22s ease,max-width .22s ease;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
    letter-spacing:-.01em;
  }
  .app-sidebar:hover{
    width:var(--sbw); min-width:var(--sbw); max-width:var(--sbw);
    align-items:stretch; padding-left:10px; padding-right:10px;
  }
  .app-sidebar::after{
    content:""; position:absolute; top:0; right:0; bottom:0;
    width:var(--leftbar-divider-w); background:var(--leftbar-border); pointer-events:none;
  }

  .app-sidebar .logo{
    height:56px; margin:0 0 10px; display:grid; place-items:center;
    position:relative; z-index:1; width:100%;
  }
  .app-sidebar:hover .logo{justify-items:start;padding:0 10px 0 6px}

  .logo .logo-fav,.logo .logo-full{
    grid-area:1/1; max-height:50px; will-change:opacity,transform;
    backface-visibility:hidden; transform:translateZ(0); contain:paint;
  }
  .logo .logo-fav{opacity:1;transition:opacity .16s ease-in}
  .logo .logo-full{opacity:0;pointer-events:none}

  @keyframes logoFadeIn{
    from{opacity:0;transform:translateY(2px) scale(.985);filter:blur(.6px)}
    to{opacity:1;transform:none;filter:none}
  }
  .app-sidebar:hover .logo .logo-fav{opacity:0;pointer-events:none;transition:opacity .12s ease-out}
  .app-sidebar:hover .logo .logo-full{
    opacity:1;pointer-events:auto;animation:logoFadeIn .42s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:.06s;
  }
  html.dark .app-sidebar:hover .logo .logo-full.logo-dark{opacity:1}
  html.dark .app-sidebar:hover .logo .logo-full.logo-light{opacity:0}
  html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-light{opacity:1}
  html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-dark{opacity:0}

  .app-sidebar nav{
    display:flex; flex-direction:column; gap:10px; width:100%; margin-top:6px;
    flex:1; overflow-y:auto; position:relative; z-index:1;
  }
  .app-sidebar nav a{
    width:100%; min-height:44px; display:flex; align-items:center; justify-content:center; gap:12px;
    border:none; background:none!important; border-radius:12px; transition:background .16s,color .16s;
    color:var(--text-2); cursor:pointer; position:relative; text-decoration:none; outline:none;
    padding:0 10px; box-shadow:none!important;
  }
  .app-sidebar:hover nav a{justify-content:flex-start}
  .app-sidebar nav a:hover,.app-sidebar nav a:focus{
    background:color-mix(in oklab,var(--leftbar-bg) 55%,transparent)!important;
    color:var(--accent);
  }
  .app-sidebar nav a.active,.app-sidebar nav a[aria-current="page"]{
    background:color-mix(in oklab,var(--leftbar-bg) 55%,transparent)!important;
    color:var(--fg);
  }

  .nav-icon{width:22px;height:22px;min-width:22px;display:grid;place-items:center;color:currentColor}
  .nav-icon-svg{width:22px;height:22px;display:block}

  .label{
    opacity:0; max-width:0; overflow:hidden; white-space:nowrap; transform:translateX(-6px);
    transition:opacity .18s ease,max-width .22s ease,transform .22s ease;
    pointer-events:none; font-size:.95em; color:inherit;
  }
  .app-sidebar:hover .label{opacity:1;max-width:140px;transform:translateX(0)}

  html.dark .app-sidebar nav a.active .nav-icon,
  html.dark .app-sidebar nav a[aria-current="page"] .nav-icon{color:var(--icon-active-dark)}
  html:not(.dark) .app-sidebar nav a.active .nav-icon,
  html:not(.dark) .app-sidebar nav a[aria-current="page"] .nav-icon{color:var(--icon-active-light)}

  .user-chip{
    display:flex; align-items:center; gap:.5rem; margin-right:6px;
    padding:.3rem .6rem; border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--muted); font-weight:700; font-size:12px;
    cursor:pointer; user-select:none;
  }
  .user-chip:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  .user-chip .user-email{
    max-width:28ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg);
  }
  .user-chip .avatar{
    width:22px; height:22px; border-radius:999px; object-fit:cover; display:none; box-shadow:none;
  }
  html:not(.dark) .user-chip{background:#fff}

  .theme-toggle{
    --w:78px; --h:34px; --p:3px; --k:28px; --dx:calc(var(--w) - var(--k) - var(--p)*2);
    position:relative; width:var(--w); height:var(--h); padding:var(--p);
    border-radius:999px; cursor:pointer; outline:none; border:1px solid;
    display:inline-block; isolation:isolate; background:#eceff3; border-color:#d5d9e0;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 2px rgba(0,0,0,.05);
    transition:background .3s ease,border-color .3s ease,box-shadow .3s ease;
    line-height:0;
  }
  html.dark .theme-toggle{
    background:#2f323a; border-color:#3a3e46;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.03);
  }
  .theme-toggle .slot{
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:grid; place-items:center; pointer-events:none; opacity:.75;
  }
  .theme-toggle .slot.left{left:8px}
  .theme-toggle .slot.right{right:8px}
  .theme-toggle .slot svg{width:18px;height:18px;display:block}
  .theme-toggle .slot svg *{stroke:#9ca3af}
  html.dark .theme-toggle .slot svg *{stroke:#8a93a1}

  .theme-toggle .thumb{
    position:absolute; left:var(--p); top:50%; width:var(--k); height:var(--k); border-radius:999px;
    transform:translate(0,-50%); transition:transform .38s cubic-bezier(.28,1.2,.43,1),box-shadow .2s ease,background .3s ease;
    display:grid; place-items:center; overflow:hidden;
    background:
      radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
      linear-gradient(180deg,#f8c266,#f59e0b);
    box-shadow:0 4px 8px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .theme-toggle .thumb svg{width:22px;height:22px;display:block;position:relative;z-index:1;pointer-events:none}
  .theme-toggle .thumb .thumb-sun{display:block}
  .theme-toggle .thumb .thumb-moon{display:none}
  html.dark .theme-toggle .thumb{
    transform:translate(var(--dx),-50%)!important;
    background:
      radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
      linear-gradient(180deg,#6ba6ff,#2563eb)!important;
    box-shadow:0 6px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  html.dark .theme-toggle .thumb .thumb-sun{display:none!important}
  html.dark .theme-toggle .thumb .thumb-moon{display:block!important}
  .theme-toggle:active .thumb{transform:translate(0,-50%) scale(.96)}
  html.dark .theme-toggle:active .thumb{transform:translate(calc(var(--dx)),-50%) scale(.96)}
  .theme-toggle:focus-visible{box-shadow:0 0 0 3px rgba(99,102,241,.35)}
  .theme-toggle.t-anim::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
    animation:sweep .55s ease both;
  }
  @keyframes sweep{from{opacity:0}to{opacity:1}}

  .mobile-bottom-nav{
    display:none;
    position:fixed; left:0; right:0; bottom:0; height:var(--mobile-bottom-h);
    background:color-mix(in oklab,var(--leftbar-bg) 92%,black 8%);
    border-top:1px solid var(--leftbar-border);
    z-index:92;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    grid-template-columns:repeat(4,1fr);
    padding-bottom:env(safe-area-inset-bottom,0);
  }
  .mobile-bottom-nav a,
  .mobile-bottom-nav button{
    min-width:0; border:0; background:none; color:var(--text-2); text-decoration:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    font:inherit; padding:6px 4px;
  }
  .mobile-bottom-nav .m-icon{width:20px;height:20px;display:grid;place-items:center}
  .mobile-bottom-nav .m-icon svg{width:20px;height:20px;display:block}
  .mobile-bottom-nav .m-label{
    font-size:11px; line-height:1; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .mobile-bottom-nav a.active,
  .mobile-bottom-nav a[aria-current="page"],
  .mobile-bottom-nav button.is-active{
    color:var(--accent);
  }

  .mobile-more-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.48);
    opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:93;
  }
  .mobile-more-backdrop.is-open{opacity:1;pointer-events:auto}

  .mobile-more-sheet{
    position:fixed; top:0; right:0; bottom:0; width:var(--mobile-sheet-w);
    background:var(--leftbar-bg); border-left:1px solid var(--leftbar-border);
    transform:translateX(100%); transition:transform .24s ease; z-index:94;
    display:flex; flex-direction:column; padding:12px; padding-top:calc(var(--topbar-h) + 12px);
    box-shadow:0 20px 50px rgba(0,0,0,.28);
  }
  .mobile-more-sheet.is-open{transform:translateX(0)}
  .mobile-more-sheet .logo{
    height:56px; display:flex; align-items:center; padding:0 8px; margin:0 0 10px;
  }
  .mobile-more-sheet .logo .logo-fav{display:none}
  html.dark .mobile-more-sheet .logo .logo-light{display:none}
  html:not(.dark) .mobile-more-sheet .logo .logo-dark{display:none}

  .mobile-more-head{
    display:grid;
    gap:10px;
    margin-bottom:12px;
  }

  .mobile-profile-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:14px;
    background:color-mix(in oklab,var(--card) 88%,transparent);
    cursor:pointer;
  }
  .mobile-profile-card:focus-visible{
    outline:2px solid var(--ring);
    outline-offset:2px;
  }
  .mobile-profile-avatar{
    width:38px;height:38px;border-radius:999px;object-fit:cover;display:none;flex:0 0 38px;
  }
  .mobile-profile-icon{
    width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
    background:var(--hover); color:var(--muted); flex:0 0 38px;
  }
  .mobile-profile-meta{
    min-width:0; display:grid; gap:2px;
  }
  .mobile-profile-name{
    color:var(--fg); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mobile-profile-sub{
    color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .mobile-theme-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:14px;
    background:color-mix(in oklab,var(--card) 88%,transparent);
  }
  .mobile-theme-left{
    display:flex; align-items:center; gap:10px; min-width:0;
  }
  .mobile-theme-icon{
    width:38px;height:38px;border-radius:999px;display:grid;place-items:center;
    background:var(--hover); color:var(--muted); flex:0 0 38px;
  }
  .mobile-theme-text{
    display:grid; gap:2px;
  }
  .mobile-theme-title{
    color:var(--fg); font-weight:700;
  }
  .mobile-theme-sub{
    color:var(--muted); font-size:12px;
  }

  .mobile-more-nav{
    display:flex; flex-direction:column; gap:10px; overflow:auto;
  }
  .mobile-more-nav a{
    min-height:44px; display:flex; align-items:center; gap:12px; padding:0 12px;
    border-radius:12px; text-decoration:none; color:var(--text-2); background:none;
  }
  .mobile-more-nav a:hover,
  .mobile-more-nav a:focus{
    background:color-mix(in oklab,var(--leftbar-bg) 55%,transparent);
    color:var(--accent);
  }
  .mobile-more-nav a.active,
  .mobile-more-nav a[aria-current="page"]{
    background:color-mix(in oklab,var(--leftbar-bg) 55%,transparent);
    color:var(--fg);
  }
  .mobile-more-nav .label{
    opacity:1; max-width:none; overflow:visible; transform:none; pointer-events:auto;
  }

  .pf-modal{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--overlay); z-index:10000;
  }
  .pf-modal.is-open{display:flex}
  .pf-dialog{
    width:min(680px,92vw); background:var(--card); border:1px solid var(--border);
    border-radius:1rem; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden;
  }
  .pf-hd{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .pf-hd h3{margin:0;font-size:1rem}
  .pf-close{background:transparent;border:none;font-size:22px;cursor:pointer;color:var(--muted)}
  .pf-body{padding:16px;display:grid;grid-template-columns:160px 1fr;gap:16px}
  .pf-avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:.5rem}
  .pf-avatar{width:120px;height:120px;border-radius:999px;object-fit:cover;background:var(--hover);box-shadow:none}
  .pf-upload{
    display:inline-block;font-size:.9rem;padding:.45rem .7rem;border-radius:.6rem;
    border:1px solid var(--border);background:var(--card);cursor:pointer;
  }
  .pf-upload input{display:none}
  .pf-grid{display:grid;gap:.75rem}
  .pf-field label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:.25rem}
  .pf-field input{
    width:100%;padding:.6rem .7rem;border-radius:.6rem;border:1px solid var(--border);
    background:var(--card);color:var(--fg);outline:none;
  }
  .pf-field input:focus{box-shadow:0 0 0 3px var(--ring);border-color:transparent}
  .pf-actions{display:flex;gap:.5rem;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
  .pf-btn{
    padding:.55rem .9rem;border-radius:.6rem;border:1px solid var(--border);
    background:var(--card);color:var(--fg);cursor:pointer;font-weight:600;
  }
  .pf-btn.primary{background:#10b981;border-color:#10b981;color:#fff}
  .pf-btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
  .pf-msg{padding:8px 16px;font-size:.9rem;color:var(--muted)}

  .app-sidebar nav a:focus{outline:none}

  @media (prefers-reduced-motion:reduce){
    .logo .logo-fav,.logo .logo-full{
      transition:none!important; animation:none!important; filter:none!important; transform:none!important;
    }
  }

  @media (max-width:920px){
    body{padding-left:0!important;padding-bottom:calc(var(--mobile-bottom-h) + env(safe-area-inset-bottom,0))}
    .app-sidebar{display:none!important}
    .mobile-bottom-nav{display:grid}
    .topline-bar{
      justify-content:center;
      padding-left:12px;
      padding-right:12px;
    }
    .topline-bar .user-chip,
    .topline-bar .theme-toggle{
      display:none!important;
    }
    .mobile-page-logo{display:flex}
  }

  @media (max-width:720px){
    .theme-toggle{--w:70px;--h:32px;--k:26px}
    .pf-body{grid-template-columns:1fr}
  }
</style>

<div class="topline-bar">
  <div class="mobile-page-logo" aria-hidden="true">
    <img class="logo-light" src="/img/logo-s-fundo.png" alt="">
    <img class="logo-dark" src="/img/logo-white.png" alt="">
  </div>

  <div class="user-chip" id="userChip" title="" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="pfModal">
    <img id="userAvatar" class="avatar" alt="Foto do usuário" referrerpolicy="no-referrer">
    <i class="fa-regular fa-circle-user" id="userIcon"></i>
    <span class="user-email" id="userEmailLabel">Usuário</span>
  </div>

  <button id="themeSwitch" class="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
    <span class="slot left" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.5" fill="none"/>
        <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
      </svg>
    </span>
    <span class="slot right" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="none"/>
      </svg>
    </span>
    <span class="thumb" aria-hidden="true">
      <svg class="thumb-sun" viewBox="0 0 24 24">
        <defs>
          <radialGradient id="sunGrad-desktop" cx="30%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#ffd27a"/>
            <stop offset="60%" stop-color="#f8c266"/>
            <stop offset="100%" stop-color="#f59e0b"/>
          </radialGradient>
        </defs>
        <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad-desktop)"/>
      </svg>
      <svg class="thumb-moon" viewBox="0 0 24 24">
        <defs>
          <radialGradient id="moonGrad-desktop" cx="30%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#9fc3ff"/>
            <stop offset="60%" stop-color="#6ba6ff"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </radialGradient>
        </defs>
        <circle cx="12" cy="12" r="11" fill="url(#moonGrad-desktop)"/>
      </svg>
    </span>
  </button>
</div>

<aside class="app-sidebar" id="appSidebar" aria-label="Menu lateral">
  <div class="logo">
    <img class="logo-fav" src="/img/fav-icon.png" alt="favicon" width="32" height="32">
    <img class="logo-full logo-light" src="/img/logo-s-fundo.png" alt="Logo (claro)">
    <img class="logo-full logo-dark" src="/img/logo-white.png" alt="Logo (escuro)">
  </div>

<script>
(function(){
  var html=document.documentElement;

  function currentTheme(){
    return html.classList.contains('dark') ? 'dark' : 'light';
  }

  function applyThemeUI(){
    var isDark=currentTheme()==='dark';

    var desktopBtn=document.getElementById('themeSwitch');
    var mobileBtn=document.getElementById('mobileThemeSwitch');
    var mobileLabel=document.getElementById('mobileThemeLabel');
    var mobileIcon=document.getElementById('mobileThemeIcon');

    if(desktopBtn) desktopBtn.setAttribute('aria-pressed', String(isDark));
    if(mobileBtn) mobileBtn.setAttribute('aria-pressed', String(isDark));
    if(mobileLabel) mobileLabel.textContent=isDark ? 'Escuro' : 'Claro';
    if(mobileIcon){
      mobileIcon.className=isDark ? 'fa-regular fa-moon' : 'fa-regular fa-sun';
    }
  }

  function setTheme(mode){
    try{
      if(window.AppTheme && typeof AppTheme.set==='function'){
        AppTheme.set(mode);
        html.classList.toggle('dark', mode==='dark');
      }else{
        html.classList.toggle('dark', mode==='dark');
        localStorage.setItem('theme', mode);
      }
    }catch{}
    applyThemeUI();
  }

  function toggleTheme(btn){
    var willDark=!html.classList.contains('dark');
    setTheme(willDark?'dark':'light');
    if(btn){
      btn.classList.remove('t-anim');
      void btn.offsetWidth;
      btn.classList.add('t-anim');
      setTimeout(function(){ btn.classList.remove('t-anim'); }, 580);
    }
  }

  try{
    if(window.AppTheme && typeof AppTheme.current==='function'){
      html.classList.toggle('dark', AppTheme.current()==='dark');
    }else{
      var saved=localStorage.getItem('theme');
      if(saved) html.classList.toggle('dark', saved==='dark');
    }
  }catch{}

  var btn=document.getElementById('themeSwitch');
  if(btn && !btn.dataset.bound){
    btn.dataset.bound='1';
    btn.addEventListener('click', function(){ toggleTheme(btn); });
  }

  var mobileThemeBtn=document.getElementById('mobileThemeSwitch');
  if(mobileThemeBtn && !mobileThemeBtn.dataset.bound){
    mobileThemeBtn.dataset.bound='1';
    mobileThemeBtn.addEventListener('click', function(){ toggleTheme(mobileThemeBtn); });
  }

  window.addEventListener('storage', function(e){
    if(e.key==='theme' && e.newValue){
      html.classList.toggle('dark', e.newValue==='dark');
      applyThemeUI();
    }
  });

  applyThemeUI();

  function activateCurrentLinks(root){
    if(!root) return;
    var nowFull=location.pathname.replace(/\/+$/,'');
    var nowFile=nowFull.split('/').pop();
    root.querySelectorAll('a[href]').forEach(function(a){
      try{
        var href=a.getAttribute('href');
        if(!href || href==='#') return;
        var pFull=new URL(href, location.origin).pathname.replace(/\/+$/,'');
        var pFile=pFull.split('/').pop();
        if(pFull===nowFull || pFile===nowFile){
          a.classList.add('active');
          a.setAttribute('aria-current','page');
        }
      }catch{}
    });
  }
  activateCurrentLinks(document.querySelector('.app-sidebar nav'));
  activateCurrentLinks(document.querySelector('.mobile-more-nav'));
  activateCurrentLinks(document.querySelector('.mobile-bottom-nav'));

  function pick(){
    for(var i=0;i<arguments.length;i++){
      var k=arguments[i];
      try{
        var v=localStorage.getItem(k);
        if(!v) continue;
        if((v.startsWith('{')&&v.endsWith('}'))||(v.startsWith('[')&&v.endsWith(']'))){
          try{ return JSON.parse(v); }catch{}
        }
        return v;
      }catch{}
    }
    return '';
  }

  function jwtInfo(){
    try{
      var tok=pick('access_token','token');
      if(!tok||!tok.includes('.')) return {};
      return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))) || {};
    }catch{
      return {};
    }
  }

  function info(){
    var nome=pick('nome','name','displayName','usuario_nome','user_name');
    if(nome && typeof nome==='object') nome=nome.nome||nome.name||nome.displayName||'';
    var dept=pick('departamento','setor','department','dept','usuario_departamento','user_department');
    if(dept && typeof dept==='object') dept=dept.departamento||dept.setor||dept.department||dept.dept||'';
    var email=pick('email','userEmail','loginEmail','usuario_email','user_email');
    var obj=pick('usuario','user','me','auth_user','profile','auth');
    if(obj && typeof obj==='object'){
      email=email||obj.email||(obj.user&&obj.user.email)||'';
      nome =nome ||obj.nome ||obj.name ||(obj.user&&(obj.user.nome||obj.user.name))||'';
      dept =dept ||obj.departamento||obj.setor||(obj.user&&(obj.user.departamento||obj.user.setor))||'';
    }
    var jwt=jwtInfo();
    email=email||jwt.email||jwt.preferred_username||jwt.sub||'';
    nome =nome ||jwt.name ||jwt.given_name||jwt.nickname||'';
    return {nome:(nome||'').trim(), dept:(dept||'').trim(), email:(email||'').trim()};
  }

  function getAvatar(){
    var a=localStorage.getItem('usuario_avatar')||localStorage.getItem('avatar_url')||'';
    if(!a){
      var jwt=jwtInfo();
      a=(jwt&&jwt.picture)||'';
    }
    return a||'';
  }

  function renderUser(){
    var chip=document.getElementById('userChip');
    var label=document.getElementById('userEmailLabel');
    var img=document.getElementById('userAvatar');
    var icn=document.getElementById('userIcon');

    var mobName=document.getElementById('mobileProfileName');
    var mobSub=document.getElementById('mobileProfileSub');
    var mobImg=document.getElementById('mobileProfileAvatar');
    var mobIcn=document.getElementById('mobileProfileIcon');

    var u=info();
    var txt=[u.nome,u.dept].filter(Boolean).join(' · ') || u.email || 'Usuário';

    if(chip && label){
      label.textContent=txt;
      chip.title=u.email || u.nome || '';
    }

    if(mobName){
      mobName.textContent=u.nome || 'Usuário';
    }
    if(mobSub){
      mobSub.textContent=u.email || u.dept || 'Abrir perfil';
    }

    var av=getAvatar();

    function hideDesktopAvatar(){
      if(img){ img.removeAttribute('src'); img.style.display='none'; }
      if(icn) icn.style.display='';
    }
    function hideMobileAvatar(){
      if(mobImg){ mobImg.removeAttribute('src'); mobImg.style.display='none'; }
      if(mobIcn) mobIcn.style.display='';
    }

    if(av){
      var v=(function(){ try{ return localStorage.getItem('usuario_avatar_v')||''; }catch{ return ''; }})();
      var src=av;
      if(v) src=av + (String(av).includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v);

      if(img){
        img.onerror=function(){
          try{
            localStorage.removeItem('usuario_avatar');
            localStorage.removeItem('avatar_url');
          }catch{}
          hideDesktopAvatar();
          hideMobileAvatar();
        };
        img.src=src;
        img.style.display='block';
      }
      if(icn) icn.style.display='none';

      if(mobImg){
        mobImg.onerror=function(){ hideMobileAvatar(); };
        mobImg.src=src;
        mobImg.style.display='block';
      }
      if(mobIcn) mobIcn.style.display='none';
    }else{
      hideDesktopAvatar();
      hideMobileAvatar();
    }
  }

  renderUser();
  window.addEventListener('storage', function(ev){
    if([
      'usuario_nome','nome','name','displayName',
      'usuario_departamento','departamento','setor','department','dept',
      'usuario_email','email','userEmail','loginEmail',
      'usuario_avatar','avatar_url',
      'usuario','user','me','auth_user','profile','auth',
      'access_token','token'
    ].includes(ev.key)){
      renderUser();
    }
  });

  (function(){
    var chip=document.getElementById('userChip');
    var mobileCard=document.getElementById('mobileProfileCard');
    var modal=document.getElementById('pfModal');
    var closeBtn=document.getElementById('pfClose');
    var cancelBtn=document.getElementById('pfCancel');
    var saveBtn=document.getElementById('pfSave');
    var fileInput=document.getElementById('pfFile');
    var preview=document.getElementById('pfPreview');
    var nomeInput=document.getElementById('pfNome');
    var emailInput=document.getElementById('pfEmail');
    var deptInput=document.getElementById('pfDept');
    var msg=document.getElementById('pfMsg');

    if(!modal) return;

    function onEsc(e){ if(e.key==='Escape' && modal.classList.contains('is-open')) closeModal(); }
    function outsideClose(e){ if(e.target===modal) closeModal(); }

    function openModal(){
      var nome=localStorage.getItem('nome')||'';
      var email=localStorage.getItem('email')||'';
      var dept=localStorage.getItem('departamento')||localStorage.getItem('usuario_departamento')||'';
      nomeInput.value=nome;
      emailInput.value=email;
      deptInput.value=dept;
      var av=(localStorage.getItem('usuario_avatar')||localStorage.getItem('avatar_url')||'');
      var v=localStorage.getItem('usuario_avatar_v')||'';
      if(av){
        var bust=av + (String(av).includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v || Date.now());
        preview.src=bust;
      }else{
        preview.removeAttribute('src');
      }
      msg.textContent='';
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden','false');
      nomeInput.focus();

      document.addEventListener('keydown', onEsc);
      modal.addEventListener('click', outsideClose);
    }

    function closeModal(){
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden','true');
      document.removeEventListener('keydown', onEsc);
      modal.removeEventListener('click', outsideClose);
    }

    function bindOpen(el){
      if(!el) return;
      el.addEventListener('click', openModal);
      el.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){
          e.preventDefault();
          openModal();
        }
      });
    }

    bindOpen(chip);
    bindOpen(mobileCard);

    if(closeBtn) closeBtn.addEventListener('click', closeModal);
    if(cancelBtn) cancelBtn.addEventListener('click', function(e){ e.preventDefault(); closeModal(); });

    if(fileInput){
      fileInput.addEventListener('change', function(){
        var f=fileInput.files&&fileInput.files[0];
        if(!f) return;
        var fr=new FileReader();
        fr.onload=function(){ preview.src=fr.result; };
        fr.readAsDataURL(f);
      });
    }

    async function saveProfile(){
      msg.textContent='Salvando...';
      if(saveBtn) saveBtn.disabled=true;

    function getCookie(name){
      try{
        var safeName = String(name || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var m = document.cookie.match(new RegExp('(?:^|; )' + safeName + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : '';
      }catch{
        return '';
      }
    }

      async function uploadAvatarIfAny(){
        var f=fileInput && fileInput.files && fileInput.files[0];
        if(!f) return '';

        msg.textContent='Enviando foto...';

        var headers={};
        var csrf=getCookie('csrf_token') || getCookie('csrf') || getCookie('XSRF-TOKEN');
        if(csrf) headers['X-CSRF-Token']=csrf;

        try{
          var tok=(localStorage.getItem('access_token')||localStorage.getItem('token')||'').trim();
          if(tok && tok.split('.').length===3) headers['Authorization']='Bearer ' + tok;
        }catch{}

        var endpoints=[
          '/api/usuarios/me/avatar',
          '/api/usuarios/avatar',
          '/api/usuarios/me/upload-avatar',
          '/api/usuarios/upload-avatar'
        ];

        var lastErr=null;

        for(var i=0;i<endpoints.length;i++){
          var url=endpoints[i];
          var fd=new FormData();
          fd.append('file', f, f.name || 'avatar.jpg');

          try{
            var res=await fetch(url,{ method:'POST', body:fd, credentials:'include', headers:headers });
            if(res.status===404) continue;

            var data=null;
            try{ data=await res.json(); }catch{}

            if(!res.ok){
              var detail=(data && (data.detail || data.message)) ? (data.detail || data.message) : '';
              throw new Error(detail || ('HTTP ' + res.status));
            }

            var avatarUrl=(data && (data.avatar_url || data.avatarUrl || data.url || data.path || data.avatar)) || '';
            if(!avatarUrl) return '';

            var v=Date.now();
            try{
              localStorage.setItem('usuario_avatar', avatarUrl);
              localStorage.setItem('avatar_url', avatarUrl);
              localStorage.setItem('usuario_avatar_v', String(v));
            }catch{}

            try{ fileInput.value=''; }catch{}
            renderUser();
            return avatarUrl;
          }catch(e){
            lastErr=e;
          }
        }

        throw lastErr || new Error('Falha ao enviar foto (endpoint não encontrado).');
      }

      try{
        var nome=(nomeInput.value||'').trim();
        var dept=(deptInput.value||'').trim();

        try{
          if(nome) localStorage.setItem('nome', nome); else localStorage.removeItem('nome');
          if(dept) localStorage.setItem('departamento', dept); else localStorage.removeItem('departamento');
        }catch{}

        await uploadAvatarIfAny();
        renderUser();

        msg.textContent='Salvo!';
        setTimeout(closeModal,650);
      }catch(err){
        var m=(err && err.message) ? err.message : String(err||'Erro ao salvar');
        msg.textContent='Erro: ' + m;
      }finally{
        if(saveBtn) saveBtn.disabled=false;
      }
    }

    if(saveBtn) saveBtn.addEventListener('click', function(e){
      e.preventDefault();
      saveProfile();
    });
  })();

  async function doLogout(){
    try{
      await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
    }catch{}

    (function nukeCookies(){
      const past='Thu, 01 Jan 1970 00:00:00 GMT';
      const names=(document.cookie||'').split(/;\s*/).filter(Boolean).map(c=>c.split('=')[0]);
      for(const name of names){
        document.cookie = `${name}=; Expires=${past}; Path=/`;
      }
    })();

    try{ localStorage.clear(); sessionStorage.clear(); }catch{}
    if('caches' in window){
      try{
        const ks=await caches.keys();
        await Promise.all(ks.map(k=>caches.delete(k)));
      }catch{}
    }

    window.location.replace('/');
  }

  (function(){
    var out=document.getElementById('sidebarLogout');
    var mobOut=document.getElementById('mobileSidebarLogout');

    if(out && !out.dataset.bound){
      out.dataset.bound='1';
      out.addEventListener('click', function(ev){
        ev.preventDefault();
        doLogout();
      });
    }

    if(mobOut && !mobOut.dataset.bound){
      mobOut.dataset.bound='1';
      mobOut.addEventListener('click', function(ev){
        ev.preventDefault();
        doLogout();
      });
    }
  })();

  (function(){
    var btn=document.getElementById('mobileMoreBtn');
    var sheet=document.getElementById('mobileMoreSheet');
    var backdrop=document.getElementById('mobileMoreBackdrop');
    if(!btn || !sheet || !backdrop) return;

    function isMobile(){
      return window.matchMedia('(max-width: 920px)').matches;
    }

    function openSheet(){
      if(!isMobile()) return;
      sheet.classList.add('is-open');
      backdrop.classList.add('is-open');
      sheet.setAttribute('aria-hidden','false');
      btn.classList.add('is-active');
      document.documentElement.style.overflow='hidden';
      document.body.style.overflow='hidden';
    }

    function closeSheet(){
      sheet.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      sheet.setAttribute('aria-hidden','true');
      btn.classList.remove('is-active');
      document.documentElement.style.overflow='';
      document.body.style.overflow='';
    }

    btn.addEventListener('click', function(){
      if(sheet.classList.contains('is-open')) closeSheet();
      else openSheet();
    });

    backdrop.addEventListener('click', closeSheet);

    sheet.querySelectorAll('a[href]').forEach(function(a){
      a.addEventListener('click', function(){
        var href=a.getAttribute('href') || '';
        if(href !== '#') closeSheet();
      });
    });

    document.addEventListener('keydown', function(e){
      if(e.key==='Escape' && sheet.classList.contains('is-open')) closeSheet();
    });

    window.addEventListener('resize', function(){
      if(!isMobile()) closeSheet();
    });
  })();
})();
</script>
