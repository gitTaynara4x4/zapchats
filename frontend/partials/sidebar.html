<!-- /frontend/partials/sidebar.html — DESKTOP ONLY (faixa verde até o topo) -->

<!-- PRELOAD das logos para evitar flicker -->
<link rel="preload" as="image" href="/img/logo-s-fundo.png">
<link rel="preload" as="image" href="/img/logo-white.png">
<link rel="preload" as="image" href="/img/fav-icon.png">

<style>
  :root{
    --topbar-h:44px;
    --sbw:16.5rem;   /* largura do sidebar expandido */
    --sbw-c:3.2rem;  /* largura do sidebar colapsado */

    /* Cores dos ícones */
    --icon:#9ca3af;
    --icon-active-light:#000000;
    --icon-active-dark:#ffffff;

    /* Tokens básicos (herdando do app) */
    --card:#161617; --border:#27272a; --fg:#e5e7eb; --muted:#9ca3af; --hover:rgba(255,255,255,.04);
    --ring:#4f83ff; --danger:#ef4444; --ok:#16a34a; --overlay:rgba(0,0,0,.5);
  }
  html:not(.dark){
    --card:#fff; --border:#e5e7eb; --fg:#1f2937; --muted:#6b7280; --hover:rgba(0,0,0,.06); --overlay:rgba(0,0,0,.45);
  }

  img{ border:0; outline:0; box-shadow:none; }

  /* ====== FAIXA VERDE “ATÉ O CÉU” COMO BACKGROUND ====== */
  html, body { margin:0; padding:0; border:0; }
  html{
    background:
      linear-gradient(90deg,#22c55e 0%, #16a34a 50%, #10b981 100%) 0 0 / 100% 6px no-repeat,
      var(--card);
    background-attachment: fixed;
  }
  html:not(.dark){
    background:
      linear-gradient(90deg,#22c55e 0%, #16a34a 50%, #10b981 100%) 0 0 / 100% 6px no-repeat,
      #fff;
  }

  /* Topbar */
  .topline-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
    display:flex; align-items:center; justify-content:flex-end; gap:.75rem;
    padding:6px 14px 0; background:transparent; z-index:60; border:0; box-shadow:none;
  }
  .theme-toggle, .theme-toggle * { position:relative; z-index:0; }

  body{ padding-top:var(--topbar-h); }
  @media (min-width:1024px){ body{ padding-left:var(--sbw-c); } }

  /* ===== Sidebar ===== */
  .app-sidebar{
    position:fixed; left:0; top:0; bottom:0;
    width:var(--sbw-c);
    padding:1rem 0;
    padding-top:calc(var(--topbar-h) + 1rem);
    background:transparent; border-right:0;
    display:flex; flex-direction:column; z-index:70; transition:width .22s ease;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
    letter-spacing:-.01em;
  }
  .app-sidebar:hover{
    width:var(--sbw);
    overflow:auto;
    padding-left:.45rem;
    padding-right:.45rem;
  }

  .app-sidebar::before{
    content:""; position:fixed; left:0; top:0; bottom:0;
    width:inherit;
    background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,0)), var(--card);
    border-right:0 !important; pointer-events:none; z-index:0;
    transition:width .22s ease;
  }

  /* ===== Logo — alinhada + cross-fade sem flicker + ANIMAÇÃO SUAVE ===== */
  .app-sidebar .logo{
    height:56px; margin:0 0 1rem;
    display:grid; place-items:center;           /* colapsado: igual aos ícones (centro) */
    position:relative; z-index:1;
  }
  .app-sidebar:hover .logo{
    justify-items:start;                        /* expandido: alinha à esquerda */
    padding:0 .7rem 0 .6rem;                    /* mesmo padding dos links */
  }

  /* empilha favicon e logo cheia na mesma célula p/ transição limpa */
  .logo .logo-fav,
  .logo .logo-full{
    grid-area:1/1;
    max-height:50px;
    will-change:opacity, transform;
    backface-visibility:hidden;
    transform:translateZ(0);                    /* evita “piscada” em GPUs */
    contain:paint;
  }

  /* estado colapsado (só favicon) */
  .logo .logo-fav{ opacity:1; transition:opacity .16s ease-in; }
  .logo .logo-full{ opacity:0; pointer-events:none; }

  /* ANIMAÇÃO: quando expandir, a logo cheia aparece devagar */
  @keyframes logoFadeIn {
    from { opacity:0; transform:translateY(2px) scale(.985); filter:blur(.6px); }
    to   { opacity:1; transform:none; filter:none; }
  }

  /* estado expandido (hover no aside) */
  .app-sidebar:hover .logo .logo-fav{
    opacity:0; pointer-events:none; transition:opacity .12s ease-out;
  }
  .app-sidebar:hover .logo .logo-full{
    opacity:1; pointer-events:auto;
    animation:logoFadeIn .42s cubic-bezier(.2,.7,.2,1) both;
    animation-delay:.06s;                       /* começa logo que o hover abrir */
  }
  /* tema da logo cheia */
  html.dark .app-sidebar:hover .logo .logo-full.logo-dark{ opacity:1; }
  html.dark .app-sidebar:hover .logo .logo-full.logo-light{ opacity:0; }
  html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-light{ opacity:1; }
  html:not(.dark) .app-sidebar:hover .logo .logo-full.logo-dark{ opacity:0; }

  /* respeita redução de movimento do SO */
  @media (prefers-reduced-motion: reduce){
    .logo .logo-fav,
    .logo .logo-full{
      transition:none !important;
      animation:none !important;
      filter:none !important;
      transform:none !important;
    }
  }

  /* Navegação */
  .app-sidebar nav{
    display:flex; flex-direction:column; gap:.5rem; position:relative; z-index:1;
    flex:1 1 auto; overflow-y:auto; padding-right:2px;
  }
  .app-sidebar nav a{
    display:flex; align-items:center; gap:.75rem; justify-content:center;
    padding:.5rem .5rem;
    border-radius:.75rem; color:var(--muted);
    background:transparent !important; border:0 !important; box-shadow:none !important; outline:0 !important;
    transition:background .15s,color .15s, padding .2s ease, justify-content .2s ease, gap .2s ease;
    font-weight:600; text-decoration:none; text-align:left;
  }
  .app-sidebar:hover nav a{
    justify-content:flex-start;
    padding:.5rem .7rem .5rem .6rem;
  }

  /* Ícone — tamanho constante */
  .nav-icon{
    width:26px; height:26px;
    flex:0 0 26px;
    display:inline-grid; place-items:center;
    color:var(--icon);
  }
  .nav-icon-svg{ width:22px; height:22px; display:block; }

  .label{
    white-space:nowrap; overflow:hidden; opacity:0; max-width:0; transform:translateX(-6px);
    transition:opacity .18s ease, max-width .22s ease, transform .22s ease;
    text-align:left;
  }
  .app-sidebar:hover .label{
    opacity:1; max-width:14rem; transform:translateX(0);
  }

  .app-sidebar:hover nav a:hover,
  .app-sidebar:hover nav a:focus-visible,
  .app-sidebar:hover nav a.active,
  .app-sidebar:hover nav a[aria-current="page"]{
    background:var(--hover) !important; color:var(--fg);
  }

  html.dark .app-sidebar nav a.active .nav-icon,
  html.dark .app-sidebar nav a[aria-current="page"] .nav-icon{
    color:var(--icon-active-dark);
  }
  html:not(.dark) .app-sidebar nav a.active .nav-icon,
  html:not(.dark) .app-sidebar nav a[aria-current="page"] .nav-icon{
    color:var(--icon-active-light);
  }

  /* Colapsado: centralização perfeita */
  .app-sidebar:not(:hover) nav{ align-items:center; }
  .app-sidebar:not(:hover) nav a{
    width:100%; gap:0; justify-content:center;
    padding:.5rem 0;
  }
  .app-sidebar:not(:hover) .label{
    display:none !important;
    max-width:0 !important;
    opacity:0 !important;
    transform:none !important;
  }
  .app-sidebar:not(:hover) .nav-icon{
    margin:0 auto; display:grid; place-items:center;
  }
  .app-sidebar:not(:hover) .nav-icon-svg{
    display:block; margin:0 auto;
  }

  /* Chip usuário + toggle tema */
  .user-chip{
    display:flex; align-items:center; gap:.5rem; margin-right:6px;
    padding:.3rem .6rem; border:1px solid var(--border); border-radius:999px;
    background:var(--card); color:var(--muted); font-weight:700; font-size:12px;
    cursor:pointer; user-select:none;
  }
  .user-chip:focus-visible{
    outline:2px solid var(--ring); outline-offset:2px;
  }
  .user-chip .user-email{
    max-width:28ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--fg);
  }
  .user-chip .avatar{
    width:22px; height:22px; border-radius:999px; object-fit:cover; display:none; box-shadow:none;
  }
  html:not(.dark) .user-chip{ background:#fff; }

  .theme-toggle{
    --w:78px; --h:34px; --p:3px; --k:28px; --dx: calc(var(--w) - var(--k) - var(--p)*2);
    position:relative; width:var(--w); height:var(--h); padding:var(--p);
    border-radius:999px; cursor:pointer; outline:none; border:1px solid;
    display:inline-block; isolation:isolate; background:#eceff3; border-color:#d5d9e0;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 2px rgba(0,0,0,.05);
    transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
    line-height:0;
  }
  html.dark .theme-toggle{
    background:#2f323a; border-color:#3a3e46;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.03);
  }
  .theme-toggle .slot{
    position:absolute; top:50%; transform:translateY(-50%);
    width:28px; height:28px; display:grid; place-items:center; pointer-events:none; opacity:.75;
  }
  .theme-toggle .slot.left{ left:8px; }
  .theme-toggle .slot.right{ right:8px; }
  .theme-toggle .slot svg{ width:18px; height:18px; display:block; }
  .theme-toggle .slot svg *{
    stroke:#9ca3af;
  }
  html.dark .theme-toggle .slot svg *{
    stroke:#8a93a1;
  }
  .theme-toggle .thumb{
    position:absolute; left:var(--p); top:50%; width:var(--k); height:var(--k); border-radius:999px;
    transform:translate(0,-50%); transition:transform .38s cubic-bezier(.28,1.2,.43,1), box-shadow .2s ease, background .3s ease;
    display:grid; place-items:center; overflow:hidden;
    background:
      radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
      linear-gradient(180deg,#f8c266,#f59e0b);
    box-shadow:0 4px 8px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
  }
  .theme-toggle .thumb svg{
    width:22px; height:22px; display:block; position:relative; z-index:1; pointer-events:none;
  }
  .theme-toggle .thumb .thumb-sun{ display:block; }
  .theme-toggle .thumb .thumb-moon{ display:none; }
  html.dark .theme-toggle .thumb{
    transform:translate(var(--dx), -50%) !important;
    background:
      radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
      linear-gradient(180deg,#6ba6ff,#2563eb) !important;
    box-shadow:0 6px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.22);
  }
  html.dark .theme-toggle .thumb .thumb-sun{ display:none !important; }
  html.dark .theme-toggle .thumb .thumb-moon{ display:block !important; }
  .theme-toggle:active .thumb{ transform: translate(0,-50%) scale(.96); }
  html.dark .theme-toggle:active .thumb{ transform: translate(calc(var(--dx)),-50%) scale(.96); }
  .theme-toggle:focus-visible{ box-shadow:0 0 0 3px rgba(99,102,241,.35); }
  .theme-toggle.t-anim::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
    animation:sweep .55s ease both;
  }
  @keyframes sweep { from{opacity:.0} to{opacity:1} }

  /* Modal Perfil */
  .pf-modal{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--overlay); z-index:10000;
  }
  .pf-modal.is-open{ display:flex; }
  .pf-dialog{
    width:min(680px, 92vw); background:var(--card); border:1px solid var(--border);
    border-radius:1rem; box-shadow:0 20px 50px rgba(0,0,0,.35); overflow:hidden;
  }
  .pf-hd{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--border);
  }
  .pf-hd h3{ margin:0; font-size:1rem; }
  .pf-close{
    background:transparent; border:none; font-size:22px; cursor:pointer; color:var(--muted);
  }
  .pf-body{
    padding:16px; display:grid; grid-template-columns:160px 1fr; gap:16px;
  }

  .pf-avatar-wrap{
    display:flex; flex-direction:column; align-items:center; gap:.5rem;
  }
  .pf-avatar{
    width:120px; height:120px; border-radius:999px; object-fit:cover; background:var(--hover); box-shadow:none;
  }
  .pf-upload{
    display:inline-block; font-size:.9rem; padding:.45rem .7rem;
    border-radius:.6rem; border:1px solid var(--border); background:var(--card); cursor:pointer;
  }
  .pf-upload input{ display:none; }
  .pf-grid{ display:grid; gap:.75rem; }
  .pf-field label{
    display:block; font-size:.85rem; color:var(--muted); margin-bottom:.25rem;
  }
  .pf-field input{
    width:100%; padding:.6rem .7rem; border-radius:.6rem;
    border:1px solid var(--border); background:var(--card); color:var(--fg); outline:none;
  }
  .pf-field input:focus{
    box-shadow:0 0 0 3px var(--ring); border-color:transparent;
  }
  .pf-actions{
    display:flex; gap:.5rem; justify-content:flex-end;
    padding:12px 16px; border-top:1px solid var(--border);
  }
  .pf-btn{
    padding:.55rem .9rem; border-radius:.6rem;
    border:1px solid var(--border); background:var(--card);
    color:var(--fg); cursor:pointer; font-weight:600;
  }
  .pf-btn.primary{
    background:#10b981; border-color:#10b981; color:#fff;
  }
  .pf-btn.danger{
    background:transparent; color:var(--danger); border-color:var(--danger);
  }

  .pf-msg{ padding:8px 16px; font-size:.9rem; color:var(--muted); }

  .app-sidebar nav a:focus{ outline:none; }
  .app-sidebar:hover nav a:focus-visible{
    outline:2px solid var(--ring); outline-offset:2px;
  }
</style>

<!-- TOPBAR -->
<div class="topline-bar">
  <div class="user-chip" id="userChip" title="" role="button" tabindex="0" aria-haspopup="dialog" aria-controls="pfModal">
    <img id="userAvatar" class="avatar" alt="Foto do usuário" referrerpolicy="no-referrer" />

    <span class="user-email" id="userEmailLabel">Usuário</span>

      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

    </span>

            <stop offset="0%" stop-color="#ffd27a"/>

            <stop offset="100%" stop-color="#f59e0b"/>

        <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad-desktop)"/>
      </svg>
      <svg class="thumb-moon" viewBox="0 0 24 24">
        <defs>
          <radialGradient id="moonGrad-desktop" cx="30%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#9fc3ff"/>
            <stop offset="60%" stop-color="#6ba6ff"/>
            <stop offset="100%" stop-color="#2563eb"/>
          </radialGradient>
        </defs>
        <circle cx="12" cy="12" r="11" fill="url(#moonGrad-desktop)"/>
      </svg>
    </span>
  </button>
</div>

<div id="pfModal" class="pf-modal" aria-hidden="true">
  <div class="pf-dialog" role="dialog" aria-modal="true" aria-labelledby="pfTitle">
    <div class="pf-hd">
      <h3 id="pfTitle">Meu perfil</h3>
      <button class="pf-close" id="pfClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="pf-body">
      <div class="pf-avatar-wrap">
        <img id="pfPreview" class="pf-avatar" alt="Avatar">
        <label class="pf-upload">
          <input id="pfFile" type="file" accept="image/*">
          <i class="fa fa-image" style="margin-right:.35rem"></i> Alterar foto
        </label>
      </div>
      <div class="pf-grid">
        <div class="pf-field">
          <label for="pfNome">Nome</label>
          <input id="pfNome" type="text" placeholder="Seu nome">
        </div>
        <div class="pf-field">
          <label for="pfEmail">E-mail</label>
          <input id="pfEmail" type="email" readonly>
        </div>
        <div class="pf-field">
          <label for="pfDept">Departamento (opcional)</label>
          <input id="pfDept" type="text" placeholder="Departamento">
        </div>
        <div id="pfMsg" class="pf-msg"></div>
      </div>
    </div>
    <div class="pf-actions">
      <button class="pf-btn" id="pfCancel">Cancelar</button>
      <button class="pf-btn primary" id="pfSave">Salvar alterações</button>
    </div>
  </div>
</div>

<script>
/* === Script do sidebar (desktop) === */
(function(){
  var html=document.documentElement;

  /* aplica o tema salvo ou o do AppTheme, se existir */
  try{
    if(window.AppTheme && typeof AppTheme.current==='function'){
      html.classList.toggle('dark', AppTheme.current()==='dark');
    }else{
      var saved=localStorage.getItem('theme');
      if(saved) html.classList.toggle('dark', saved==='dark');
    }
  }catch{}

  /* Toggle de tema */
  var btn=document.getElementById('themeSwitch');
  if(btn && !btn.dataset.bound){
    btn.dataset.bound='1';
    function syncPressed(){
      btn.setAttribute('aria-pressed', String(html.classList.contains('dark')));
    }
    syncPressed();
    btn.addEventListener('click', function(){
      var willDark=!html.classList.contains('dark');
      try{
        if(window.AppTheme && typeof AppTheme.set==='function'){
          AppTheme.set(willDark?'dark':'light');
        }else{
          html.classList.toggle('dark', willDark);
          localStorage.setItem('theme', willDark?'dark':'light');
        }
      }catch{}
      btn.classList.remove('t-anim'); void btn.offsetWidth; btn.classList.add('t-anim');
      setTimeout(function(){ btn.classList.remove('t-anim'); }, 580);
      syncPressed();
    });
    window.addEventListener('storage', function(e){
      if(e.key==='theme' && e.newValue){
        html.classList.toggle('dark', e.newValue==='dark');
        syncPressed();
      }
    });
  }

  /* ativa item atual */
  (function(){
    var aside=document.querySelector('.app-sidebar'); if(!aside) return;
    var nowFull=location.pathname.replace(/\/+$/,'');
    var nowFile=nowFull.split('/').pop();
    aside.querySelectorAll('nav a[href]').forEach(function(a){
      try{
        var pFull=new URL(a.getAttribute('href'), location.origin).pathname.replace(/\/+$/,'');
        var pFile=pFull.split('/').pop();
        if(pFull===nowFull || pFile===nowFile){
          a.classList.add('active');
          a.setAttribute('aria-current','page');
        }
      }catch{}
      a.addEventListener('mouseenter', function(){
        try{
          var u=new URL(a.href, location.href);
          if(u.origin===location.origin){
            var l=document.createElement('link');
            l.rel='prefetch';
            l.href=u.href;
            document.head.appendChild(l);
          }
        }catch{}
      }, {once:true});
    });
  })();

  /* chip usuário */
  (function(){
    function pick(){
      for(var i=0;i<arguments.length;i++){
        var k=arguments[i];
        try{
          var v=localStorage.getItem(k);
          if(!v) continue;
          if((v.startsWith('{')&&v.endsWith('}'))||(v.startsWith('[')&&v.endsWith(']'))){
            try{ return JSON.parse(v); }catch{}
          }
          return v;
        }catch{}
      }
      return '';
    }
    function jwtInfo(){
      try{
        var tok=pick('access_token','token');
        if(!tok||!tok.includes('.')) return {};
        return JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))) || {};
      }catch{
        return {};
      }
    }
    function info(){
      var nome=pick('nome','name','displayName','usuario_nome','user_name');
      if(nome && typeof nome==='object') nome=nome.nome||nome.name||nome.displayName||'';
      var dept=pick('departamento','setor','department','dept','usuario_departamento','user_department');
      if(dept && typeof dept==='object') dept=dept.departamento||dept.setor||dept.department||dept.dept||'';
      var email=pick('email','userEmail','loginEmail','usuario_email','user_email');
      var obj=pick('usuario','user','me','auth_user','profile','auth');
      if(obj && typeof obj==='object'){
        email=email||obj.email||(obj.user&&obj.user.email)||'';
        nome =nome ||obj.nome ||obj.name ||(obj.user&&(obj.user.nome||obj.user.name))||'';
        dept =dept ||obj.departamento||obj.setor||(obj.user&&(obj.user.departamento||obj.user.setor))||'';
      }
      var jwt=jwtInfo();
      email=email||jwt.email||jwt.preferred_username||jwt.sub||'';
      nome =nome ||jwt.name ||jwt.given_name||jwt.nickname||'';
      return {nome:(nome||'').trim(), dept:(dept||'').trim(), email:(email||'').trim()};
    }
    function getAvatar(){
      var a=localStorage.getItem('usuario_avatar')||localStorage.getItem('avatar_url')||'';
      if(!a){
        var jwt=jwtInfo();
        a=(jwt&&jwt.picture)||'';
      }
      return a||'';
    }
    function render(){
      var chip=document.getElementById('userChip');
      var label=document.getElementById('userEmailLabel');
      var img=document.getElementById('userAvatar');
      var icn=document.getElementById('userIcon');
      if(!chip||!label||!img||!icn) return;
      var u=info();
      var txt=[u.nome, u.dept].filter(Boolean).join(' · ') || u.email || 'Usuário';
      label.textContent=txt;
      chip.title=u.email || u.nome || '';
      var av=getAvatar();
      if(av){
        img.src=av;
        img.style.display='block';
        icn.style.display='none';
      }else{
        img.removeAttribute('src');
        img.style.display='none';
        icn.style.display='';
      }
    }
    render();
    window.addEventListener('storage', function(ev){
      if([
        'usuario_nome','nome','name','displayName',
        'usuario_departamento','departamento','setor','department','dept',
        'usuario_email','email','userEmail','loginEmail',
        'usuario_avatar','avatar_url',
        'usuario','user','me','auth_user','profile','auth',
        'access_token','token'
      ].includes(ev.key)){
        render();
      }
    });
  })();

  /* modal perfil */
  (function(){
    var chip=document.getElementById('userChip');
    var modal=document.getElementById('pfModal');
    var closeBtn=document.getElementById('pfClose');
    var cancelBtn=document.getElementById('pfCancel');
    var saveBtn=document.getElementById('pfSave');
    var fileInput=document.getElementById('pfFile');
    var preview=document.getElementById('pfPreview');
    var nomeInput=document.getElementById('pfNome');
    var emailInput=document.getElementById('pfEmail');
    var deptInput=document.getElementById('pfDept');
    var msg=document.getElementById('pfMsg');

    function openModal(){
      var nome=localStorage.getItem('nome')||'';
      var email=localStorage.getItem('email')||'';
      var dept=localStorage.getItem('departamento')||localStorage.getItem('usuario_departamento')||'';
      nomeInput.value=nome;
      emailInput.value=email;
      deptInput.value=dept;
      var av=localStorage.getItem('usuario_avatar')||'';
      if(av) preview.src=av; else preview.removeAttribute('src');
      msg.textContent='';
      modal.classList.add('is-open');
      modal.setAttribute('aria-hidden','false');
      nomeInput.focus();
      document.addEventListener('keydown', onEsc, {once:true});
      modal.addEventListener('click', outsideClose, {once:true});
    }
    function closeModal(){
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden','true');
    }
    function onEsc(e){ if(e.key==='Escape') closeModal(); }
    function outsideClose(e){ if(e.target===modal) closeModal(); }

    if(chip){
      chip.addEventListener('click', openModal);
      chip.addEventListener('keydown', function(e){
        if(e.key==='Enter'||e.key===' '){
          e.preventDefault();
          openModal();
        }
      });
    }
    if(closeBtn) closeBtn.addEventListener('click', closeModal);
    if(cancelBtn) cancelBtn.addEventListener('click', function(e){
      e.preventDefault();
      closeModal();
    });
    if(fileInput){
      fileInput.addEventListener('change', function(){
        var f=fileInput.files&&fileInput.files[0];
        if(!f) return;
        var fr=new FileReader();
        fr.onload=function(){ preview.src=fr.result; };
        fr.readAsDataURL(f);
      });
    }
    async function saveProfile(){
      msg.textContent='Salvando...';
      try{
        var nome=(nomeInput.value||'').trim();
        var dept=(deptInput.value||'').trim();
        if(nome) localStorage.setItem('nome', nome);
        if(dept) localStorage.setItem('departamento', dept);
      }catch{}
      msg.textContent='Informações salvas.';
      setTimeout(closeModal, 600);
    }
    if(saveBtn) saveBtn.addEventListener('click', function(e){
      e.preventDefault();
      saveProfile();
    });
  })();

  /* logout */
  (function(){
    var out=document.getElementById('sidebarLogout');
    if(!out || out.dataset.bound) return;
    out.dataset.bound='1';
    out.addEventListener('click', async function(ev){
      ev.preventDefault();

      // 1) pede ao backend pra apagar cookies HttpOnly
      try{
        await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      }catch{}

      // 2) limpa cookies acessíveis via JS (best-effort)
      (function nukeCookies(){
        const past='Thu, 01 Jan 1970 00:00:00 GMT';
        const names=(document.cookie||'').split(/;\s*/).filter(Boolean).map(c=>c.split('=')[0]);
        for(const name of names){
          document.cookie = `${name}=; Expires=${past}; Path=/`;
        }
      })();

      // 3) limpa storages/caches
      try{ localStorage.clear(); sessionStorage.clear(); }catch{}
      if ('caches' in window) {
        try{
          const ks = await caches.keys();
          await Promise.all(ks.map(k => caches.delete(k)));
        }catch{}
      }

      // 4) redireciona para a RAIZ (que mostra o login)
      window.location.replace('/');
    });
  })();
})();
</script>
