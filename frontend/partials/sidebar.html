<script>
  (function () {
    try {
      var root = document.documentElement;
      var saved =
        (window.AppTheme && typeof window.AppTheme.current === 'function'
          ? window.AppTheme.current()
          : (localStorage.getItem('theme') || localStorage.getItem('valora_theme') || 'dark')
        ) || 'dark';

      var isDark = String(saved).toLowerCase() === 'dark';
      root.classList.toggle('dark', isDark);
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>

    'disparos': 'Disparador',
    'conectar': 'Conectar WhatsApp',
    'notificacoes': 'Notificações',
    'configuracoes': 'Configurações',
    'perfil': 'Meu Perfil',
    'meu-plano': 'Meu Plano'
  };

  var MOBILE_BREAKPOINT = 920;

  var sidebar = document.getElementById('ValoraAppSidebar');
  var overlay = document.getElementById('ValoraMobileOverlay');
  var toggleBtn = document.getElementById('ValoraSidebarToggle');
  var closeBtn = document.getElementById('ValoraMobileClose');
  var mobileSubtitle = document.getElementById('ValoraMobileSubtitle');

  var userProfileBtn = document.getElementById('ValoraUserProfileBtn');
  var userDropdown = document.getElementById('ValoraUserDropdown');
  var notifBadge = document.getElementById('ValoraNotifBadge');

  var openProfileBtn = document.getElementById('ValoraOpenProfileBtn');
  var myPlanBtn = document.getElementById('ValoraMyPlanBtn');
  var configBtn = document.getElementById('ValoraConfigBtn');
  var toggleThemeBtn = document.getElementById('ValoraToggleThemeBtn');
  var themeActionText = document.getElementById('ValoraThemeActionText');
  var logoutBtn = document.getElementById('ValoraLogoutBtn');

  var userNameEl = document.getElementById('ValoraUserName');
  var userEmailEl = document.getElementById('ValoraUserEmail');
  var userInitialsEl = document.getElementById('ValoraUserInitials');
  var userAvatarImg = document.getElementById('ValoraUserAvatarImg');

  function isMobile() {
    return window.matchMedia('(max-width: ' + MOBILE_BREAKPOINT + 'px)').matches;
  }

  function normalizePath(path) {
    path = String(path || '').toLowerCase().trim();
    path = path.split('?')[0].split('#')[0];
    path = path.replace(/\/+$/, '');
    return path || '/';
  }

  function resolveCurrentMenu() {
    var path = normalizePath(location.pathname);

    if (path === '/' || path === '/dashboard' || path === '/home' || path === '/inicio' || path === '/dashboard.html') return 'dashboard';
    if (path.indexOf('/atendimentos') === 0 || path === '/atendimentos.html') return 'atendimentos';
    if (path.indexOf('/midias') === 0 || path === '/midias.html') return 'midias';
    if (path.indexOf('/chat-interno') === 0 || path === '/chat-interno.html') return 'chat-interno';
    if (path.indexOf('/clientes') === 0 || path === '/clientes.html') return 'clientes';
    if (path.indexOf('/colaboradores') === 0 || path === '/colaboradores.html') return 'colaboradores';
    if (path.indexOf('/departamentos') === 0 || path === '/departamentos.html') return 'departamentos';
    if (path.indexOf('/chatbot') === 0 || path === '/chatbot.html') return 'chatbot';
    if (path.indexOf('/disparos') === 0 || path === '/disparos.html') return 'disparos';
    if (path.indexOf('/conectar') === 0 || path === '/conectar.html') return 'conectar';
    if (path.indexOf('/notificacoes') === 0 || path === '/notificacoes.html') return 'notificacoes';
    if (path.indexOf('/configuracoes') === 0 || path === '/configuracoes.html' || path === '/config.html') return 'configuracoes';
    if (path.indexOf('/perfil') === 0 || path === '/perfil.html') return 'perfil';
    if (path.indexOf('/meu-plano') === 0 || path === '/meu-plano.html') return 'meu-plano';

    return 'dashboard';
  }

  function syncActiveMenu() {
    var current = resolveCurrentMenu();

    document.querySelectorAll('.Valora-nav-item[data-menu]').forEach(function (item) {
      var active = item.getAttribute('data-menu') === current;
      item.classList.toggle('is-active', active);
      if (active) item.setAttribute('aria-current', 'page');
      else item.removeAttribute('aria-current');
    });

    if (mobileSubtitle) {
      mobileSubtitle.textContent = MENU_LABELS[current] || 'Menu';
    }
  }

  function openSidebar() {
    if (!isMobile()) return;
    if (sidebar) sidebar.classList.add('show');
    if (overlay) overlay.classList.add('show');
    if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'true');
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
  }

  function closeSidebar() {
    if (sidebar) sidebar.classList.remove('show');
    if (overlay) overlay.classList.remove('show');
    if (toggleBtn) toggleBtn.setAttribute('aria-expanded', 'false');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }

  function closeUserDropdown() {
    if (userDropdown) userDropdown.classList.remove('show');
    if (userProfileBtn) {
      userProfileBtn.classList.remove('active');
      userProfileBtn.setAttribute('aria-expanded', 'false');
    }
  }

  function toggleUserDropdown() {
    if (!userDropdown || !userProfileBtn) return;
    var willOpen = !userDropdown.classList.contains('show');
    userDropdown.classList.toggle('show', willOpen);
    userProfileBtn.classList.toggle('active', willOpen);
    userProfileBtn.setAttribute('aria-expanded', String(willOpen));
  }

  function isDarkTheme() {
    return document.documentElement.classList.contains('dark') ||
           document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function setTheme(mode) {
    var dark = String(mode) === 'dark';
    var root = document.documentElement;

    try {
      if (window.AppTheme && typeof window.AppTheme.set === 'function') {
        window.AppTheme.set(dark ? 'dark' : 'light');
      }
    } catch (e) {}

    root.classList.toggle('dark', dark);
    root.setAttribute('data-theme', dark ? 'dark' : 'light');

    try {
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      localStorage.setItem('valora_theme', dark ? 'dark' : 'light');
    } catch (e) {}

    syncThemeLabel();
  }

  function toggleTheme() {
    setTheme(isDarkTheme() ? 'light' : 'dark');
  }

  function syncThemeLabel() {
    if (themeActionText) {
      themeActionText.textContent = isDarkTheme() ? 'Usar tema claro' : 'Usar tema escuro';
    }
  }

  function pick() {
    for (var i = 0; i < arguments.length; i++) {
      var key = arguments[i];
      try {
        var value = localStorage.getItem(key);
        if (!value) continue;

        if (
          (value.startsWith('{') && value.endsWith('}')) ||
          (value.startsWith('[') && value.endsWith(']'))
        ) {
          try { return JSON.parse(value); } catch (e) {}
        }

        return value;
      } catch (e) {}
    }
    return '';
  }

  function jwtInfo() {
    try {
      var tok = pick('access_token', 'token');
      if (!tok || String(tok).split('.').length !== 3) return {};
      return JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))) || {};
    } catch (e) {
      return {};
    }
  }

  function getUserInfo() {
    var nome = pick('nome', 'name', 'displayName', 'usuario_nome', 'user_name');
    if (nome && typeof nome === 'object') nome = nome.nome || nome.name || nome.displayName || '';

    var dept = pick('departamento', 'setor', 'department', 'dept', 'usuario_departamento', 'user_department');
    if (dept && typeof dept === 'object') dept = dept.departamento || dept.setor || dept.department || dept.dept || '';

    var email = pick('email', 'userEmail', 'loginEmail', 'usuario_email', 'user_email');

    var obj = pick('usuario', 'user', 'me', 'auth_user', 'profile', 'auth');
    if (obj && typeof obj === 'object') {
      email = email || obj.email || (obj.user && obj.user.email) || '';
      nome  = nome  || obj.nome || obj.name || (obj.user && (obj.user.nome || obj.user.name)) || '';
      dept  = dept  || obj.departamento || obj.setor || (obj.user && (obj.user.departamento || obj.user.setor)) || '';
    }

    var jwt = jwtInfo();
    email = email || jwt.email || jwt.preferred_username || jwt.sub || '';
    nome  = nome  || jwt.name || jwt.given_name || jwt.nickname || '';

    return {
      nome: String(nome || '').trim(),
      dept: String(dept || '').trim(),
      email: String(email || '').trim()
    };
  }

  function normalizeUrlMaybeRelative(value) {
    var s = String(value || '').trim();
    if (!s) return '';
    if (s.indexOf('data:') === 0) return s;
    if (/^https?:\/\//i.test(s)) return s;
    if (s.charAt(0) === '/') return s;
    return '/' + s.replace(/^\/+/, '');
  }

  function base64ToDataUrl(base64, mime) {
    var raw = String(base64 || '').trim();
    if (!raw) return '';
    if (raw.indexOf('data:') === 0) return raw;
    return 'data:' + (mime || 'image/png') + ';base64,' + raw;
  }

  function getAvatar() {
    try {
      var avatar =
        localStorage.getItem('usuario_avatar') ||
        localStorage.getItem('avatar_url') ||
        '';

      if (!avatar) {
        var jwt = jwtInfo();
        avatar = (jwt && jwt.picture) || '';
      }

      return avatar || '';
    } catch (e) {
      return '';
    }
  }

  function getInitials(name) {
    var safe = String(name || '').trim();
    if (!safe) return 'U';
    var parts = safe.split(/\s+/).filter(Boolean);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function renderUser() {
    var user = getUserInfo();
    var avatar = getAvatar();

    if (userNameEl) userNameEl.textContent = user.nome || 'Usuário';
    if (userEmailEl) userEmailEl.textContent = user.email || user.dept || 'Sem e-mail';

    if (userInitialsEl) {
      userInitialsEl.textContent = getInitials(user.nome || user.email || 'Usuário');
      userInitialsEl.style.display = '';
    }

    if (userAvatarImg) {
      if (avatar) {
        var v = '';
        try { v = localStorage.getItem('usuario_avatar_v') || ''; } catch (e) {}

        var src = avatar;
        if (String(avatar).indexOf('data:') !== 0) {
          src = avatar + (String(avatar).includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v || Date.now());
        }

        userAvatarImg.onerror = function () {
          userAvatarImg.removeAttribute('src');
          userAvatarImg.style.display = 'none';
          if (userInitialsEl) userInitialsEl.style.display = '';
        };

        userAvatarImg.src = src;
        userAvatarImg.style.display = 'block';
        if (userInitialsEl) userInitialsEl.style.display = 'none';
      } else {
        userAvatarImg.removeAttribute('src');
        userAvatarImg.style.display = 'none';
        if (userInitialsEl) userInitialsEl.style.display = '';
      }
    }
  }

  async function hydrateUserFromApi() {
    try {
      var res = await fetch('/api/perfil', {
        method: 'GET',
        credentials: 'include',
        headers: {
          'Accept': 'application/json'
        }
      });

      if (!res.ok) return;

      var data = await res.json();
      if (!data || typeof data !== 'object') return;

      var nome =
        data.nome ||
        data.name ||
        data.usuario_nome ||
        '';

      var email =
        data.email ||
        data.usuario_email ||
        '';

      var dept =
        data.departamento ||
        data.setor ||
        data.department ||
        data.dept ||
        data.cargo ||
        '';

      var avatar =
        data.avatar_url ||
        data.foto_url ||
        data.avatar ||
        data.foto ||
        data.picture ||
        '';

      var avatarBase64 =
        data.avatar_base64 ||
        data.foto_base64 ||
        data.avatar_data ||
        '';

      var avatarMime =
        data.avatar_mime ||
        data.foto_mime ||
        'image/png';

      if (!avatar && avatarBase64) {
        avatar = base64ToDataUrl(avatarBase64, avatarMime);
      }

      if (!avatar) {
        avatar = '/api/perfil/avatar';
      }

      avatar = normalizeUrlMaybeRelative(avatar);

      try {
        if (nome) localStorage.setItem('usuario_nome', String(nome));
        if (email) localStorage.setItem('usuario_email', String(email));
        if (dept) localStorage.setItem('usuario_departamento', String(dept));

        if (avatar) {
          localStorage.setItem('usuario_avatar', avatar);
          localStorage.setItem('avatar_url', avatar);
          localStorage.setItem('usuario_avatar_v', String(Date.now()));
        }
      } catch (e) {}
    } catch (e) {}
  }

  function goToUrl(url) {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.location.href = url;
      } else {
        window.location.href = url;
      }
    } catch (e) {
      window.location.href = url;
    }
  }

  async function doLogout() {
    try {
      await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
    } catch (e) {}

    try {
      var past = 'Thu, 01 Jan 1970 00:00:00 GMT';
      var names = (document.cookie || '').split(/;\s*/).filter(Boolean).map(function (c) {
        return c.split('=')[0];
      });

      names.forEach(function (name) {
        document.cookie = name + '=; Expires=' + past + '; Path=/';
      });
    } catch (e) {}

    try {
      localStorage.clear();
      sessionStorage.clear();
    } catch (e) {}

    if ('caches' in window) {
      try {
        var keys = await caches.keys();
        await Promise.all(keys.map(function (k) { return caches.delete(k); }));
      } catch (e) {}
    }

    window.location.replace('/');
  }

  function getNotifApi() {
    return window.PlanNotifications || null;
  }

  function getNotifUnread() {
    var api = getNotifApi();
    if (api && typeof api.getUnreadCount === 'function') {
      return Number(api.getUnreadCount() || 0);
    }

    try {
      var empresaId = (document.cookie.match(/(?:^|;\s*)(?:empresa_id|EMPRESA_ID)=([^;]+)/) || [])[1] || '0';
      var raw = localStorage.getItem('plan_notif:' + decodeURIComponent(empresaId) + ':unread');
      return Math.max(0, Number(JSON.parse(raw || '0') || 0));
    } catch (e) {
      return 0;
    }
  }

  function syncNotifBadge() {
    if (!notifBadge) return;
    var unread = getNotifUnread();

    if (unread > 0) {
      notifBadge.style.display = 'inline-flex';
      notifBadge.textContent = unread > 99 ? '99+' : String(unread);
    } else {
      notifBadge.style.display = 'none';
      notifBadge.textContent = '0';
    }
  }

  if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
  if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
  if (overlay) overlay.addEventListener('click', closeSidebar);

  document.querySelectorAll('.Valora-nav-item[href]').forEach(function (link) {
    link.addEventListener('click', function () {
      if (isMobile()) closeSidebar();
      closeUserDropdown();
    });
  });

  if (userProfileBtn) {
    userProfileBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleUserDropdown();
    });

    userProfileBtn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleUserDropdown();
      }
    });
  }

  if (openProfileBtn) {
    openProfileBtn.addEventListener('click', function () {
      closeUserDropdown();
      goToUrl('/perfil.html');
    });
  }

  if (myPlanBtn) {
    myPlanBtn.addEventListener('click', function () {
      closeUserDropdown();
      goToUrl('/meu-plano');
    });
  }

  if (configBtn) {
    configBtn.addEventListener('click', function () {
      closeUserDropdown();
      goToUrl('/configuracoes.html');
    });
  }

  if (toggleThemeBtn) {
    toggleThemeBtn.addEventListener('click', function () {
      toggleTheme();
      closeUserDropdown();
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function () {
      closeUserDropdown();
      doLogout();
    });
  }

  document.addEventListener('click', function (e) {
    if (!userDropdown || !userProfileBtn) return;
    if (!userDropdown.contains(e.target) && !userProfileBtn.contains(e.target)) {
      closeUserDropdown();
    }
  });

  document.addEventListener('plan-notifications:updated', function () {
    syncNotifBadge();
  });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      closeUserDropdown();
      closeSidebar();
    }
  });

  window.addEventListener('resize', function () {
    if (!isMobile()) closeSidebar();
    syncActiveMenu();
  });

  window.addEventListener('storage', function (e) {
    if ([
      'usuario_nome', 'nome', 'name', 'displayName',
      'usuario_departamento', 'departamento', 'setor', 'department', 'dept',
      'usuario_email', 'email', 'userEmail', 'loginEmail',
      'usuario_avatar', 'avatar_url', 'usuario_avatar_v',
      'usuario', 'user', 'me', 'auth_user', 'profile', 'auth',
      'access_token', 'token', 'theme', 'valora_theme'
    ].indexOf(e.key) >= 0) {
      renderUser();
      syncThemeLabel();
      syncActiveMenu();
    }

    if (String(e.key || '').indexOf('plan_notif:') === 0) {
      syncNotifBadge();
    }
  });

  await hydrateUserFromApi();
  renderUser();
  syncThemeLabel();
  syncActiveMenu();
  syncNotifBadge();

  setTimeout(syncNotifBadge, 400);
  setTimeout(syncNotifBadge, 1200);
})();
</script>
