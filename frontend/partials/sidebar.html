<style>
  /* ===== VARIÁVEIS DE TEMA (Controlam as cores do App todo) ===== */
  :root {
    /* --- CONFIGURAÇÃO LIGHT MODE (Padrão Limpo/Gelo) --- */
    --topbar-h: 44px;
    --sbw: 16.5rem;
    --sbw-c: 3.2rem;

    /* Cores Zinc (Light) */
    --bg: #f4f4f5;       /* Fundo cinza gelo suave */
    --card: #ffffff;     /* Card branco puro */
    --fg: #18181b;       /* Texto quase preto (fundamental p/ leitura) */
    --border: #e4e4e7;   /* Borda cinza clara */
    
    --muted: #71717a;    /* Texto secundário */
    --hover: #f4f4f5;    /* Hover sutil */
    --hover-strong: #e4e4e7;

    --ring: #3b82f6;     /* Azul foco */
    --accent: #6366f1;   /* Indigo destaque */

    --ok: #10b981; 
    --danger: #ef4444; 
    --warn: #f59e0b;
    --overlay: rgba(0,0,0,0.2);

    /* Ícones no Light */
    --icon: #a1a1aa;
    --icon-active: #18181b; /* Ícone ativo fica escuro */
    
    /* Logos */
    --logo-opacity-light: 1;
    --logo-opacity-dark: 0;
  }

  /* --- CONFIGURAÇÃO DARK MODE (Padrão Deep Dark) --- */
  html.dark {
    --bg: #09090b;       /* Fundo profundo */
    --card: #121215;     /* Card levemente elevado */
    --fg: #e4e4e7;       /* Texto claro */
    --border: #27272a;   /* Borda escura sutil */
    
    --muted: #a1a1aa;
    --hover: #27272a;
    --hover-strong: #3f3f46;

    --overlay: rgba(0,0,0,0.6);

    /* Ícones no Dark */
    --icon: #71717a;
    --icon-active: #ffffff; /* Ícone ativo fica branco */

    /* Logos */
    --logo-opacity-light: 0;
    --logo-opacity-dark: 1;
  }

  /* Reset básico */
  img{ border:0; outline:0; box-shadow:none; }
  html, body { margin:0; padding:0; border:0; }
  
  /* Background Global + Faixa Verde no Topo */
  html {
    background-color: var(--bg);
    background-image: linear-gradient(90deg,#22c55e 0%, #16a34a 50%, #10b981 100%);
    background-repeat: no-repeat;
    background-size: 100% 4px; /* Faixa fina no topo */
    background-position: 0 0;
    background-attachment: fixed;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  body { 
    color: var(--fg); 
    font-family: 'Plus Jakarta Sans', Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding-top: var(--topbar-h);
  }

  @media (min-width:1024px){ body{ padding-left:var(--sbw-c); } }

  /* Topbar */
  .topline-bar{
    position:fixed; top:0; left:0; right:0; height:var(--topbar-h);
    display:flex; align-items:center; justify-content:flex-end; gap:.75rem;
    padding:6px 14px 0; background:transparent; z-index:60; border:0; box-shadow:none;
  }
  .theme-toggle, .theme-toggle * { position:relative; z-index:0; }

  /* ===== Sidebar ===== */
  .app-sidebar{
    position:fixed; left:0; top:0; bottom:0;
    width:var(--sbw-c);
    padding:1rem 0;
    padding-top:calc(var(--topbar-h) + 1rem);
    background:transparent; border-right:0;
    display:flex; flex-direction:column; z-index:70; transition:width .22s ease;
  }
  .app-sidebar:hover{
    width:var(--sbw);
    overflow:auto;
    padding-left:.45rem;
    padding-right:.45rem;
  }

  /* Fundo da Sidebar (Blur + Gradiente) */
  .app-sidebar::before{
    content:""; position:fixed; left:0; top:0; bottom:0;
    width:inherit;
    background: var(--card);
    border-right: 1px solid var(--border);
    pointer-events:none; z-index:0;
    transition:width .22s ease, background 0.3s, border-color 0.3s;
  }

  /* ===== Logo ===== */
  .app-sidebar .logo{
    height:56px; margin:0 0 1rem;
    display:grid; place-items:center;
    position:relative; z-index:1;
  }
  .app-sidebar:hover .logo{ justify-items:start; padding:0 .7rem 0 .6rem; }

  .logo .logo-fav, .logo .logo-full{
    grid-area:1/1; max-height:42px;
    will-change:opacity, transform; transition: all 0.2s;
  }
  .logo .logo-fav{ opacity:1; }
  .logo .logo-full{ opacity:0; pointer-events:none; }
  
  .app-sidebar:hover .logo .logo-fav{ opacity:0; transform: scale(0.8); }
  .app-sidebar:hover .logo .logo-full{ opacity:1; pointer-events:auto; transform: scale(1); }

  /* Controle de Logo Dark/Light via CSS Var */
  .logo-light { opacity: var(--logo-opacity-light); transition: opacity 0.3s; }
  .logo-dark  { opacity: var(--logo-opacity-dark);  transition: opacity 0.3s; }
  /* Garante que ocupem o mesmo espaço */
  .logo-full { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); } 
  .app-sidebar:not(:hover) .logo-full { display: none; }

  /* Navegação */
  .app-sidebar nav{
    display:flex; flex-direction:column; gap:.25rem; position:relative; z-index:1;
    flex:1 1 auto; overflow-y:auto; padding-right:2px;
  }
  .app-sidebar nav a{
    display:flex; align-items:center; gap:.75rem; justify-content:center;
    padding:.65rem .5rem;
    border-radius:.5rem; color:var(--muted);
    transition: all 0.15s ease;
    font-weight:500; text-decoration:none; text-align:left; font-size: 0.9rem;
  }
  .app-sidebar:hover nav a{ justify-content:flex-start; padding:.65rem .7rem .65rem .6rem; }

  .nav-icon{
    width:24px; height:24px; flex:0 0 24px;
    display:inline-grid; place-items:center;
    color:var(--icon);
    transition: color 0.2s;
  }
  .nav-icon-svg{ width:20px; height:20px; display:block; }

  .label{
    white-space:nowrap; overflow:hidden; opacity:0; max-width:0; transform:translateX(-6px);
    transition:opacity .18s ease, max-width .22s ease, transform .22s ease;
  }
  .app-sidebar:hover .label{ opacity:1; max-width:14rem; transform:translateX(0); }

  /* Hover & Active States */
  .app-sidebar nav a:hover {
    background: var(--hover); color: var(--fg);
  }
  .app-sidebar nav a:hover .nav-icon { color: var(--fg); }

  .app-sidebar nav a.active,
  .app-sidebar nav a[aria-current="page"]{
    background: var(--hover-strong);
    color: var(--fg);
  }
  .app-sidebar nav a.active .nav-icon,
  .app-sidebar nav a[aria-current="page"] .nav-icon {
    color: var(--icon-active);
  }

  /* Chip usuário */
  .user-chip{
    display:flex; align-items:center; gap:.6rem; margin-right:6px;
    padding:.3rem .4rem .3rem .8rem; 
    border:1px solid var(--border); border-radius:99px;
    background:var(--card); color:var(--fg); font-weight:600; font-size:13px;
    cursor:pointer; user-select:none;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .user-chip .user-email{
    max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .user-chip .avatar{
    width:28px; height:28px; border-radius:99px; object-fit:cover; display:none; border: 1px solid var(--border);
  }
  
  /* Theme Toggle - Botão Bonito e Simples */
  .theme-toggle{
    width:40px; height:40px; border-radius:10px;
    background: var(--card); border: 1px solid var(--border);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    color: var(--muted); transition: all 0.2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .theme-toggle:hover {
    border-color: var(--muted); color: var(--fg);
  }
  .theme-toggle svg { width: 20px; height: 20px; }
  
  /* Lógica de ícone Sol/Lua */
  html.dark .theme-toggle .icon-sun { display: none; }
  html.dark .theme-toggle .icon-moon { display: block; }
  html:not(.dark) .theme-toggle .icon-sun { display: block; }
  html:not(.dark) .theme-toggle .icon-moon { display: none; }

  /* Modal Perfil (Estilo Zinc) */
  .pf-modal{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:var(--overlay); z-index:10000; backdrop-filter: blur(2px);
  }
  .pf-modal.is-open{ display:flex; }
  .pf-dialog{
    width:min(500px, 92vw); background:var(--card); border:1px solid var(--border);
    border-radius:1rem; box-shadow:0 20px 50px rgba(0,0,0,0.25); overflow:hidden;
  }
  .pf-hd{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .pf-hd h3{ margin:0; font-size:1.1rem; color: var(--fg); }
  .pf-close{
    background:transparent; border:none; font-size:22px; cursor:pointer; color:var(--muted);
  }
  .pf-body{ padding:20px; display:flex; flex-direction: column; gap: 1.5rem; }

  .pf-avatar-wrap{ display:flex; align-items:center; gap: 1rem; }
  .pf-avatar{
    width:80px; height:80px; border-radius:999px; object-fit:cover; background:var(--hover); border: 2px solid var(--border);
  }
  .pf-upload{
    display:inline-flex; align-items: center; gap: 0.5rem; font-size:.9rem; padding:.5rem 1rem;
    border-radius:.5rem; border:1px solid var(--border); background:var(--bg); 
    cursor:pointer; color: var(--fg); font-weight: 500;
  }
  .pf-upload:hover { border-color: var(--muted); }
  .pf-upload input{ display:none; }

  .pf-field label{
    display:block; font-size:.85rem; color:var(--muted); margin-bottom:.4rem; font-weight: 500;
  }
  .pf-field input{
    width:100%; padding:.7rem; border-radius:.5rem;
    border:1px solid var(--border); background:var(--bg); color:var(--fg); outline:none;
    font-size: 0.95rem;
  }
  .pf-field input:focus{ border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }
  .pf-field input[readonly] { opacity: 0.7; cursor: not-allowed; }

  .pf-actions{
    display:flex; gap:.75rem; justify-content:flex-end;
    padding:16px 20px; border-top:1px solid var(--border); background: var(--hover);
  }
  .pf-btn{
    padding:.6rem 1.2rem; border-radius:.5rem; font-size: 0.9rem;
    border:1px solid var(--border); background:var(--card);
    color:var(--fg); cursor:pointer; font-weight:600;
  }
  .pf-btn:hover { background: var(--bg); }
  .pf-btn.primary{
    background:var(--accent); border-color:var(--accent); color:#fff;
  }
  .pf-btn.primary:hover { opacity: 0.9; }
</style>

<div id="pfModal" class="pf-modal" aria-hidden="true">
  <div class="pf-dialog">
    <div class="pf-hd">
      <h3>Meu perfil</h3>
      <button class="pf-close" id="pfClose">&times;</button>
    </div>
    <div class="pf-body">
      <div class="pf-avatar-wrap">
        <img id="pfPreview" class="pf-avatar" alt="Avatar">
        <label class="pf-upload">
          <input id="pfFile" type="file" accept="image/*">
          <i class="fa fa-camera"></i> Alterar
        </label>
      </div>
      
      <div class="pf-field">
        <label>Nome</label>
        <input id="pfNome" type="text" placeholder="Nome completo">
      </div>
      <div class="pf-field">
        <label>E-mail</label>
        <input id="pfEmail" type="email" readonly>
      </div>
      <div class="pf-field">
        <label>Departamento</label>
        <input id="pfDept" type="text" placeholder="Ex: Financeiro">
      </div>
      
      <div id="pfMsg" style="font-size:0.85rem; color:var(--muted); min-height:1.2em;"></div>
    </div>
    <div class="pf-actions">
      <button class="pf-btn" id="pfCancel">Cancelar</button>
      <button class="pf-btn primary" id="pfSave">Salvar</button>
    </div>
  </div>
</div>

<script>
(function(){
  var html=document.documentElement;
  var btn=document.getElementById('themeSwitch');

  // 1. Carregar tema salvo
  try{
    var saved=localStorage.getItem('theme');
    if(saved==='dark'){
      html.classList.add('dark');
    } else {
      html.classList.remove('dark');
    }
  }catch{}

  // 2. Função de Troca (Click)
  if(btn){
    btn.addEventListener('click', function(){
      html.classList.toggle('dark');
      var isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  }

  // 3. User info, avatar e active link
  (function initUser(){
    // Seu script original de usuário/avatar
    function pick(){
      for(var i=0;i<arguments.length;i++){ var k=arguments[i]; try{var v=localStorage.getItem(k); if(v) return v.replace(/^["']|["']$/g,'');}catch{} } return '';
    }
    var uName = pick('nome','name','usuario_nome') || 'Usuário';
    var uEmail = pick('email','userEmail','usuario_email');
    var elEmail = document.getElementById('userEmailLabel');
    var elChip = document.getElementById('userChip');
    if(elEmail) elEmail.textContent = uName;
    if(elChip) elChip.title = uEmail;

    // Avatar
    var av = pick('usuario_avatar','avatar_url');
    var img = document.getElementById('userAvatar');
    var icn = document.getElementById('userIcon');
    if(av && img && icn){
      img.src = av; img.style.display = 'block'; icn.style.display = 'none';
    }
  })();

  // 4. Modal Perfil Logic (Simplificado para funcionar visualmente)
  var modal = document.getElementById('pfModal');
  var chip = document.getElementById('userChip');
  var close = document.getElementById('pfClose');
  if(modal && chip && close){
    chip.addEventListener('click', ()=> modal.classList.add('is-open'));
    close.addEventListener('click', ()=> modal.classList.remove('is-open'));
  }

  // Active Link
  var path = location.pathname;
  document.querySelectorAll('.app-sidebar nav a').forEach(a => {
    if(a.getAttribute('href') === path) a.classList.add('active');
  });
})();
</script>
