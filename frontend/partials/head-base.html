<!-- 2) TOKENS + BASE (sem mexer no prepaint aqui) -->
<style>
  :root{
    --topbar-h: 44px;
    --sbw: 16.5rem;

    /* DARK (padrão) — alinhado ao Dashboard */
    --bg:#0f0f10;
    --fg:#e5e7eb;
    --muted:#9ca3af;
    --card:#161617;
    --surface:#161617;
    --border:#27272a;
    --hover:rgba(255,255,255,.04);
    --hover-strong:rgba(255,255,255,.06);

    --ring:#4f83ff;
    --ok:#16a34a;
    --danger:#ef4444;
    --warn:#f59e0b;
    --info:#3b82f6;

    --radius:12px;
    --shadow:0 10px 30px rgba(0,0,0,.35);

    --font-ui:"Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               Roboto, "Helvetica Neue", Arial, "Noto Sans",
               "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol", sans-serif;
  }

  html:not(.dark){
    --bg:#f9fafb;
    --fg:#1f2937;
    --muted:#6b7280;
    --card:#ffffff;
    --surface:#ffffff;
    --border:#e5e7eb;
    --hover:rgba(0,0,0,.04);
    --hover-strong:rgba(0,0,0,.06);

    --ring:#93c5fd;
    --ok:#16a34a;
    --danger:#dc2626;
    --warn:#d97706;
    --info:#2563eb;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-synthesis-weight:none;
    font-optical-sizing:auto;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  img,svg,canvas,video{
    max-width:100%;
    height:auto;
  }

  ::selection{
    background:color-mix(in oklab, var(--ring) 35%, transparent);
    color:var(--fg);
  }

  /* Controles base suaves */
  button,
  input,
  select,
  textarea{
    font:inherit;
    color:inherit;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:.6rem;
  }

  button{
    cursor:pointer;
    padding:.55rem .85rem;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  }

  button:focus,
  input:focus,
  select:focus,
  textarea:focus{
    outline:0;
    box-shadow:0 0 0 3px var(--ring);
    border-color:transparent;
  }

  /* Tabela base */
  table{
    border-collapse:collapse;
    width:100%;
  }

  th,
  td{
    border-bottom:1px solid var(--border);
    padding:.75rem;
  }

  thead{
    background:var(--hover-strong);
  }

  /* Utilitárias */
  .muted{
    color:var(--muted);
  }

  .card{
    background:var(--card);
    border:1px solid color-mix(in oklab, var(--border) 80%, transparent);
    border-radius:var(--radius);
    box-shadow:0 6px 16px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.04);
  }

  .hoverable:hover{
    background:var(--hover);
  }

  .ring{
    box-shadow:0 0 0 3px var(--ring);
  }

  /* Estruturas opcionais do shell */
  .topline-bar{
    position:fixed;
    inset:0 0 auto 0;
    height:var(--topbar-h);
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 .75rem;
    z-index:40;
  }

  .app-sidebar{
    position:fixed;
    top:var(--topbar-h);
    left:0;
    bottom:0;
    width:var(--sbw);
    background:var(--surface);
    border-right:1px solid var(--border);
    overflow:auto;
    -webkit-overflow-scrolling:touch;
  }

  nav a.active,
  nav a[aria-current="page"]{
    background:var(--hover-strong);
    font-weight:600;
  }

  /* Animação global de entrada da rota (fade + up) */
  @media (prefers-reduced-motion: no-preference){
    .route-enter{
      animation:route-fade-up .24s cubic-bezier(.2,.8,.2,1) both;
      will-change:opacity, transform, filter;
    }

    @keyframes route-fade-up{
      from{
        opacity:0;
        transform:translateY(6px) scale(.995);
        filter:saturate(96%);
      }
      to{
        opacity:1;
        transform:none;
        filter:none;
      }
    }
  }
</style>

<!-- 3) WebSocket GLOBAL da EMPRESA (badge, toasts, etc) -->
<script type="module">
  async function getEmpresaId() {
    if (window.APP_EMPRESA_ID) return window.APP_EMPRESA_ID;

    try {
      const r = await fetch('/api/auth/me', { credentials:'include' });
      if (r.ok) {
        const me = await r.json();
        const id =
          me?.empresa_id ??
          me?.empresa?.id ??
          me?.empresaId ??
          me?.empresaID ??
          null;

        if (id) {
          window.APP_EMPRESA_ID = id;
          return id;
        }
      }
    } catch(e) {
      console.warn('[head-base] /api/auth/me falhou ao resolver empresa:', e);
    }

    return null;
  }

  (async () => {
    if (window.__ZC_HEAD_BASE_WS_BOOTED__) return;
    window.__ZC_HEAD_BASE_WS_BOOTED__ = true;

    const empresaId = await getEmpresaId();
    if (!empresaId) return;

    const ver = window.__ASSET_VER__ || Date.now();

    const {
      ensureEmpresaWS,
      onEmpresaMessage
    } = await import(`/frontend/js/realtime/ws-core.js?_v=${encodeURIComponent(ver)}`);

    // Abre (e mantém ativa) a conexão da empresa
    ensureEmpresaWS(empresaId);

    // Gancho global (futuro: badge, toast, alertinhas, etc)
    onEmpresaMessage(empresaId, (evt) => {
      // Exemplo:
      // if (evt?.data?.type === 'WHATSAPP_STATUS') { ... }
      // console.log('[WS empresa]', evt);
    });
  })();
</script>

<!-- 4) Hidratar nome e avatar do usuário em TODAS as páginas
     Use elementos como:
       <img data-user-avatar class="avatar hidden" alt="Minha foto">
       <span data-user-name></span>
-->
<script type="module">
  function setAvatarFallback(imgEl, nome) {
    imgEl.src = '/frontend/img/user-default.png'; // garanta esse arquivo
    imgEl.alt = (nome || 'Usuário');
  }

  async function hydrateUserUI() {
    try {
      const r = await fetch('/api/auth/me', { credentials:'include' });
      if (!r.ok) return;

      const me = await r.json();

      const nome =
        me?.nome ??
        me?.name ??
        me?.usuario?.nome ??
        me?.user?.name ??
        'Usuário';

      const avatar =
        me?.avatar_url ??
        me?.avatar ??
        me?.usuario?.avatar_url ??
        '';

      // Nome (preenche todos)
      document.querySelectorAll('[data-user-name]').forEach(el => {
        el.textContent = nome;
        el.title = nome;
      });

      // Avatar (preenche todos)
      document.querySelectorAll('img[data-user-avatar]').forEach(img => {
        if (avatar && typeof avatar === 'string' && avatar.length > 6) {
          img.src = avatar;
          img.alt = nome;
          img.classList.remove('hidden');
          img.addEventListener('error', () => setAvatarFallback(img, nome), { once:true });
        } else {
          setAvatarFallback(img, nome);
          img.classList.remove('hidden');
        }
      });

    } catch (e) {
      console.warn('[head-base] hydrateUserUI falhou:', e);
      document
        .querySelectorAll('img[data-user-avatar]')
        .forEach(img => setAvatarFallback(img, 'Usuário'));
    }
  }

  hydrateUserUI();
</script>
