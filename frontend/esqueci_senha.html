<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Redefinir Senha – ZapChats</title>

  <!-- Preload do tema (evita FOUC) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t || t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch {}
    })();
  </script>

  <link rel="stylesheet" href="/frontend/css/esqueci_senha.css">
</head>

<body>
  <!-- TOPBAR -->
  <div class="topline-bar">
    <!-- Toggle de tema: MESMA marcação do login -->
    <button id="themeSwitch" class="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
      <span class="slot left" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.5" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="slot right" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="none"/>
        </svg>
      </span>
      <span class="thumb" aria-hidden="true">
        <svg class="thumb-sun" viewBox="0 0 24 24">
          <defs><radialGradient id="sunGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#ffd27a"/><stop offset="60%" stop-color="#f8c266"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient></defs>
        <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad)"/></svg>
        <svg class="thumb-moon" viewBox="0 0 24 24">
          <defs><radialGradient id="moonGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#9fc3ff"/><stop offset="60%" stop-color="#6ba6ff"/><stop offset="100%" stop-color="#2563eb"/></radialGradient></defs>
        <circle cx="12" cy="12" r="11" fill="url(#moonGrad)"/></svg>
      </span>
    </button>
  </div>

  <main class="page-shell">
    <!-- CARD -->
    <div class="auth-card">
      <div class="auth-card__inner">
        <div class="hero">
          <img src="/img/logo.png" class="logo only-light" alt="ZapChats">
          <img src="/img/logo-white.png" class="logo only-dark"  alt="ZapChats">
          <h2 class="title">Redefinir Senha</h2>
          <p class="subtitle">Receba um token no e-mail e crie uma nova senha.</p>
        </div>

        <!-- Toast -->
        <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

        <!-- PASSO 1 -->
        <form id="form-forgot" class="form vspace" autocomplete="off" novalidate>
          <div class="field">
            <label for="email" class="label">E-mail</label>
            <input id="email" type="email" required class="input" placeholder="seuemail@empresa.com"/>
          </div>

          <button id="btn-forgot" type="submit" class="btn btn-progress" data-variant="green">
            <span class="btn-text">Enviar Token</span>
          </button>
        </form>

        <!-- PASSO 2 -->
        <div id="reset-section" class="hidden mt-8">
          <p class="muted">Cole o token e crie sua nova senha.</p>

          <form id="form-reset" class="form vspace" novalidate>
            <div class="field">
              <label for="token" class="label">Token</label>
              <input id="token" type="text" required class="input" placeholder="Cole o token aqui"/>
            </div>

            <div class="field">
              <label for="nova_senha" class="label">Nova Senha</label>
              <div class="input-wrap">
                <input id="nova_senha" type="password" minlength="8" required class="input" placeholder="••••••••"/>
                <button type="button" id="toggle-pass" class="icon-btn" aria-label="Mostrar senha">
                  <svg id="eye-open" viewBox="0 0 24 24">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3.2"/>
                  </svg>
                  <svg id="eye-off" viewBox="0 0 24 24" class="hidden">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.5 19.5 0 0 1 5.11-5.79M9.9 4.24A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a19.7 19.7 0 0 1-3.06 3.95"/>
                    <path d="M1 1l22 22"/>
                  </svg>
                </button>
              </div>
              <p class="hint">Mínimo 8 caracteres. Use letras, números e símbolos.</p>
            </div>

            <button id="btn-reset" type="submit" class="btn" data-variant="blue">
              <span class="btn-text">Redefinir Senha</span>
            </button>
          </form>
        </div>

        <p class="back-login">
          <a href="/login" class="link">Voltar ao login</a>
        </p>
      </div>
    </div>
  </main>

  <!-- MODAL -->
  <div id="notifyModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="notify-title" data-open="false">
    <div class="modal" role="document">
      <div class="head">
        <div id="notify-icon"></div>
        <h3 id="notify-title" class="title-sm">Notificação</h3>
      </div>
      <div id="notify-body" class="body"></div>
      <div class="foot">
        <button id="notify-cancel" class="btn" data-variant="ghost">Fechar</button>
        <button id="notify-ok" class="btn" data-variant="green">Ok</button>
      </div>
    </div>
  </div>

  <!-- JS da página (o seu) -->
  <script src="/frontend/js/pages/esqueci_senha.js" defer></script>
  <script>
    // brilho rápido no toggle – igual login
    (function(){
      var btn = document.getElementById('themeSwitch');
      if(!btn) return;
      btn.addEventListener('click', function(){
        btn.classList.remove('t-anim'); void btn.offsetWidth; btn.classList.add('t-anim');
      });
    })();
  </script>
</body>
</html>
