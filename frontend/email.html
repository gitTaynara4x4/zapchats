<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>E-mail • ZapChats</title>

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tema (evita FOUC) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t || t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch {}
      // Anti-flash (compatível com seu padrão)
      document.documentElement.classList.add('prepaint');
    })();
  </script>

  <!-- CSS base reaproveitando o layout do Dashboard -->
  <link rel="stylesheet" href="/frontend/css/email.css?_v=<?=Date.now?.()||''?>">
</head>
<body>
  <!-- Sidebar (injetada por app-base.js) -->
  <aside id="sidebar"
         data-src="/frontend/partials/sidebar.html"
         data-src-mobile="/frontend/partials/sidebar-mobile.html"></aside>

  <!-- Conteúdo -->
  <main class="main">
    <header class="section-title">
      <span class="title-ico is-active" aria-hidden="true">
        <!-- ícone de e-mail -->
        <svg class="title-ico-svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2
          2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5L4 6h16zm0
          12H4V8l8 5 8-5v10z"/>
        </svg>
      </span>
      <h1>
        <span class="title-text">E-mail</span>
      </h1>

      <!-- Seletor de Caixa (mesmo visual do seletor de instâncias) -->
      <button id="accTrigger" class="inst-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <i class="fa fa-inbox" aria-hidden="true"></i>
        <span id="accLabel">Selecionar caixa</span>
        <span class="chev">▾</span>
      </button>

      <div id="accMenu" class="inst-menu" aria-hidden="true">
        <div class="head">Caixas conectadas</div>
        <ul id="accList" role="listbox" aria-label="Caixas de e-mail"></ul>
      </div>

      <!-- meta (qtd mensagens / info de limite) -->
      <div class="top-meta"><span id="topMeta">—</span></div>

      <!-- Botão de adicionar conta -->
      <button id="btnAddAccount" class="btn ghost btn-add-email" type="button">
        <i class="fa fa-plus" aria-hidden="true"></i>
        <span>Adicionar conta</span>
      </button>
    </header>

    <!-- Filtro (mesma classe/estilo das outras páginas) -->
    <section class="filter" id="filterBar">
      <div class="group">
        <label for="q">Buscar</label>
        <input id="q" type="text" placeholder="Assunto, remetente…" class="input" autocomplete="off">
      </div>

      <div class="group">
        <label for="status">Status</label>
        <select id="status" class="select">
          <option value="">Todos</option>
          <option value="unread">Não lidos</option>
          <option value="read">Lidos</option>
          <option value="has_attachments">Com anexo</option>
        </select>
      </div>

      <div class="group">
        <button id="btnReload" class="btn" type="button"><i class="fa fa-rotate"></i> Atualizar</button>
        <button id="btnClear" class="btn ghost" type="button">Limpar</button>
      </div>

      <div class="spacer"></div>
      <div class="count" id="countInfo" style="display:block">0 itens</div>
    </section>

    <!-- Lista -->
    <section class="box" id="listBox">
      <h3 style="margin:0 0 .5rem 0">Mensagens</h3>
      <div class="table-wrap">
        <table id="tblEmails" aria-label="Mensagens de e-mail">
          <thead>
            <tr>
              <th style="width:28px"></th>
              <th>Assunto</th>
              <th>De</th>
              <th>Para</th>
              <th style="width:160px">Recebido</th>
              <th style="width:120px">Anexos</th>
            </tr>
          </thead>
          <tbody id="tbodyEmails"></tbody>
        </table>
      </div>

      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.75rem">
        <button id="btnLoadMore" class="btn" type="button">Carregar mais</button>
      </div>
    </section>

    <!-- Modal simples de leitura -->
    <dialog id="dlgEmail" class="email-modal">
      <form method="dialog" class="email-modal__panel">
        <header class="email-modal__header">
          <strong id="dlgSubject">Assunto</strong>
          <button value="close" class="btn ghost" type="submit">Fechar</button>
        </header>
        <section class="email-modal__body">
          <div class="email-meta" id="dlgMeta"></div>
          <hr>
          <article id="dlgBody" class="email-body"></article>
        </section>
      </form>
    </dialog>
  </main>

  <!-- Partials (head/loader) injetados por app-base.js -->
  <div id="app-partials" hidden
       data-head="/frontend/partials/head-base.html"
       data-loader="/frontend/partials/loading.html"></div>

  <!-- Scripts -->
  <script src="/frontend/js/app-base.js"></script>
  <script src="/frontend/js/pages/email.js?_v=<?=Date.now?.()||''?>"></script>
</body>
</html>
