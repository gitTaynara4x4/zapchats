<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login – ZapChats</title>

  <!-- Preload do tema (igual ao seu) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t || t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch {}
    })();
  </script>

  <!-- ===== CSS base (sem Tailwind) ===== -->
  <style>
    :root{
      --topbar-h:44px;

      /* Cores (claro) */
      --bg: #f0fdf4;                 /* green-50 */
      --card: #ffffff;               /* white */
      --muted: #6b7280;              /* gray-500 */
      --text: #1f2937;               /* gray-800 */
      --text-strong:#111827;         /* gray-900 */
      --border: #d1d5db;             /* gray-300 */
      --border-2: #d1d5db;
      --ring: #4ade80;               /* green-400 */
      --green-100:#dcfce7;
      --green-500:#22c55e;
      --green-600:#16a34a;
      --shadow-2xl: 0 25px 50px -12px rgba(0,0,0,.25);
      --shadow-dark: 0 25px 50px -12px rgba(0,0,0,.4);
    }
    html.dark{
      --bg: #0a0a0a;                 /* neutral-950 */
      --card:#171717;                 /* neutral-900 aprox */
      --muted:#9ca3af;               /* gray-400 */
      --text:#e5e7eb;                /* gray-200 */
      --text-strong:#ffffff;
      --border:#404040;              /* neutral-700 */
      --border-2:#262626;            /* neutral-800 */
      --green-100:#232323;           /* bg em ilustração */
      --shadow-2xl: var(--shadow-dark);
    }

    /* Reset/estrutura mínima */
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font: 16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial,sans-serif;
      background:var(--bg); color:var(--text);
    }
    img{max-width:100%; display:block}
    a{color: #22c55e; text-decoration:none}
    a:hover{text-decoration:underline}
    .hidden{display:none !important}

    /* Topbar */
    .topline-bar{
      position:fixed; inset:0 0 auto 0; height:var(--topbar-h);
      display:flex; align-items:center; justify-content:flex-end; gap:.75rem; padding:0 14px;
      background: linear-gradient(180deg, rgba(0,0,0,.06), rgba(22,22,23,0));
      z-index:50; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    html:not(.dark) .topline-bar{ background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(255,255,255,0)); }
    .topline-bar::before{
      content:""; position:absolute; left:0; right:0; top:0; height:3px;
      background: linear-gradient(90deg,#22c55e,#06b6d4,#6366f1); opacity:.95;
    }

    /* Toggle de tema (mesmo visual do seu) */
    .theme-toggle{
      --w:78px; --h:34px; --p:3px; --k:28px; --dx: calc(var(--w) - var(--k) - var(--p)*2);
      position:relative; width:var(--w); height:var(--h); padding:var(--p); border-radius:999px;
      cursor:pointer; outline:none; border:1px solid; display:inline-block; isolation:isolate;
      background:#eceff3; border-color:#d5d9e0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 2px rgba(0,0,0,.05);
      transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    html.dark .theme-toggle{ background:#2f323a; border-color:#3a3e46; box-shadow: inset 0 2px 5px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.03); }
    .theme-toggle .slot{ position:absolute; top:50%; width:28px; height:28px; margin-top:-14px; display:grid; place-items:center; pointer-events:none; opacity:.75; }
    .theme-toggle .slot svg{ width:18px; height:18px; } .theme-toggle .slot.left{ left:8px; } .theme-toggle .slot.right{ right:8px; }
    .theme-toggle .slot svg *{ stroke:#9aa3af; } html.dark .theme-toggle .slot svg *{ stroke:#8a93a1; }
    .theme-toggle .thumb{
      position:absolute; top:var(--p); left:var(--p); width:var(--k); height:var(--k); border-radius:999px;
      transform: translateX(0);
      transition: transform .38s cubic-bezier(.28,1.2,.43,1), box-shadow .2s ease, background .3s ease;
      display:grid; place-items:center; overflow:hidden;
      background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
                  linear-gradient(180deg,#f8c266,#f59e0b);
      box-shadow: 0 4px 8px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .thumb svg{ width:22px; height:22px; display:block; }
    .thumb .thumb-sun{ display:block; } .thumb .thumb-moon{ display:none; }
    html.dark .theme-toggle .thumb{
      transform: translateX(var(--dx));
      background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
                  linear-gradient(180deg,#6ba6ff,#2563eb);
      box-shadow: 0 6px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.22);
    }
    html.dark .thumb .thumb-sun{ display:none; } html.dark .thumb .thumb-moon{ display:block; }
    .theme-toggle:active .thumb{ transform:translateX(0) scale(.96); }
    html.dark .theme-toggle:active .thumb{ transform:translateX(calc(var(--dx))) scale(.96); }
    .theme-toggle:focus-visible{ box-shadow: 0 0 0 3px rgba(99,102,241,.35); }
    .theme-toggle.t-anim::after{
      content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
      animation: sweep .55s ease both;
    }
    @keyframes sweep { from{opacity:0; transform:translateX(-20%)} to{opacity:1; transform:translateX(0)} }

    /* Shell responsivo */
    .page-shell{
      min-height: 100dvh;
      display:flex; align-items:center; justify-content:center;
      padding: calc(var(--topbar-h) + 16px) 16px 20px 16px;
      gap:16px;
    }
    @media (min-width: 768px){
      .page-shell{ padding: calc(var(--topbar-h) + 24px) 24px 24px; }
    }

    /* Autofill claro/escuro */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #111827;
      box-shadow: 0 0 0px 1000px #ffffff inset !important;
      transition: background-color 9999s ease-out, color 9999s ease-out;
      caret-color: #111827;
      border-radius: .5rem;
    }
    html.dark input:-webkit-autofill,
    html.dark input:-webkit-autofill:hover,
    html.dark input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e5e7eb;
      box-shadow: 0 0 0px 1000px #0a0a0a inset !important;
      caret-color: #e5e7eb;
      border-radius: .5rem;
    }

    /* Cartão */
    .auth-card{
      width:100%;
      max-width:448px;             /* "max-w-[28rem]" */
      background:var(--card);
      color:var(--text);
      border:1px solid transparent;
      border-radius: 16px;          /* rounded-2xl */
      box-shadow: var(--shadow-2xl);
      overflow:hidden;
      display:flex; flex-direction:column;
      margin-left:auto; margin-right:auto;
    }
    html.dark .auth-card{ border-color: var(--border-2); }

    @media (min-width:768px){
      .auth-card{ max-width:1024px; flex-direction:row; }
    }

    /* Coluna esquerda (ilustração) */
    .illustration{
      display:none;
      background: var(--green-100);
      align-items:center; justify-content:center;
      padding:32px;
    }
    @media (min-width:768px){
      .illustration{ display:flex; width:50%; }
    }

    /* Coluna direita (form) */
    .form-pane{ width:100%; padding:24px; }
    @media (min-width:640px){ .form-pane{ padding:32px; } }
    @media (min-width:768px){ .form-pane{ width:50%; } }

    .title-wrap{ text-align:center; margin-bottom:24px; }
    .title-wrap h1{
      margin:0 0 6px 0;
      font-weight:800; color:var(--text-strong);
      font-size: 1.875rem; /* 3xl */
    }
    @media (min-width:768px){ .title-wrap h1{ font-size:2.25rem; } } /* 4xl */
    .title-wrap p{ margin:0; color:var(--muted); }

    /* Lo/go claro/escuro (emulando dark:hidden / dark:block) */
    .dark\:hidden { /* só referência ao nome; no claro, não faz nada */ }
    html.dark .dark\:hidden{ display:none !important; }
    .dark\:block { display:none; }
    html.dark .dark\:block{ display:block; }

    /* Form */
    .vstack > * + *{ margin-top:1rem; }  /* space-y-4 */
    label{ display:block; margin-bottom:4px; font-weight:600; color:var(--text); }
    input[type="text"], input[type="password"]{
      height:48px; width:100%;
      padding:0 16px;
      border-radius: 10px;            /* rounded-lg */
      border:1px solid var(--border);
      background: #ffffff;
      color: #1f2937;
      outline: none;
      transition: box-shadow .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }
    html.dark input[type="text"], html.dark input[type="password"]{
      background:#111111; color:#e5e7eb; border-color:#404040;
    }
    input[type="text"]:focus, input[type="password"]:focus{
      box-shadow: 0 0 0 3px rgba(74, 222, 128, .45);
      border-color: #86efac;
    }

    .row{
      display:flex; flex-direction:column; gap:12px;
    }
    @media (min-width:640px){
      .row{ flex-direction:row; align-items:center; justify-content:space-between; }
    }
    .checkbox{
      display:inline-flex; gap:.5rem; align-items:center; color:var(--text);
      font-size:.95rem;
    }
    .checkbox input{
      width:16px; height:16px; border-radius:4px; border:1px solid var(--border); background:#fff;
    }
    html.dark .checkbox input{ border-color:#404040; background:#111; }

    .link{ color:#22c55e; font-weight:600; }

    .erro{ color:#ef4444; font-size:.9rem; display:none; }
    .erro.show{ display:block; }

    .btn{
      height:48px; width:100%;
      border:none; border-radius:10px;
      background:#22c55e; color:white; font-weight:600;
      transition: filter .15s ease, opacity .15s ease, transform .02s ease;
      cursor:pointer;
    }
    .btn:hover{ filter:brightness(0.95); background:#16a34a; }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    /* Botão olho (centralizado no input) */
    .input-wrap{ position:relative; }
    .pass-btn{
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      display:grid; place-items:center;
      height:32px; width:32px; border-radius:8px;
      color:#6b7280; background:transparent; border:none; cursor:pointer;
      transition: background .15s ease;
    }
    .pass-btn:hover{ background: rgba(0,0,0,.05); }
    html.dark .pass-btn{ color:#9ca3af; }
    html.dark .pass-btn:hover{ background: rgba(255,255,255,.06); }

    /* Cartão borda/sombra para claro/escuro */
    .shadow-2xl{ box-shadow: var(--shadow-2xl); }
    .border-transparent{ border-color:transparent; }
    html.dark .border-neutral-800{ border-color:#262626; }
  </style>
</head>

<body>
  <!-- TOPBAR -->
  <div class="topline-bar">
    <button id="themeSwitch" class="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
      <span class="slot left" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.5" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="slot right" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="none"/>
        </svg>
      </span>
      <span class="thumb" aria-hidden="true">
        <svg class="thumb-sun" viewBox="0 0 24 24">
          <defs><radialGradient id="sunGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#ffd27a"/><stop offset="60%" stop-color="#f8c266"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient></defs>
        <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad)"/></svg>
        <svg class="thumb-moon" viewBox="0 0 24 24">
          <defs><radialGradient id="moonGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#9fc3ff"/><stop offset="60%" stop-color="#6ba6ff"/><stop offset="100%" stop-color="#2563eb"/></radialGradient></defs>
        <circle cx="12" cy="12" r="11" fill="url(#moonGrad)"/></svg>
      </span>
    </button>
  </div>

  <!-- Conteúdo -->
  <main class="page-shell">
    <div class="auth-card shadow-2xl border-transparent border-neutral-800">
      <!-- Ilustração (>= md) -->
      <div class="illustration">
        <img src="/img/login-illustration.png" alt="Ilustração" class="object-contain h-100">
      </div>

      <!-- Formulário -->
      <div class="form-pane">
        <div class="title-wrap">
          <img src="/img/Logo.png" alt="ZapChats" class="mx-auto h-14 dark:hidden" style="height:56px; margin-inline:auto; margin-bottom:16px;">
          <img src="/img/Logo-white.png" alt="ZapChats" class="mx-auto h-14 dark:block" style="height:56px; margin-inline:auto; margin-bottom:16px;">
          <h1>Acesse sua conta</h1>
          <p>Faça login para continuar</p>
        </div>

        <form id="form-login" class="vstack" autocomplete="on">
          <div>
            <label for="email">E-mail</label>
            <input id="email" type="text" name="email" required
                   pattern="^[^\s]+@[^\s]+$"
                   title="O e-mail deve conter @ e não pode ter espaços"
                   placeholder="usuario@dominio">
          </div>

          <div>
            <label for="senha">Senha</label>
            <div class="input-wrap">
              <input id="senha" type="password" name="senha" required placeholder="••••••••" style="padding-right:48px;">
              <button type="button" id="togglePassBtn" class="pass-btn" aria-label="Mostrar senha">
                <svg id="eye-open" viewBox="0 0 24 24" class="" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3.2"/>
                </svg>
                <svg id="eye-off" viewBox="0 0 24 24" class="hidden" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.5 19.5 0 0 1 5.11-5.79M9.9 4.24A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a19.7 19.7 0 0 1-3.06 3.95"/>
                  <path d="M1 1l22 22"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="row" style="font-size:14px;">
            <label class="checkbox">
              <input id="remember" type="checkbox">
              Lembrar de mim
            </label>
            <a id="link-forgot" href="/esqueci_senha" class="link">Esqueci minha senha</a>
          </div>

          <div id="erro" class="erro"></div>

          <button id="btn-login" type="submit" class="btn">Entrar</button>
        </form>

        <p style="margin-top:32px; text-align:center; color:var(--muted);">
          Ainda não tem conta?
          <a href="/criar-empresa.html" class="link">Cadastre-se</a>
        </p>
      </div>
    </div>
  </main>

  <!-- scripts -->
  <script src="/frontend/assets/guard-devtools.js" defer></script>
  <script src="/frontend/js/pages/login.js" defer></script>
</body>
</html>
