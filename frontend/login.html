<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login – ZapChats</title>

  <!-- Inter (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Preload do tema (evita FOUC) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t || t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch {}
    })();
  </script>

  <!-- CSS próprio -->
  <link rel="stylesheet" href="/frontend/css/login.css">
</head>

<body>
  <!-- TOPBAR -->
  <div class="topline-bar">
    <button id="themeSwitch" class="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
      <span class="slot left" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.5" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="slot right" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="none"/>
        </svg>
      </span>
      <span class="thumb" aria-hidden="true">
        <svg class="thumb-sun" viewBox="0 0 24 24">
          <defs><radialGradient id="sunGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#ffd27a"/><stop offset="60%" stop-color="#f8c266"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient></defs>
          <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad)"/>
        </svg>
        <svg class="thumb-moon" viewBox="0 0 24 24">
          <defs><radialGradient id="moonGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#9fc3ff"/><stop offset="60%" stop-color="#6ba6ff"/><stop offset="100%" stop-color="#2563eb"/></radialGradient></defs>
          <circle cx="12" cy="12" r="11" fill="url(#moonGrad)"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- Conteúdo -->
  <main class="page-shell">
    <div class="login-card">
      <!-- Ilustração -->
      <div class="login-illustration">
        <img src="/img/login-illustration.png" alt="Ilustração">
      </div>

      <!-- Formulário -->
      <div class="login-form">
        <div class="head-block">
          <img src="/img/Logo.png" alt="ZapChats" class="logo">
          <img src="/img/Logo-white.png" alt="ZapChats" class="logo-dark">
          <h1 class="title">Acesse sua conta</h1>
          <p class="subtitle">Faça login para continuar</p>
        </div>

        <form id="form-login" class="form" autocomplete="on">
          <div class="field">
            <label class="label">E-mail</label>
            <input id="email" type="text" name="email" required class="input" placeholder="usuario@dominio">
            <small id="email-help" class="muted" style="display:block;margin-top:6px"></small>
          </div>

          <div class="field">
            <label class="label">Senha</label>
            <div class="input-wrap">
              <input id="senha" type="password" name="senha" required class="input" placeholder="••••••••">
              <button type="button" id="togglePassBtn" class="icon-btn" aria-label="Mostrar senha">
                <!-- aberto -->
                <svg id="eye-open" viewBox="0 0 24 24">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                  <circle cx="12" cy="12" r="3.2"/>
                </svg>
                <!-- fechado -->
                <svg id="eye-off" viewBox="0 0 24 24" class="hidden">
                  <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a19.5 19.5 0 0 1 5.11-5.79M9.9 4.24A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a19.7 19.7 0 0 1-3.06 3.95"/>
                  <path d="M1 1l22 22"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="row-between">
            <label class="muted" style="display:inline-flex;align-items:center;gap:8px">
              <input id="remember" type="checkbox" style="width:16px;height:16px">
              Lembrar de mim
            </label>
            <a id="link-forgot" href="/esqueci_senha" class="link">Esqueci minha senha</a>
          </div>

          <div id="erro" class="error hidden"></div>

          <button id="btn-login" type="submit" class="btn btn-primary" style="margin-top:10px">
            Entrar
          </button>
        </form>

        <p class="footer-note">
          Ainda não tem conta? <a href="/criar-empresa" class="link">Cadastre-se</a>
        </p>
      </div>
    </div>
  </main>

  <!-- JS próprio -->
  <script src="/frontend/js/pages/login.js" defer></script>
  <script src="/frontend/assets/guard-devtools.js" defer></script>

</body>
</html>
