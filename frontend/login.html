<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login – ZapChats</title>
  <meta name="color-scheme" content="light dark">

  <!-- Preload do tema: aplica html.dark antes de pintar -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.classList.toggle('dark', !t || t === 'dark');
      } catch {}
    })();
  </script>

  <style>
    /* ============ RESET/BASE ============ */
    *,*::before,*::after{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0; font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji";
      color:#1f2937; background:#f0fdf4;  /* light: bg-green-50 */
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .dark body{ background:#0a0a0a; color:#e5e7eb; } /* dark: neutral-950 */

    a{ color:#22c55e; text-decoration:none; }
    a:hover{ text-decoration:underline; }

    h1{ margin:0 0 .25rem; font-weight:800; line-height:1.15; }
    p{ margin:.25rem 0 0; color:#6b7280; }          /* gray-500 */
    .dark p{ color:#9ca3af; }                      /* gray-400 */

    /* ============ TOPBAR & THEME SWITCH ============ */
    :root{ --topbar-h:44px; }

    .topline-bar{
      position:fixed; inset:0 0 auto 0; height:var(--topbar-h);
      display:flex; align-items:center; justify-content:flex-end; gap:.75rem; padding:0 14px;
      background: linear-gradient(180deg, rgba(0,0,0,.06), rgba(22,22,23,0));
      z-index:50; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    html:not(.dark) .topline-bar{ background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(255,255,255,0)); }
    .topline-bar::before{
      content:""; position:absolute; left:0; right:0; top:0; height:3px;
      background: linear-gradient(90deg,#22c55e,#06b6d4,#6366f1); opacity:.95;
    }

    /* Toggle estilizado */
    .theme-toggle{
      --w:78px; --h:34px; --p:3px; --k:28px; --dx: calc(var(--w) - var(--k) - var(--p)*2);
      position:relative; width:var(--w); height:var(--h); padding:var(--p); border-radius:999px;
      cursor:pointer; outline:none; border:1px solid; display:inline-block; isolation:isolate;
      background:#eceff3; border-color:#d5d9e0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 2px rgba(0,0,0,.05);
      transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
    }
    .dark .theme-toggle{ background:#2f323a; border-color:#3a3e46; box-shadow: inset 0 2px 5px rgba(0,0,0,.35), inset 0 -1px 2px rgba(255,255,255,.03); }
    .theme-toggle .slot{ position:absolute; top:50%; width:28px; height:28px; margin-top:-14px; display:grid; place-items:center; pointer-events:none; opacity:.75; }
    .theme-toggle .slot svg{ width:18px; height:18px; }
    .theme-toggle .slot.left{ left:8px; } .theme-toggle .slot.right{ right:8px; }
    .theme-toggle .slot svg *{ stroke:#9aa3af; } .dark .theme-toggle .slot svg *{ stroke:#8a93a1; }
    .theme-toggle .thumb{
      position:absolute; top:var(--p); left:var(--p); width:var(--k); height:var(--k); border-radius:999px;
      transform: translateX(0);
      transition: transform .38s cubic-bezier(.28,1.2,.43,1), box-shadow .2s ease, background .3s ease;
      display:grid; place-items:center; overflow:hidden;
      background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
                  linear-gradient(180deg,#f8c266,#f59e0b);
      box-shadow: 0 4px 8px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
    }
    .thumb svg{ width:22px; height:22px; display:block; }
    .thumb .thumb-sun{ display:block; } .thumb .thumb-moon{ display:none; }
    .dark .theme-toggle .thumb{
      transform: translateX(var(--dx));
      background: radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.7), rgba(255,255,255,.25) 45%, rgba(255,255,255,.08) 65%),
                  linear-gradient(180deg,#6ba6ff,#2563eb);
      box-shadow: 0 6px 10px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.22);
    }
    .dark .thumb .thumb-sun{ display:none; } .dark .thumb .thumb-moon{ display:block; }
    .theme-toggle:active .thumb{ transform:translateX(0) scale(.96); }
    .dark .theme-toggle:active .thumb{ transform:translateX(calc(var(--dx))) scale(.96); }
    .theme-toggle:focus-visible{ box-shadow: 0 0 0 3px rgba(99,102,241,.35); }
    .theme-toggle.t-anim::after{
      content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
      animation: sweep .55s ease both;
    }
    @keyframes sweep{ from{opacity:0} to{opacity:1} }

    /* ============ LAYOUT ============ */
    .page-shell{
      padding: calc(var(--topbar-h) + 16px) 16px 20px;
      min-height: 100dvh;
      display:flex; align-items:center; justify-content:center; gap:16px;
    }
    @media (min-width: 768px){
      .page-shell{ padding-top: calc(var(--topbar-h) + 24px); padding-left:24px; padding-right:24px; }
    }

    .card-wrap{
      width:100%; max-width:1120px;
      background:#fff; color:#1f2937;
      border-radius:16px; box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
      overflow:hidden; border:1px solid transparent; display:flex; flex-direction:column; margin:0 auto;
    }
    .dark .card-wrap{ background:#171717; color:#e5e7eb; box-shadow:0 25px 50px -12px rgba(0,0,0,.4); border-color:#262626; }

    @media (min-width: 768px){
      .card-wrap{ flex-direction:row; }
      .illustration{ display:flex; width:50%; }
    }

    .illustration{
      display:none;
      background:#dcfce7; /* green-100 */
      align-items:center; justify-content:center; padding:32px;
    }
    .dark .illustration{ background:#262626; }
    .illustration img{ max-height:26rem; object-fit:contain; }

    .form-side{ width:100%; padding:24px; }
    @media (min-width: 640px){ .form-side{ padding:32px; } }

    .logo-row{ text-align:center; margin-bottom:24px; }
    .logo{ height:56px; margin:0 auto 16px; display:block; }
    .logo-dark{ display:none; } .dark .logo-dark{ display:block; } .dark .logo-light{ display:none; }

    /* ============ FORM ============ */
    .form-grid{ display:grid; gap:16px; }

    label{ display:block; margin:0 0 6px; font-weight:600; color:#374151; } /* gray-700 */
    .dark label{ color:#e5e7eb; }

    .input{
      height:48px; width:100%;
      padding:0 16px;
      border:1px solid #d1d5db; border-radius:10px;  /* gray-300 */
      background:#fff; color:#111827;                /* gray-900 */
      outline:none; transition:.2s border, .2s box-shadow, .2s background;
    }
    .input:focus{ border-color:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.35); } /* ring green-400 */
    .input::placeholder{ color:#9ca3af; }

    .dark .input{
      background:#0f0f10; color:#f3f4f6; border-color:#3f3f46; /* neutral-900/700 */
    }
    .dark .input:focus{ border-color:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.35); }

    .password-wrap{ position:relative; }
    .toggle-pass{
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      height:32px; width:32px; display:grid; place-items:center;
      border-radius:8px; color:#6b7280; background:transparent; border:none; cursor:pointer;
    }
    .toggle-pass:hover{ background:rgba(0,0,0,.05); }
    .dark .toggle-pass{ color:#9ca3af; }
    .dark .toggle-pass:hover{ background:rgba(255,255,255,.06); }

    .row-flex{
      display:flex; flex-direction:column; gap:12px; font-size:.925rem; align-items:flex-start; justify-content:space-between;
    }
    @media (min-width:640px){ .row-flex{ flex-direction:row; align-items:center; } }

    .checkbox{ height:16px; width:16px; border:1px solid #d1d5db; border-radius:4px; vertical-align:middle; }
    .dark .checkbox{ border-color:#3f3f46; background:#0f0f10; }

    .btn{
      height:48px; width:100%; border-radius:10px; font-weight:600; border:none; cursor:pointer;
      color:#fff; background:#22c55e; transition:.15s background, .15s opacity;
    }
    .btn:hover{ background:#16a34a; }        /* green-600 */
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .error{ color:#ef4444; font-size:.9rem; display:none; }
    .error.show{ display:block; }

    /* ==== FIX: autofill claro/escuro ==== */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #111827;
      box-shadow: 0 0 0px 1000px #ffffff inset !important;
      transition: background-color 9999s ease-out, color 9999s ease-out;
      caret-color: #111827; border-radius:.5rem;
    }
    .dark input:-webkit-autofill,
    .dark input:-webkit-autofill:hover,
    .dark input:-webkit-autofill:focus {
      -webkit-text-fill-color: #e5e7eb;
      box-shadow: 0 0 0px 1000px #0a0a0a inset !important;
      caret-color: #e5e7eb; border-radius:.5rem;
    }
    .dark ::placeholder { color:#9ca3af; }

    /* utilidades pequenas */
    .text-center{ text-align:center; }
    .muted{ color:#6b7280; } .dark .muted{ color:#d1d5db; }
  </style>
</head>

<body>
  <!-- TOPBAR -->
  <div class="topline-bar">
    <button id="themeSwitch" class="theme-toggle" aria-label="Alternar tema" aria-pressed="false">
      <span class="slot left" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.5" fill="none"/>
          <line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
          <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
        </svg>
      </span>
      <span class="slot right" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8z" fill="none"/>
        </svg>
      </span>
      <span class="thumb" aria-hidden="true">
        <svg class="thumb-sun" viewBox="0 0 24 24">
          <defs><radialGradient id="sunGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#ffd27a"/><stop offset="60%" stop-color="#f8c266"/><stop offset="100%" stop-color="#f59e0b"/></radialGradient></defs>
          <circle cx="12" cy="12" r="6.3" fill="url(#sunGrad)"/>
        </svg>
        <svg class="thumb-moon" viewBox="0 0 24 24">
          <defs><radialGradient id="moonGrad" cx="30%" cy="30%" r="80%"><stop offset="0%" stop-color="#9fc3ff"/><stop offset="60%" stop-color="#6ba6ff"/><stop offset="100%" stop-color="#2563eb"/></radialGradient></defs>
          <circle cx="12" cy="12" r="11" fill="url(#moonGrad)"/>
        </svg>
      </span>
    </button>
  </div>

  <!-- Conteúdo -->
  <main class="page-shell">
    <div class="card-wrap">
      <!-- Ilustração -->
      <div class="illustration">
        <img src="/img/login-illustration.png" alt="Ilustração" />
      </div>

      <!-- Formulário -->
      <div class="form-side">
        <div class="logo-row">
          <img src="/img/Logo.png" alt="ZapChats" class="logo logo-light">
          <img src="/img/Logo-white.png" alt="ZapChats" class="logo logo-dark">
          <h1 class="text-center" style="font-size:clamp(28px,3vw,36px)">Acesse sua conta</h1>
          <p class="text-center">Faça login para continuar</p>
        </div>

        <form id="form-login" class="form-grid" autocomplete="on">
          <div>
            <label for="email">E-mail</label>
            <input id="email" type="text" name="email" required
                   pattern="^[^\\s]+@[^\\s]+$"
                   title="O e-mail deve conter @ e não pode ter espaços"
                   class="input"
                   placeholder="usuario@dominio">
          </div>

          <div>
            <label for="senha">Senha</label>
            <div class="passw
