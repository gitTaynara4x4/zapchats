<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Acesse sua conta | ZapsChat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/frontend/css/login.css" />
</head>
<body>
  <div class="login-page">
    <aside class="login-hero" aria-label="ZapsChat atendimento inteligente no WhatsApp"></aside>

    <main class="login-panel">
      <section class="login-box" aria-labelledby="login-title">
        <header class="login-header">
          <a class="brand-logo" href="/" aria-label="ZapsChat">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M32 8C18.745 8 8 18.05 8 30.447c0 4.548 1.45 8.78 3.94 12.317L9 56l13.88-3.25A25.7 25.7 0 0 0 32 54c13.255 0 24-10.05 24-22.447C56 18.05 45.255 8 32 8Z" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M23.5 22.8c.45-1.1 1.25-1.2 2.05-1.2h1.45c.65 0 1.25.4 1.5 1l1.95 4.45c.3.7.15 1.5-.35 2.05l-1.25 1.35c1.85 3.2 4.45 5.75 7.8 7.55l1.45-1.2c.6-.5 1.4-.6 2.1-.3l4.25 1.9c.65.3 1.05.95 1 1.65-.1 1.75-.55 3.2-1.7 4.05-1.05.8-2.5 1.05-4.2.75-9.2-1.7-16.8-9.05-18.7-18.1-.35-1.6-.1-2.95.75-3.95Z" fill="currentColor" />
              </svg>
            </span>
            <span class="brand-text"><b>Zaps</b>Chat</span>
          </a>

          <h1 id="login-title" class="title">Bem-vindo de volta!</h1>
          <p class="subtitle">Faça login para acessar o painel.</p>
        </header>

        <form
          id="form-login"
          class="form"
          action="/api/auth/login"
          method="post"
          autocomplete="on"
          novalidate
        >
          <div id="erro" class="error-box hidden" role="alert" aria-live="polite"></div>

          <div id="step1-fields">
            <div class="field">
              <label class="label" for="email">E-mail</label>
              <div class="input-wrap has-left-icon">
                <span class="field-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" />
                    <path d="m22 8-10 6L2 8" />
                  </svg>
                </span>
                <input
                  id="email"
                  name="username"
                  type="email"
                  class="input"
                  placeholder="seu@email.com"
                  autocomplete="username"
                  inputmode="email"
                  autocapitalize="off"
                  spellcheck="false"
                  required
                />
              </div>
              <small id="email-help" class="field-help hidden"></small>
            </div>

            <div class="field">
              <label class="label" for="senha">Senha</label>
              <div class="input-wrap has-left-icon has-right-icon">
                <span class="field-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="10" width="16" height="10" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                  </svg>
                </span>
                <input
                  id="senha"
                  name="password"
                  type="password"
                  class="input"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />

                <button type="button" id="togglePassBtn" class="icon-btn" aria-label="Mostrar senha">
                  <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg id="eye-off" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.9 4.24A9.7 9.7 0 0 1 12 4c6.2 0 10 8 10 8a18.5 18.5 0 0 1-2.24 3.22" />
                    <path d="M14.12 14.12A3 3 0 0 1 9.88 9.88" />
                    <path d="M6.1 6.1C3.5 7.9 2 12 2 12s3.8 8 10 8c2.1 0 3.9-.62 5.4-1.5" />
                    <path d="M3 3l18 18" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="login-options">
              <label class="check-label" for="remember">
                <input id="remember" type="checkbox" />
                <span>Lembrar e-mail</span>
              </label>

              <a href="/esqueci_senha" class="link" id="link-forgot">Esqueceu a senha?</a>
            </div>
          </div>

          <div id="step2-fields" class="hidden">
            <div class="field">
              <label class="label" for="login-token">Código de verificação</label>
              <p id="token-info" class="token-info">Enviamos um código de acesso para o seu e-mail.</p>
              <input
                id="login-token"
                name="one-time-code"
                type="text"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="6"
                class="input token-input"
                placeholder="000000"
                autocomplete="one-time-code"
              />
            </div>

            <button type="button" id="btn-token-back" class="btn-ghost">
              &larr; Voltar para senha
            </button>
          </div>

          <button id="btn-login" type="submit" class="btn-primary">Entrar</button>
        </form>

        <p class="footer-note">
          Ainda não tem conta? <a href="/criar-empresa.html" class="link">Cadastre-se</a>
        </p>
      </section>
    </main>
  </div>

  <script src="/frontend/js/pages/login.js" defer></script>
  <script src="/frontend/assets/guard-devtools.js" defer></script>
</body>
</html>
